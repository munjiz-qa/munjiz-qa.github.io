name: Mishkat live screenshots
# مؤقت: صور من الموقع المنشور نفسه للتحقق من ظهور التحديث (يُحذف بعد الاستعمال)
on:
  push:
    branches: ['claude/project-thread-mx1e87']
    paths: ['scripts/mishkat-live-shots.mjs', '.github/workflows/mishkat-live-shots.yml']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/mishkat-live-shots.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add live-shots
          git commit -m "صور من الموقع المنشور" && git push
