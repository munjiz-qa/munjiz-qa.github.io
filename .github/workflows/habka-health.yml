name: مراقبة حبكة
on:
  push:
    branches: [main]
    paths: ['habka/**', 'scripts/habka-e2e.mjs', '.github/workflows/habka-health.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: habka-health
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: انتظار النشر عند التحديث
        if: github.event_name == 'push'
        run: sleep 90
      - name: التحقق من ملفات الموقع المنشور
        run: |
          set -e
          base=https://munjiz-qa.github.io/habka
          for f in "" assets/app.js assets/app.css assets/config.js assets/logo.svg assets/og.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 "$base/$f?t=$(date +%s)")
            echo "$code $base/$f"; [ "$code" = "200" ] || { echo "::error::$f غير متاح"; exit 1; }
          done
      - name: تجهيز متصفح الاختبار
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep 20; done
          exit 1
      - name: اختبار الموقع المنشور بكل الأدوار على الكمبيوتر والجوال
        run: node scripts/habka-e2e.mjs https://munjiz-qa.github.io/habka/ shots
      - name: حفظ لقطات الشاشة
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: habka-shots
          path: shots
