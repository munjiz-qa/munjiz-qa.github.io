name: Abdo News mirror
# «عبدو نيوز»: يبقي abdo-news/ (العنوان الرسمي) نسخة مطابقة من khabar/ بعد كل تحديث.
on:
  push:
    branches: [main]
    paths: ['khabar/**']
  workflow_run:
    workflows: ['Khabar agent', 'Khabar autopilot', 'Khabar headlines']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abdo-news-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: python3 khabar/scripts/mirror_abdo.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A abdo-news
          git diff --cached --quiet && exit 0
          git commit -q -m "عبدو نيوز: مزامنة النسخة الرسمية"
          for i in 1 2 3; do git pull --rebase -q && python3 khabar/scripts/mirror_abdo.py && git add -A abdo-news && (git diff --cached --quiet || git commit -q -m "عبدو نيوز: مزامنة النسخة الرسمية") ; git push && exit 0; sleep 5; done; exit 1
