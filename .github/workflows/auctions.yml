name: Qatar auctions news
on:
  schedule:
    - cron: '45 4,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: auctions
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/auctions.mjs
      - name: Commit if changed
        run: |
          git config user.name "auctions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auctions.json
          git diff --cached --quiet || (git commit -m "تحديث أخبار المزادات" && git pull --rebase -q && git push)
