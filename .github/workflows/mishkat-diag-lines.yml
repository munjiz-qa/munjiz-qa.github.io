name: Mishkat lines diag (temporary)
on:
  push:
    branches: [claude/project-thread-mx1e87]
    paths: ['scripts/mishkat-diag-lines.mjs']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/mishkat-diag-lines.mjs
