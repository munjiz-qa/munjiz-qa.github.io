# بيانات «بصيرة كولر» من مصادر نظامية فقط: دليل الجهات والمنشآت المنشور (data/directory-sources.tsv)
# وبلاغات «لا تتصل» المفتوحة من لجنة التجارة الفيدرالية الأمريكية (FTC). تحديث أسبوعي آلي للملفات فقط؛
# تطبيق server/seed-data.sql على قاعدة Supabase يتم يدوياً بموافقة صاحب المشروع.
name: Basira Caller Data
on:
  schedule: [{ cron: '17 3 * * 0' }]
  push:
    branches: [main]
    paths: ['basira-caller/data/directory-sources.tsv', 'scripts/basira-caller-build-data.cjs', 'scripts/basira-caller-fetch-ftc.cjs', '.github/workflows/basira-caller-data.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: basira-caller-data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch FTC open complaint data
        run: node scripts/basira-caller-fetch-ftc.cjs 30 || echo "FTC fetch failed; keeping previous file"
      - name: Build directory.json and seed-data.sql
        run: node scripts/basira-caller-build-data.cjs
      - name: Commit data files
        run: |
          git config user.name "basira-caller-bot"
          git config user.email "basira-caller-bot@users.noreply.github.com"
          git add basira-caller/data basira-caller/server/seed-data.sql
          git diff --cached --quiet && exit 0
          git commit -m "بصيرة كولر: تحديث بيانات الدليل والبلاغات الرسمية"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
