name: Binaa Builder live check
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['binaa-builder/**', 'scripts/binaa-health.mjs']
permissions:
  contents: read
concurrency: binaa-health
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Wait for Pages to publish the latest push
        if: github.event_name == 'push'
        run: sleep 90
      - run: node scripts/binaa-health.mjs
        env:
          BINAA_ADMIN_PASSWORD: ${{ secrets.BINAA_ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binaa-health
          path: binaa-health/
          retention-days: 14
