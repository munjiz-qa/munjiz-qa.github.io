name: Mishwar weather, road news and closures
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths: ['mishwar/closures.json', 'scripts/mishwar-feed.mjs']
permissions:
  contents: write
concurrency: mishwar-feed
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/mishwar-feed.mjs
      - name: Commit if changed
        run: |
          git config user.name "munjiz-mishwar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mishwar/feed.json
          git diff --cached --quiet || (git commit -m "مشوار: تحديث الطقس وأخبار الطريق" && git pull --rebase -q && git push)
