name: Autopilot probe (temporary)
on:
  push:
    branches: [khabar-autonomy]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node khabar/scripts/autopilot.mjs --force --dry
      - run: |
          for u in https://www.gulf-times.com/rss https://thepeninsulaqatar.com/rss https://www.arabnews.com/cat/1/rss.xml https://www.youm7.com/rss/SectionRss?SectionID=65 https://english.ahram.org.eg/rss/1.aspx https://feeds.bbci.co.uk/arabic/rss.xml https://feeds.bbci.co.uk/news/world/rss.xml https://www.aljazeera.com/xml/rss/all.xml https://www.aljazeera.net/aljazeerarss/a7c186be-1baa-4bd4-9d80-a84db769f779/73d0e1b4-532f-45ef-b135-bfdff8b8cab9 https://www.skynewsarabia.com/web/rss https://www.qna.org.qa/ar-QA/rss https://www.alarabiya.net/feed/rss2/ar.xml https://www.spa.gov.sa/rss https://www.wam.ae/ar/rss https://www.masrawy.com/rss/feed/25/ https://al-sharq.com/rss https://www.raya.com/rss https://www.alwatan.com.qa/rss https://rss.dw.com/rdf/rss-ar-all https://www.france24.com/ar/rss; do
            c=$(curl -s -L -A 'Mozilla/5.0' -m 20 -o /tmp/f -w '%{http_code}' "$u"); echo "$c $(grep -o '<item' /tmp/f | wc -l) $u"; done
