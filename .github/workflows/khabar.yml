name: Khabar headlines
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: khabar
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node khabar/scripts/headlines.mjs
      # أخبار المناخ والطقس حول العالم: لا يُنشر إلا ما نقلته جهتان مستقلتان، ولا يتوقف التحديث إن تعطلت خطوة العناوين
      - run: node khabar/scripts/climate.mjs
        continue-on-error: true
      # الأقسام الموضوعية: عناقيد من جهتين مستقلتين لكل قسم، وأسعار ونتائج لا تُنشر إلا باتفاق مزوّدين، ثم بوابة التحقق
      - run: node khabar/scripts/desks.mjs
        continue-on-error: true
        timeout-minutes: 15
      - run: python3 khabar/agent/desks.py --enforce --quiet
      # فهرس البحث، وتقرير الشفافية، وخلاصات RSS، وخرائط الموقع
      - run: node khabar/scripts/build.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "khabar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add khabar/data/headlines.json khabar/data/climate.json khabar/data/desks.json khabar/data/editorial.json khabar/data/search.json khabar/data/transparency.json khabar/feeds khabar/s khabar/sitemap.xml khabar/news-sitemap.xml
          git diff --cached --quiet || (git commit -m "خبر: تحديث العناوين الآلية وأخبار المناخ والأقسام" && git pull --rebase -q && git push)
