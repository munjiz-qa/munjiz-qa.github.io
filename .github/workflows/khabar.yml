name: Khabar headlines
on:
  schedule:
    # جدولة GitHub تُسقط كثيراً من التشغيلات وقت الضغط (لم يعمل فعلياً إلا كل 6 إلى 9 ساعات)،
    # فتُضاف مواعيد احتياطية كل ساعة، وتتخطاها بوابة «حداثة» إن كانت العناوين محدّثة قبل أقل من ساعتين ونصف.
    - cron: '20 */3 * * *'
    - cron: '50 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: khabar
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: khabar/data/headlines.json
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "20 */3 * * *" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(python3 -c "import json,datetime as d;u=json.load(open('khabar/data/headlines.json'))['updated'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u.replace('Z','+00:00'))).total_seconds()//60))" 2>/dev/null || echo 9999)
          echo "عمر العناوين: ${age} دقيقة"
          if [ "$age" -ge 150 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node khabar/scripts/headlines.mjs
      # أخبار المناخ والطقس حول العالم: لا يُنشر إلا ما نقلته جهتان مستقلتان، ولا يتوقف التحديث إن تعطلت خطوة العناوين
      - run: node khabar/scripts/climate.mjs
        continue-on-error: true
      # الأقسام الموضوعية: عناقيد من جهتين مستقلتين لكل قسم، وأسعار ونتائج لا تُنشر إلا باتفاق مزوّدين، ثم بوابة التحقق
      - run: node khabar/scripts/desks.mjs
        continue-on-error: true
        timeout-minutes: 15
      - run: python3 khabar/agent/desks.py --enforce --quiet
      # الأوضاع في الدول: ستة محاور لكل دولة، لا يُنشر خبر إلا من جهتين مستقلتين، ومؤشر الاستقرار والخط الزمني ورصد التظاهرات
      - run: node khabar/scripts/countries.mjs
        continue-on-error: true
        timeout-minutes: 15
      - run: python3 khabar/agent/countries.py --enforce --quiet
      # ملخص الدول للصفحة الرئيسية (عُشر حجم الملف الكامل)، منسوخ منه بعد البوابة
      - run: python3 khabar/scripts/countries_home.py
      # التوقعات: مؤشرات صندوق النقد والبنك الدولي، وأحداث موثّقة بجهتين، ونموذج معلن يحسب الاحتمالات ونطاق الثقة لكل دولة وجانب
      - run: node khabar/scripts/forecast.mjs
        continue-on-error: true
        timeout-minutes: 10
      - run: python3 khabar/agent/forecast.py --enforce --quiet
      # فهرس البحث، وتقرير الشفافية، وخلاصات RSS، وخرائط الموقع
      - run: node khabar/scripts/build.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "khabar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add khabar/data/headlines.json khabar/data/climate.json khabar/data/desks.json khabar/data/editorial.json khabar/data/countries.json khabar/data/countries-home.json khabar/data/countries-editorial.json khabar/data/countries-check.json khabar/data/forecast.json khabar/data/forecast khabar/data/search.json khabar/data/transparency.json khabar/feeds khabar/s khabar/sitemap.xml khabar/news-sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -q -m "خبر: تحديث العناوين الآلية وأخبار المناخ والأقسام"
          # الملفات المشتقة (فهرس البحث وتقرير الشفافية) قد تتعارض مع التزام آخر؛ تُقدَّم نسخة هذا التشغيل، ويُلغى أي دمج عالق قبل المحاولة التالية
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done; exit 1
