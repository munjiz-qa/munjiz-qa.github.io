name: مراقبة تطبيق سند
# يتحقق كل ساعة من أن تطبيق سند المنشور يعمل دون Claude بكل الأدوار (زائر، وعميل، ومدير شامل، ومدير)
on:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths: ['sanad/app/**', 'scripts/sanad-app-e2e.cjs', '.github/workflows/sanad-health.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: تجهيز متصفح الاختبار
        run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: اختبار ملفات المستودع
        run: node scripts/sanad-app-e2e.cjs web sanad/app shots-repo
      - name: انتظار النشر عند التحديث
        if: github.event_name == 'push'
        run: sleep 90
      - name: التحقق من أن الملفات المنشورة مطابقة للمستودع
        run: |
          set -e
          base=https://munjiz-qa.github.io/sanad/app
          for f in index.html login.html admin.html local-backend.js assistant.js runtime.js; do
            code=$(curl -s -o /tmp/f -w '%{http_code}' --retry 3 --retry-delay 10 "$base/$f?t=$(date +%s)")
            echo "$code $base/$f"
            [ "$code" = "200" ] || { echo "::error::الملف $f غير متاح ($code)"; exit 1; }
            cmp -s /tmp/f "sanad/app/$f" || echo "::warning::$f المنشور يختلف عن المستودع (قد يكون النشر جارياً)"
          done
      - name: اختبار الموقع المنشور بكل الأدوار على الكمبيوتر والجوال
        env:
          SANAD_URL: https://munjiz-qa.github.io/sanad/app
        run: node scripts/sanad-app-e2e.cjs web sanad/app shots-live
      - name: حفظ لقطات الشاشة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanad-shots
          path: shots-*
          retention-days: 7
