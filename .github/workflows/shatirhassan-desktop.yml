# حزمة «شاطر حسن على الكمبيوتر»: تُبنى من ملفات shatirhassan/ ثم تُختبر بكل الأدوار على ويندوز وماك ولينكس حقيقيين، ثم تُنشر في
# https://github.com/munjiz-qa/munjiz-qa.github.io/releases/download/shatirhassan-desktop/ShatirHassan-Desktop.zip
name: Shatir Hassan desktop
on:
  push:
    branches: [main, 'claude/**']
    paths: ['shatirhassan/index.html', 'shatirhassan/app/**', 'scripts/shatirhassan-desktop/**', '.github/workflows/shatirhassan-desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shatirhassan-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Build package
        run: |
          mkdir -p work/font && (cd work/font && npm pack @fontsource/ibm-plex-sans-arabic@5 >/dev/null && tar xzf *.tgz)
          python3 scripts/shatirhassan-desktop/build.py work
      - uses: actions/upload-artifact@v4
        with: { name: shatirhassan-desktop, path: dist/ShatirHassan-Desktop.zip }
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/shatirhassan-desktop }
      - uses: actions/download-artifact@v4
        with: { name: shatirhassan-desktop, path: pkg }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install chromium
        shell: bash
      - name: Unpack
        shell: bash
        run: mkdir run && cd run && unzip -q ../pkg/ShatirHassan-Desktop.zip
      - name: Mac launcher starts the program
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SHATIRHASSAN_NO_BROWSER=1 ./run/ShatirHassan/ShatirHassan-Mac.command
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47820/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:47820/app/ >/dev/null && echo " launcher OK"
          pkill -f shatirhassan-mac; sleep 1; rm -rf run/ShatirHassan/data
      - name: Test all roles (visitor, new client, admin, client) + persistence + security
        shell: bash
        run: node scripts/shatirhassan-desktop/e2e.cjs run/ShatirHassan shots
      - name: Reject foreign hosts
        shell: bash
        run: |
          B=run/ShatirHassan/ShatirHassan-Linux
          [ "$RUNNER_OS" = Windows ] && B=run/ShatirHassan/ShatirHassan-Windows.exe
          [ "$RUNNER_OS" = macOS ] && B=run/ShatirHassan/bin/shatirhassan-mac-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo intel)
          SHATIRHASSAN_NO_BROWSER=1 "$B" & sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:47820' http://127.0.0.1:47820/api/db)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Origin: http://evil.example' -H 'Content-Type: application/json' -d '{"v":1}' http://127.0.0.1:47820/api/db)" = 403
          echo "foreign requests rejected"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: shatirhassan-desktop, path: dist }
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          N="شاطر حسن على الكمبيوتر: النظام المصرفي الإسلامي يعمل دون إنترنت على ويندوز وماك ولينكس. التعليمات: https://munjiz-qa.github.io/shatirhassan/desktop/"
          gh release view shatirhassan-desktop >/dev/null 2>&1 || gh release create shatirhassan-desktop --title "شاطر حسن على الكمبيوتر" --notes "$N" --latest=false
          gh release upload shatirhassan-desktop dist/ShatirHassan-Desktop.zip --clobber
          gh release edit shatirhassan-desktop --notes "$N  آخر تحديث: $(date -u +'%Y-%m-%d %H:%M') UTC، واختُبرت بكل الأدوار على ويندوز وماك ولينكس."
