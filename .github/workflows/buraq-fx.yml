name: أسعار صرف براق
# يحدّث الاحتياطي اليومي لسعر الدولار مقابل الريال القطري والجنيه المصري في buraq/data/fx.json
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: buraq-fx
jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/buraq-fx.mjs
      - name: Commit if changed
        run: |
          git config user.name "buraq-fx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add buraq/data/fx.json
          git diff --cached --quiet || (git commit -m "براق: تحديث سعر الصرف الاحتياطي" && git pull --rebase -q && git push)
