<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://github.com https://camo.githubusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0f4c5c">
<title>سَيْف · منجز</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f1ea;--panel:#fffdf8;--ink:#14232b;--mute:#5d6b70;--line:#e2dccf;
  --brand:#0f4c5c;--brand-ink:#fff;--gold:#b8862b;--ok:#1f7a55;--warn:#b7791f;--alert:#b3261e;
  --okbg:#e5f2ec;--warnbg:#fbf0dc;--alertbg:#f9e3e1;--nabg:#eceae4;--shadow:0 1px 2px rgba(20,35,43,.06),0 6px 24px rgba(20,35,43,.06)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1619;--panel:#132126;--ink:#e8efef;--mute:#9aabaf;--line:#22353b;
  --brand:#6fb7c6;--brand-ink:#08262d;--gold:#e0b25c;--ok:#5cc596;--warn:#e7b25a;--alert:#ef7b72;
  --okbg:#13302a;--warnbg:#33290f;--alertbg:#3a1a18;--nabg:#1b2b30;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0d1619;--panel:#132126;--ink:#e8efef;--mute:#9aabaf;--line:#22353b;
  --brand:#6fb7c6;--brand-ink:#08262d;--gold:#e0b25c;--ok:#5cc596;--warn:#e7b25a;--alert:#ef7b72;
  --okbg:#13302a;--warnbg:#33290f;--alertbg:#3a1a18;--nabg:#1b2b30;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.7 "Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}
.brand b{font-size:21px;color:var(--brand);letter-spacing:.3px}
.brand small{display:block;color:var(--mute);font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.who .nm{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live.off i{background:var(--alert);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--mute);font-size:14px;padding:8px 12px;border-bottom:2.5px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--brand);border-color:var(--gold);font-weight:700}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
button:hover,.btn:hover{border-color:var(--brand)}
button:disabled{opacity:.55;cursor:wait}
.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.dan{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 40%,var(--line))}
.sm{font-size:12px;padding:4px 10px;min-height:32px;border-radius:8px}
.ghost{background:transparent}
input,select,textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;min-height:42px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label input,label select{margin-top:4px;color:var(--ink)}
.chkl{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}.chkl input{width:auto;min-height:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--mute);font-size:12px;margin-inline-start:auto}
.stat b{display:block;font-size:26px;line-height:1.2;color:var(--brand);font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:13px}
h1.pg{font-size:20px;margin:6px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1.pg small{font-size:13px;font-weight:400;color:var(--mute)}
.mute{color:var(--mute)}.small{font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;direction:ltr;unicode-bidi:isolate;word-break:break-all}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.alert{background:var(--alertbg);color:var(--alert)}.na{background:var(--nabg);color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-alert{background:var(--alert)}.d-na{background:var(--mute);opacity:.5}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{color:var(--mute);font-size:14px;padding:14px 0;text-align:center}
.verdict{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:120px;height:120px;flex:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:80px;border-bottom:1px solid var(--line);direction:ltr}
.bars i{flex:1;max-width:16px;border-radius:3px 3px 0 0;min-height:3px}
.checks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.chk{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;background:var(--bg);min-width:0}
.chk .dot{margin-top:8px}
.chk div{min-width:0;flex:1}
.chk b{display:block;font-size:14px}.chk span{color:var(--mute);font-size:13px;display:block;overflow-wrap:anywhere}
.chk .v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;background:var(--bg);transition:border-color .2s}
.drop.on{border-color:var(--gold)}
.drop input{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.banner{padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}
.hero{padding:34px 0 10px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:center}
.hero h1{font-size:34px;line-height:1.35;margin:0 0 10px;color:var(--brand)}
.hero p{font-size:17px;color:var(--mute);margin:0 0 18px}
.feat{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:22px}
.feat .card h3{margin:0 0 6px;font-size:16px;color:var(--brand)}
.feat .card p{margin:0;color:var(--mute);font-size:14px}
.login{max-width:420px;margin:0 auto}
.pwrap{position:relative}.pwrap input{padding-inline-start:74px}.pwrap button{position:absolute;inset-inline-start:5px;bottom:5px;min-height:32px}
.err{color:var(--alert);font-size:13px;min-height:20px;display:block}
.chain{display:flex;flex-direction:column;gap:6px}
.lnk{display:flex;gap:10px;align-items:center;font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:7px 10px;flex-wrap:wrap}
.lnk .n{font-weight:700;color:var(--gold);min-width:38px}
details.rep{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
details.rep summary{cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.rep summary::-webkit-details-marker{display:none}
details.rep .in{padding:0 12px 12px}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;direction:ltr;margin-top:6px}
.spark i{flex:1;background:var(--brand);opacity:.55;border-radius:2px 2px 0 0;min-height:2px}
.modal{position:fixed;inset:0;background:rgba(10,20,24,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal .card{width:100%;max-width:560px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.contact{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.contact a{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel)}
footer{margin-top:26px;text-align:center;color:var(--mute);font-size:12px}
.perm{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:13px}
.boot{padding:60px 16px;text-align:center;color:var(--mute)}
@media (max-width:820px){
  .g2,.g3,.hero{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:27px}.hero{padding-top:18px}
  .ring{width:100px;height:100px}
  .who .nm,.who .rl{display:none}
  .brand small{max-width:52vw}
  .hide-m{display:none}
}
.printarea{display:none}
@media print{body.printing>*:not(.printarea){display:none!important}body.printing .printarea{display:block}.top,nav,.noprint{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"><div class="boot">جارٍ تشغيل سَيْف…</div></div>
<noscript><p class="boot">تحتاج المنصة إلى تفعيل JavaScript في المتصفح.</p></noscript>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
