---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]
instances:
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
sequence:
- show:
  - welcome
  - locale
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@cleanup
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
branding: razi
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
