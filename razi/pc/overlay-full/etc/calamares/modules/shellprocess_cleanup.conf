---
dontChroot: false
timeout: 600
script:
    - "-apt-get -y purge casper calamares calamares-settings-ubuntu-common"
    - "-apt-get -y autoremove"
    - "rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "rm -f /usr/share/applications/razi-install.desktop /usr/local/bin/razi-install"
    - "sed -i '/razi-install/d' /usr/share/razi/start/menu.csv /usr/share/razi/start/menu.all.csv"
    - "-sh -c 'rm -f /etc/skel/*/08-install.desktop /home/*/*/08-install.desktop'"
