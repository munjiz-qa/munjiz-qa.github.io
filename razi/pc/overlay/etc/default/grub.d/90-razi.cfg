# الرازي: قائمة الإقلاع ونواة الرازي افتراضيًا
GRUB_DISTRIBUTOR="Razi"
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_FLAVOUR_ORDER="razi"
# مع الإقلاع الآمن تُفضَّل النواة الموقّعة لأن الجهاز يرفض غيرها
if [ -d /sys/firmware/efi ] && command -v mokutil >/dev/null && mokutil --sb-state 2>/dev/null | grep -qi enabled; then
  GRUB_FLAVOUR_ORDER="generic"
fi
