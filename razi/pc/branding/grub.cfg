set default=0
set timeout=8
insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=auto
terminal_output gfxterm
background_image /boot/grub/background.png
set color_normal=light-gray/black
set color_highlight=cyan/black
set menu_color_normal=light-gray/black
set menu_color_highlight=cyan/black

# على الأجهزة التي تفعّل الإقلاع الآمن (Secure Boot) يُختار تلقائيًا وضع التوافق بالنواة الموقّعة
if [ "$lockdown" = "y" ]; then set default=4; fi

menuentry "Razi OS 1.2 - Try / Start (Arabic Live)" {
  linux /casper/vmlinuz boot=casper quiet splash username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
menuentry "Razi OS 1.2 - Safe graphics (old devices)" {
  linux /casper/vmlinuz boot=casper nomodeset username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
menuentry "Razi OS 1.2 - Save changes (persistent USB)" {
  linux /casper/vmlinuz boot=casper persistent username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
menuentry "Razi OS 1.2 - Load to RAM (faster)" {
  linux /casper/vmlinuz boot=casper toram username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
menuentry "Razi OS 1.2 - Secure Boot compatibility" {
  linux /casper/vmlinuz-sb boot=casper quiet splash username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd-sb
}
