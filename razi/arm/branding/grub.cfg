set default=0
set timeout=8
insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=auto
terminal_output gfxterm
background_image /boot/grub/background.png
set color_normal=light-gray/black
set color_highlight=yellow/black
set menu_color_normal=light-gray/black
set menu_color_highlight=yellow/black

menuentry "Razi OS 1.0 - Try / Start (Arabic Live)" {
  linux /casper/vmlinuz boot=casper quiet splash username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
menuentry "Razi OS 1.0 - Safe graphics (old devices)" {
  linux /casper/vmlinuz boot=casper nomodeset username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
menuentry "Razi OS 1.0 - Save changes (persistent USB)" {
  linux /casper/vmlinuz boot=casper persistent username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
menuentry "Razi OS 1.0 - Load to RAM (faster)" {
  linux /casper/vmlinuz boot=casper toram username=razi hostname=razi locale=ar_EG.UTF-8 ---
  initrd /casper/initrd
}
