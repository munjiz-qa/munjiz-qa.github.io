<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="سنبلة: استثمر في الأسهم والباقات العالمية ابتداءً من مبلغ صغير.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>سنبلة للاستثمار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: a field of pale sage with petrol-ink structure; wheat gold marks growth. Public page = editorial bands, app = sidebar shell (desktop) / bottom bar (phone). */
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --surface-2:#E4E9E1; --ink:#10282B; --muted:#576B68; --line:#D3DBD0;
  --petrol:#14474D; --petrol-2:#1D5C63; --on-petrol:#F4F1E6; --wheat:#B98320; --wheat-soft:#F1E2BF; --wheat-ink:#6E4C0E;
  --gain:#1C7A50; --gain-soft:#DCEFE4; --loss:#B23F35; --loss-soft:#F6E0DD; --warn:#9A6512; --warn-soft:#F5E8CF;
  --shadow:0 1px 2px rgba(16,40,43,.05),0 10px 28px rgba(16,40,43,.07);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1819; --surface:#122427; --surface-2:#183034; --ink:#E6EEEA; --muted:#94A9A5; --line:#24403F;
  --petrol:#1E6B72; --petrol-2:#2A8890; --on-petrol:#F4F1E6; --wheat:#E2AE52; --wheat-soft:#3A2E14; --wheat-ink:#F1D9A6;
  --gain:#4EC28C; --gain-soft:#173A2A; --loss:#F07F72; --loss-soft:#432220; --warn:#E8AE52; --warn-soft:#3B2D14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1819; --surface:#122427; --surface-2:#183034; --ink:#E6EEEA; --muted:#94A9A5; --line:#24403F;
  --petrol:#1E6B72; --petrol-2:#2A8890; --on-petrol:#F4F1E6; --wheat:#E2AE52; --wheat-soft:#3A2E14; --wheat-ink:#F1D9A6;
  --gain:#4EC28C; --gain-soft:#173A2A; --loss:#F07F72; --loss-soft:#432220; --warn:#E8AE52; --warn-soft:#3B2D14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;direction:rtl;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;letter-spacing:-.01em}
.muted{color:var(--muted)}
.nw{white-space:nowrap}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--wheat);outline-offset:2px;border-radius:6px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;background:var(--petrol);color:var(--on-petrol);transition:background .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--petrol-2)} .btn:active{transform:translateY(1px)}
.btn.gold{background:var(--wheat);color:#1D1404} .btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)} .btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--loss);color:#fff}
.btn.ok{background:var(--gain);color:#fff}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:none;border-color:var(--wheat);box-shadow:0 0 0 3px var(--wheat-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.phone{display:grid;grid-template-columns:120px 1fr;gap:8px;direction:ltr}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{margin-top:5px;accent-color:var(--petrol)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--gain-soft);color:var(--gain)}
.pill.bad{background:var(--loss-soft);color:var(--loss)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.gold{background:var(--wheat-soft);color:var(--wheat-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card h3{font-size:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--wheat-ink);text-transform:uppercase}

/* ---------- public ---------- */
.ph{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ph .wrap{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;color:var(--muted);margin-top:-5px;letter-spacing:.04em}
.pnav{display:flex;gap:4px;margin-inline-start:12px}
.pnav a{text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.pnav a:hover{color:var(--ink);background:var(--surface-2)}
.ph .acts{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.mob-only{display:none!important}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:42px;cursor:pointer}
@media (max-width:900px){
  .pnav{display:none;position:absolute;top:66px;inset-inline:0;background:var(--surface);flex-direction:column;padding:10px 16px 16px;border-bottom:1px solid var(--line);margin:0}
  .pnav.open{display:flex}
  .pnav.open .mob-only{display:block!important;color:var(--petrol-2);font-weight:600}
  .menu-btn{display:inline-grid;place-items:center}
  .ph .acts .btn.ghost{display:none}
}
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:700;letter-spacing:-.015em;line-height:1.18}
.hero h1 em{font-style:normal;color:var(--wheat)}
.hero p.lead{font-size:18px;color:var(--muted);margin-top:18px;max-width:34em}
.hero .row{margin-top:28px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px;padding-top:22px;border-top:1px dashed var(--line)}
.facts div b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600}
.facts div span{font-size:13px;color:var(--muted)}
.hero-card{background:var(--petrol);color:var(--on-petrol);border-radius:20px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-card .lbl{font-size:13px;opacity:.75}
.hero-card .big{font-family:var(--f-num);font-size:34px;font-weight:600;margin-top:2px}
.hero-card svg.chart path.l{stroke:var(--wheat)}
.hero-card .hold{display:grid;gap:8px;margin-top:14px}
.hero-card .hold div{display:flex;justify-content:space-between;gap:12px;background:rgba(255,255,255,.07);padding:9px 12px;border-radius:10px;font-size:14px}
.hero-card .tag{position:absolute;top:18px;left:18px;font-size:11px;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:999px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:32px}.hero{padding-block:32px 24px}}

.ticker{border-block:1px solid var(--line);background:var(--surface);overflow:hidden;white-space:nowrap}
.ticker .track{display:inline-flex;gap:36px;padding-block:11px;animation:scroll 60s linear infinite;padding-inline-start:36px}
.ticker span.t{display:inline-flex;gap:8px;font-size:13.5px;align-items:baseline}
.ticker b{font-family:var(--f-num);font-weight:600}
@keyframes scroll{to{transform:translateX(50%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none}}

section.band{padding-block:64px}
section.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sh h2{font-size:clamp(26px,3.4vw,36px);margin-top:4px}
.sh p{color:var(--muted);max-width:40em;margin-top:6px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:start;width:100%;transition:border-color .15s}
.mrow:hover{border-color:var(--wheat)}
.badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:12px;flex:none;background:var(--surface-2);color:var(--petrol)}
:root[data-theme="dark"] .badge{color:var(--wheat)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:var(--wheat)}}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm small{color:var(--muted);font-size:12px}
.mrow .px{text-align:end}
.mrow .px b{display:block;font-family:var(--f-num);font-weight:600}
.mrow .px small{font-family:var(--f-num);font-size:12px}
.flash-up{animation:fu .8s} .flash-dn{animation:fd .8s}
@keyframes fu{from{background:var(--gain-soft)}} @keyframes fd{from{background:var(--loss-soft)}}

.pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pkg{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.pkg .hd{display:flex;align-items:flex-start;gap:12px}
.pkg .sw{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center}
.pkg .sw svg{width:24px;height:24px}
.pkg h3{font-size:19px}
.pkg .desc{color:var(--muted);font-size:14px}
.risk{display:inline-flex;gap:3px;vertical-align:middle}
.risk i{width:14px;height:6px;border-radius:2px;background:var(--surface-2)}
.risk i.on{background:var(--wheat)}
.comp{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-family:var(--f-num);font-weight:600;font-size:15px}
.pkg .btn{margin-top:auto}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s}
.step{padding:22px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.step .n{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--wheat-ink);background:var(--wheat-soft);border-radius:999px;padding:2px 10px;display:inline-block}
.step h3{font-size:19px;margin-top:12px}
.step p{color:var(--muted);margin-top:6px;font-size:14px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

.calc{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
.calc .res{background:var(--petrol);color:var(--on-petrol);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.calc .res .big{font-family:var(--f-num);font-size:clamp(30px,5vw,44px);font-weight:600;color:var(--wheat)}
.calc .res .split{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}
.calc .res .split b{display:block;font-family:var(--f-num);font-size:17px}
input[type=range]{width:100%;accent-color:var(--petrol)}
.rangeval{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:start;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:end}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tw table{min-width:640px}

details.faq{border-bottom:1px solid var(--line);padding-block:16px}
details.faq summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-family:var(--f-num);color:var(--wheat)}
details.faq[open] summary::after{content:"−"}
details.faq p{color:var(--muted);margin-top:10px;max-width:60em}

.foot{background:var(--petrol);color:var(--on-petrol);padding-block:40px 28px}
.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
.foot p,.foot li{opacity:.8;font-size:14px}
.foot ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.foot .disc{margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;opacity:.7}
.foot .brand b{color:var(--on-petrol)} .foot .brand small{color:var(--on-petrol);opacity:.7}
@media (max-width:760px){.foot .cols{grid-template-columns:1fr}}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.side nav{display:grid;gap:2px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:start;font-weight:500;color:var(--muted);width:100%}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--surface-2);color:var(--ink)}
.nv.on{background:var(--petrol);color:var(--on-petrol)}
.nv .cnt{margin-inline-start:auto;background:var(--wheat);color:#1D1404;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;font-family:var(--f-num)}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;background:var(--wheat-soft);color:var(--wheat-ink);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display)}
.side .me div{min-width:0;flex:1}
.side .me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .me small{color:var(--muted);font-size:12px}
.main{min-width:0;padding-bottom:40px}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.topbar h1{font-size:22px}
.topbar .sp{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.topbar .mbrand{display:none}
.content{padding:24px 28px;display:grid;gap:20px}
.bnav{display:none}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .topbar h1{font-size:18px}
  .topbar .mbrand{display:block}
  .topbar .mbrand svg{width:30px;height:30px}
  .content{padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow-x:auto;gap:2px}
  .bnav .nv{flex:1 0 64px;flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;justify-content:center;align-items:center;text-align:center}
  .bnav .nv.on{background:var(--wheat-soft);color:var(--wheat-ink)}
  .bnav .nv .cnt{position:absolute;margin:0;transform:translate(-14px,-4px)}
  .bnav .nv{position:relative}
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:12.5px;font-variant-numeric:tabular-nums}
.kpi.hero{background:var(--petrol);color:var(--on-petrol);border-color:transparent}
.kpi.hero span{color:var(--on-petrol);opacity:.75}
.kpi.hero b{font-size:26px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpi b{font-size:18px}.kpi.hero b{font-size:22px}}
.cols2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
@media (max-width:1100px){.cols2{grid-template-columns:1fr}}
.ch-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
svg.chart{width:100%;height:auto;display:block}
svg.chart .g{stroke:var(--line);stroke-width:1}
svg.chart path.l{fill:none;stroke:var(--petrol-2);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart-y{flex-direction:row-reverse;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.legend{display:grid;gap:8px;font-size:14px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}

function navOf(pg,prices){prices=prices||DB.prices;let v=0;for(const[s,w]of Object.entries(pg.comp))v+=w/100*prices[s].p/pg.base[s];return 100*v}
function totalOf(u,db){let t=u.cash;for(const[s,h]of Object.entries(u.holdings))t+=h.q*db.prices[s].p;for(const[id,sb]of Object.entries(u.subs)){const pg=db.packages.find(p=>p.id===id);if(pg)t+=sb.units*navOf(pg,db.prices)}return t}
function genHist(u,db){
  const end=totalOf(u,db); if(end<=0)return [];
  const days=Math.min(180,Math.max(2,Math.round((Date.now()-u.created)/DAY)));
  const r=rng(strSeed(u.id)); const out=[]; let v=end;
  for(let i=0;i<=days;i++){out.unshift([Date.now()-i*DAY,v]);v=v/(1+(r()-.47)*.022)}
  // early days ramp up because deposits came in over time
  const n=out.length; return out.map(([d,val],i)=>[d,val*(0.55+0.45*Math.min(1,(i/n)*1.6))]).map((p,i,a)=>i===a.length-1?[p[0],end]:p);
}

function lineSVG(vals,{w=600,h=200,color='var(--petrol-2)',fill=true,dot=true}={}){
  if(vals.length<2)vals=[vals[0]||0,vals[0]||0];
  const id='g'+(++gid),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,pad=10;
  const X=i=>pad+i*(w-2*pad)/(vals.length-1),Y=v=>pad+(1-(v-mn)/rg)*(h-2*pad);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const d='M'+pts.join(' L');const last=vals.length-1;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="منحنى القيمة">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>

   ${fill?`<path d="${d} L${X(last).toFixed(1)},${h} L${X(0).toFixed(1)},${h}Z" fill="url(#${id})"/>`:''}
   <path class="l" d="${d}" style="stroke:${color}"/>
   ${dot?`<circle cx="${X(last).toFixed(1)}" cy="${Y(vals[last]).toFixed(1)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2.5"/>`:''}
  </svg>`;
}
function donut(parts,size=150){
  const tot=sumOf(parts.map(p=>p.v))||1,r=58,c=2*Math.PI*r;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*c;const s=`<circle r="${r}" cx="75" cy="75" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 75 75)"/>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 150 150" width="${size}" height="${size}" role="img" aria-label="توزيع الأصول"><circle r="${r}" cx="75" cy="75" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${segs}</svg>`;
}

function calcUpdate(){
  const el=$('#c_res');if(!el)return;
  const init=Math.max(0,+$('#c_init').value||0),mo=Math.max(0,+$('#c_month').value||0),y=+$('#c_years').value,r=+$('#c_rate').value/100;
  $('#c_years_v').textContent=y;$('#c_rate_v').textContent=r*100+'%';
  const mr=Math.pow(1+r,1/12)-1;let v=init;const pts=[v];for(let m=1;m<=y*12;m++){v=v*(1+mr)+mo;if(m%3===0)pts.push(v)}
  const paid=init+mo*12*y;
  el.innerHTML=`<span style="opacity:.8">القيمة التقديرية بعد <span class="num">${y}</span> ${y>10||y<3?'سنة':'سنوات'}</span><div class="big">${mTxt(v)}</div>
   ${lineSVG(pts,{h:140,color:'var(--wheat)'})}
   <div class="split"><div><span style="opacity:.8">إجمالي ما تدفعه</span><b>${mTxt(paid)}</b></div><div><span style="opacity:.8">النمو المتوقع</span><b>${mTxt(v-paid)}</b></div></div>
   <button class="btn gold" data-act="auth" data-id="signup" style="align-self:start">ابدأ خطتك الآن</button>`;
}

 kyc2(f){const file=f.doc.files[0];if(!file)return toast('يرجى اختيار ملف الهوية.',true);if(file.size>8*1024*1024)return toast('حجم الملف يتجاوز 8 ميجابايت.',true);S.kycDraft.doc=file.name;S.kycStep=3;render()},
 kyc3(f){const sc=+f.q1.value + +f.q2.value + +f.q3.value;const risk=sc<=2?'محافظ':sc<=4?'متوازن':'جريء';const u=me(),d=S.kycDraft;Object.assign(u,{nat:d.nat,dob:d.dob,idNumber:d.idn,job:d.job,idDoc:d.doc,risk,kyc:'pending',kycNote:''});S.kycStep=1;S.kycDraft={};commit(`أُرسل طلب التوثيق. ملف المخاطر المقترح لك: ${risk}.`)},
 kycreject(f){const u=userById(f.dataset.id);u.kyc='rejected';u.kycNote=f.note.value;closeModal();commit('رُفض طلب التوثيق وأُبلغ المستثمر بالسبب.')},
 deposit(f){const a=+(+f.amt.value).toFixed(2),u=me();if(!(a>=DB.settings.minDeposit))return toast(`الحد الأدنى للإيداع ${mTxt(DB.settings.minDeposit)}.`,true);if(a>1e6)return toast('الحد الأعلى للإيداع الواحد مليون دولار في هذا النموذج.',true);u.cash+=a;addTx({userId:u.id,type:'deposit',amount:a,method:f.method.value});closeModal();commit(`أُضيف ${mTxt(a)} إلى رصيدك.`)},
 withdraw(f){const a=+(+f.amt.value).toFixed(2),u=me(),wf=DB.settings.withdrawFee;if(!(a>0))return toast('أدخل مبلغاً صحيحاً.',true);if(a+wf>u.cash+1e-9)return toast('المبلغ يتجاوز رصيدك المتاح.',true);u.cash-=a+wf;addTx({userId:u.id,type:'withdraw',amount:a,method:'تحويل بنكي',status:'pending',iban:f.iban.value.replace(/\s/g,'').slice(-4)});closeModal();commit('أُرسل طلب السحب وهو الآن قيد المراجعة.')},
 buy(f){const u=me(),s=f.dataset.id,a=+(+f.amt.value).toFixed(2),b=canTrade(u);if(b)return toast(b,true);if(!(a>=1))return toast('الحد الأدنى للشراء دولار واحد.',true);if(a>u.cash+1e-9)return toast(`رصيدك المتاح ${mTxt(u.cash)} لا يكفي لهذه العملية.`,true);
  const fee=a*DB.settings.fee/100,q=+((a-fee)/P(s)).toFixed(6);u.cash-=a;const h=u.holdings[s]||(u.holdings[s]={q:0,cost:0});h.q+=q;h.cost+=a;addTx({userId:u.id,type:'buy',amount:a,sym:s,qty:q,price:P(s),fee});closeModal();commit(`اشتريت ${qTxt(q)} سهم من ${SMAP[s].n}.`)},
 sell(f){const u=me(),s=f.dataset.id,h=u.holdings[s],b=canTrade(u);if(b)return toast(b,true);let q=+f.qty.value;if(!h||!(q>0))return toast('أدخل كمية صحيحة.',true);if(q>h.q+1e-9)return toast('الكمية أكبر مما تملك.',true);q=Math.min(q,h.q);
  const gross=q*P(s),fee=gross*DB.settings.fee/100,net=gross-fee;h.cost-=h.cost*(q/h.q);h.q-=q;if(h.q<1e-6)delete u.holdings[s];u.cash+=net;addTx({userId:u.id,type:'sell',amount:+net.toFixed(2),sym:s,qty:q,price:P(s),fee});closeModal();commit(`بعت ${qTxt(q)} سهم، وأُضيف ${mTxt(net)} إلى رصيدك.`)},
 sub(f){const u=me(),id=f.dataset.id,pg=pkgById(id),a=+(+f.amt.value).toFixed(2),b=canTrade(u);if(b)return toast(b,true);if(!(a>=pg.min))return toast(`الحد الأدنى لهذه الباقة ${mTxt(pg.min)}.`,true);if(a>u.cash+1e-9)return toast(`رصيدك المتاح ${mTxt(u.cash)} لا يكفي.`,true);
  const units=+(a/NAV(pg)).toFixed(6);u.cash-=a;const sb=u.subs[id]||(u.subs[id]={units:0,cost:0});sb.units+=units;sb.cost+=a;addTx({userId:u.id,type:'sub',amount:a,pkg:id,units});closeModal();commit(`استثمرت ${mTxt(a)} في «${pg.name}».`)},
 redeem(f){const u=me(),id=f.dataset.id,sb=u.subs[id],b=canTrade(u);if(b)return toast(b,true);let n=+f.units.value;if(!sb||!(n>0))return toast('أدخل عدداً صحيحاً من الوحدات.',true);if(n>sb.units+1e-9)return toast('العدد أكبر مما تملك.',true);n=Math.min(n,sb.units);
  const v=n*NAV(pkgById(id));sb.cost-=sb.cost*(n/sb.units);sb.units-=n;if(sb.units<1e-6)delete u.subs[id];u.cash+=v;addTx({userId:u.id,type:'redeem',amount:+v.toFixed(2),pkg:id,units:n});closeModal();commit(`استرددت ${mTxt(v)} إلى رصيدك.`)},
 pkgsave(f){
  const cs=[...f.querySelectorAll('[name=cs]')].map(x=>x.value),cw=[...f.querySelectorAll('[name=cw]')].map(x=>+x.value);
  if(new Set(cs).size!==cs.length)return toast('يوجد مكوّن مكرر في الباقة.',true);
  if(sumOf(cw)!==100)return toast('مجموع الأوزان يجب أن يساوي 100%.',true);
  const comp=Object.fromEntries(cs.map((s,i)=>[s,cw[i]]));const risk=Math.min(5,Math.max(1,Math.round(+f.risk.value)));
  const data={name:normName(f.name.value),desc:f.desc.value.trim(),risk,min:+f.min.value,fee:+f.fee.value,color:f.color.value};
  const id=f.dataset.id;
  if(id){const pg=pkgById(id);const nav=NAV(pg);Object.assign(pg,data);
    // re-base so the unit price is continuous after a composition change
    pg.comp=comp;pg.base={};const raw=Object.entries(comp).reduce((a,[s,w])=>a+w/100,0);for(const[s]of Object.entries(comp))pg.base[s]=P(s)*100/nav*raw;
  }else{DB.packages.push(Object.assign({id:uid('p'),icon:'globe',comp,base:Object.fromEntries(cs.map(s=>[s,P(s)])),active:true,created:Date.now()},data))}
  closeModal();commit(id?'حُفظت تعديلات الباقة.':'أُنشئت الباقة وأصبحت متاحة للمستثمرين.')},
 settings(f){const s=DB.settings;s.tradingOpen=f.open.checked;s.fee=Math.max(0,+f.fee.value);s.minDeposit=Math.max(1,+f.min.value);s.withdrawFee=Math.max(0,+f.wf.value);commit('حُفظت إعدادات المنصة.')}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.type==='checkbox'&&el.dataset.act==='pkgtoggle'){const pg=pkgById(el.dataset.id);pg.active=el.checked;save();toast(pg.active?'الباقة متاحة للاشتراك.':'أُغلقت الباقة أمام الاشتراكات الجديدة.');return}
  const a=ACTS[el.dataset.act];if(!a)return;
  if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
  a(el.dataset.id,el,e);
});
document.addEventListener('submit',e=>{const f=e.target;const h=FORMS[f.dataset.form];if(!h)return;e.preventDefault();h(f)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='mq'){S.mq=t.value;rerenderMarket(true)}
  else if(t.id==='uq'){S.uq=t.value;const pos=t.selectionStart;render();const n=$('#uq');n.focus();n.setSelectionRange(pos,pos)}
  else if(['c_init','c_month','c_years','c_rate'].includes(t.id))calcUpdate();
  else if(t.name==='cw')sumComp();
  else if(t.id==='b_amt'){const s=t.closest('form').dataset.id,a=+t.value||0,fee=a*DB.settings.fee/100;$('#b_est').innerHTML=`ستحصل على نحو <span class="num">${qTxt(Math.max(0,(a-fee)/P(s)))}</span> سهم · العمولة ${mTxt(fee)}`}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
function rerenderMarket(keep){const l=$('#mlist');if(!l)return render();const list=filteredStocks();l.innerHTML=list.length?list.map(x=>stockRow(x)).join(''):`<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة.</div>`;if(!keep)document.querySelectorAll('[data-act=mfilter]').forEach(b=>b.classList.toggle('on',b.dataset.id===S.mfilter))}

/* ================= render & live ================= */
function render(){
  const u=me();
  if(u&&!userById(u.id)){DB.session=null}
  if(me()){if(me().role==='admin'&&!S.view.startsWith('a'))S.view='aov';if(me().role==='investor'&&(S.view.startsWith('a')&&S.view!=='account'||S.view==='home'))S.view='dash'}else S.view='home';
  $('#root').innerHTML=me()?renderApp():renderPublic();
  if(!me())calcUpdate();
}
function live(){
  if(!DB.settings.tradingOpen)return;
  for(const s in DB.prices){const pr=DB.prices[s];pr.p=Math.max(0.5,pr.p*(1+(Math.random()-.495)*.0032))}
  document.querySelectorAll('[data-px]').forEach(el=>{const s=el.dataset.px,old=parseFloat(el.textContent.replace(/[$,]/g,'')),v=P(s);el.textContent=mTxt(v);if(old&&Math.abs(old-v)>.004){el.classList.remove('flash-up','flash-dn');void el.offsetWidth;el.classList.add(v>old?'flash-up':'flash-dn')}});
  document.querySelectorAll('[data-chg]').forEach(el=>{const c=chg(el.dataset.chg);el.textContent=pTxt(c);el.classList.toggle('gain',c>=0);el.classList.toggle('loss',c<0)});
  document.querySelectorAll('[data-nav]').forEach(el=>el.textContent=mTxt(NAV(pkgById(el.dataset.nav))));
  document.querySelectorAll('[data-navc]').forEach(el=>{const c=NAV(pkgById(el.dataset.navc))-100;el.textContent=pTxt(c);el.className=c>=0?'gain':'loss'});
  const u=me();
  if(u&&u.role==='investor'){const p=pf(u);
    document.querySelectorAll('[data-tot]').forEach(el=>el.textContent=mTxt(p.total));
    document.querySelectorAll('[data-inv]').forEach(el=>el.textContent=mTxt(p.inv));
    document.querySelectorAll('[data-pnl]').forEach(el=>el.textContent=(p.pnl>=0?'+':'')+mTxt(p.pnl)+' ('+pTxt(p.pnlPct)+')');
    document.querySelectorAll('[data-pnl2]').forEach(el=>{el.textContent=(p.pnl>=0?'+':'')+mTxt(p.pnl);el.className='num '+(p.pnl>=0?'gain':'loss')});
    document.querySelectorAll('[data-hv]').forEach(el=>{const h=u.holdings[el.dataset.hv];if(h)el.textContent=mTxt(h.q*P(el.dataset.hv))});
  }
  if(u&&u.role==='admin')document.querySelectorAll('[data-aum]').forEach(el=>el.textContent=mTxt(sumOf(DB.users.filter(x=>x.role==='investor').map(x=>pf(x).total))));
  if(++live.n%10===0){if(u)pushHist(u);save()}
}
live.n=0;
render();
setInterval(live,2500);
window.addEventListener('storage',e=>{if(e.key===KEY){DB=load();if(!$('#modal').innerHTML)render()}});
})();
</script>
