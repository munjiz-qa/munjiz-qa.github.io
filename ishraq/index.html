<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#f6efdf;
  background:radial-gradient(120% 60% at 50% 115%,#e2a54f 0%,transparent 55%),linear-gradient(180deg,#0f3a3f,#1f6461)}
.box{width:100%;max-width:380px;text-align:center}
.box img{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
h1{font-family:'Amiri',serif;font-size:2.4rem;margin:.6rem 0 .1rem;line-height:1.3}
p{margin:0 0 1.4rem;opacity:.85;font-size:.95rem;line-height:1.8}
form{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
label{display:block;text-align:right;font-size:.85rem;margin-bottom:6px;opacity:.9}
input[type=password],input[type=text]{width:100%;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);color:#fff;font-size:18px;padding:0 14px;text-align:center;letter-spacing:.08em;direction:ltr;font-family:inherit}
input:focus{outline:2px solid #f3c477;outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin:12px 0;font-size:.88rem}
.rem input{width:18px;height:18px;accent-color:#e2a54f}
button{width:100%;height:48px;border:0;border-radius:12px;background:#e9a548;color:#1b2a2c;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.6em;margin:10px 0 0;font-size:.88rem;color:#ffd0c8}
.foot{margin-top:1.2rem;font-size:.8rem;opacity:.7}
</style>
</head>
<body>
<main class="box" id="gate" hidden>
  <img src="icon.svg" alt="" width="84" height="84">
  <h1>إشراق</h1>
  <p>تطبيق خاص. أدخل رمز الدخول الذي وصلك من صاحب التطبيق.</p>
  <form id="f" autocomplete="off">
    <label for="k">رمز الدخول</label>
    <input id="k" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="rem"><input type="checkbox" id="r" checked> تذكّر الرمز على هذا الجهاز</label>
    <button id="b">دخول</button>
    <p class="msg" id="m" role="alert"></p>
  </form>
  <p class="foot">المحتوى مشفّر ولا يظهر إلا بالرمز الصحيح.</p>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => String(s||'').trim().toLowerCase().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s+/g,'');
async function open_(code){
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'},
    await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']),
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.v)}, key, b64(P.c)));
  return html;
}
function show(html){ document.open(); document.write(html); document.close(); }
const get = () => { try{ return localStorage.getItem('ishraq-key') }catch(e){ return null } };
const put = v => { try{ localStorage.setItem('ishraq-key', v) }catch(e){} };
const del = () => { try{ localStorage.removeItem('ishraq-key') }catch(e){} };
(async () => {
  let code = null;
  const h = new URLSearchParams(location.hash.slice(1)).get('k');
  if (h){ code = norm(h); history.replaceState(null, '', location.pathname); }
  else code = get();
  if (code){
    try{ const html = await open_(code); put(code); show(html); return; }catch(e){ del(); }
  }
  document.getElementById('gate').hidden = false;
  document.getElementById('k').focus();
})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), m = document.getElementById('m');
  const code = norm(document.getElementById('k').value);
  b.disabled = true; b.textContent = 'جارٍ الفتح…'; m.textContent = '';
  try{
    const html = await open_(code);
    if (document.getElementById('r').checked) put(code);
    show(html);
  }catch(err){
    m.textContent = 'رمز الدخول غير صحيح.'; b.disabled = false; b.textContent = 'دخول';
    document.getElementById('k').select();
  }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
