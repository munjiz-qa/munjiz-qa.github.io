<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="صمّم موقع نشاطك التجاري بالوصف أو بصوتك، وشاهده يتشكّل أمامك بسعر واضح، ثم أرسل طلبك."><meta name="theme-color" content="#1F3A5F" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#151E2B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="بناء بيلدر"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website"><meta property="og:title" content="بناء بيلدر لتصميم المواقع"><meta property="og:description" content="صمّم موقع نشاطك التجاري بالوصف أو بصوتك، وشاهده يتشكّل أمامك بسعر واضح، ثم أرسل طلبك."><meta property="og:image" content="icons/icon-512.png">
<style>body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>بناء بيلدر لتصميم المواقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Baloo+Bhaijaan+2:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar, routed views (home / build / track / admin). Build = wizard column + live preview stage.
   Business palette: deep navy for every action and selection, saffron kept to the logo and tiny highlights,
   blue-biased neutrals; one typeface (IBM Plex Sans Arabic) for headings and text. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#141D2B; --muted:#5A6577; --line:#D9DFE8;
  --brand:#1F3A5F; --brand-ink:#FFFFFF; --accent:#D9962A; --accent-ink:#1C1405; --focus:#2F6FD6;
  --ok:#1C8657; --ok-bg:#E3F4EC; --warn:#B26F07; --warn-bg:#FBF0DC; --bad:#BC3B34; --bad-bg:#FBE6E4; --info:#2C5FA8; --info-bg:#E4ECF8;
  --chart:#2C5FA8; --chart-soft:#C9D8EE;
  --f-display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:8px; --shadow:0 1px 2px rgba(20,29,43,.05),0 4px 14px rgba(20,29,43,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141D; --surface:#151E2B; --sunk:#1B2636; --ink:#E8EDF5; --muted:#9AA7BA; --line:#2A3649;
  --brand:#9DBDF0; --brand-ink:#0E141D; --accent:#EBB04C; --accent-ink:#1C1405; --focus:#7FB0FF;
  --ok:#5BCB93; --ok-bg:#15301F; --warn:#F0B653; --warn-bg:#33270F; --bad:#F08A82; --bad-bg:#3A1A18; --info:#8DB6F2; --info-bg:#172843;
  --chart:#8DB6F2; --chart-soft:#2A3A55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#151E2B; --sunk:#1B2636; --ink:#E8EDF5; --muted:#9AA7BA; --line:#2A3649;
  --brand:#9DBDF0; --brand-ink:#0E141D; --accent:#EBB04C; --accent-ink:#1C1405; --focus:#7FB0FF;
  --ok:#5BCB93; --ok-bg:#15301F; --warn:#F0B653; --warn-bg:#33270F; --bad:#F08A82; --bad-bg:#3A1A18; --info:#8DB6F2; --info-bg:#172843;
  --chart:#8DB6F2; --chart-soft:#2A3A55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brandmark{display:flex;align-items:center;gap:10px;color:var(--ink);cursor:pointer;background:none;border:0;padding:0;text-align:start}
.brandmark svg{width:34px;height:34px;flex:none}
.brandmark b{font-family:var(--f-display);font-size:20px;font-weight:700}
.brandmark small{display:block;font-size:11px;color:var(--muted);margin-top:-4px}
.nav{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.nav .admin-link{display:none}
.is-admin .nav .admin-link{display:inline-block}
.nav .lang{border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px;padding:6px 10px}
.cur-sel{width:auto;flex:none;padding:6px 8px;font-size:13px;margin-inline-start:6px;border-radius:8px;direction:ltr}
.nav .lang{flex:none}
.nav .cur-sel{width:auto;min-width:0;max-width:86px}
@media (max-width:640px){.brandmark small{display:none}.nav{overflow-x:auto;scrollbar-width:none}.nav button{padding:7px 7px;font-size:13.5px}.brandmark b{font-size:20px}.brandmark svg{width:30px;height:30px}.top .wrap{gap:0 8px;flex-wrap:wrap;padding-block:6px 0;min-height:0}.nav{flex-basis:100%;margin-inline-start:0;padding-block:6px}.cur-sel{margin-inline-start:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r);padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .12s,background .12s,filter .12s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-dark{background:var(--brand);color:var(--brand-ink)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--sunk)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.view{display:none}
.view.on{display:block}

/* home */
.hero{padding-block:56px 40px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(28px,3.8vw,44px);font-weight:700;letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p.lead{font-size:17px;color:var(--muted);margin-top:14px;max-width:50ch}
.facts{margin-top:18px;font-size:13px;color:var(--muted)}
.hero-pv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.hero-pv .chrome{display:flex;gap:5px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);direction:ltr}
.hero-pv .chrome i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.hero-pv .frame{height:340px;overflow:hidden;background:#fff}
.hero .ctas{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.proof{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.proof b{display:block;font-family:var(--f-display);font-size:24px}
.proof span{font-size:13px;color:var(--muted)}
.courses{position:relative;min-width:0}
.courses .stage{position:relative;aspect-ratio:4/3.3;max-width:100%}
.stone{position:absolute;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.mini{pointer-events:none}
@media (prefers-reduced-motion:no-preference){.stone{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}.stone:nth-child(2){animation-delay:.12s}.stone:nth-child(3){animation-delay:.24s}}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-block:32px 24px;gap:28px}.hero-pv .frame{height:240px}}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:22px}
.resume p{flex:1;min-width:200px}

.band{padding-block:44px;border-top:1px solid var(--line)}
.band h2{font-size:clamp(21px,2.6vw,28px)}
.band .sub{color:var(--muted);margin-top:8px;max-width:62ch}
.steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:22px}
.steps-row div{padding-top:14px;border-top:2px solid var(--line)}
.steps-row div:first-child{border-top-color:var(--brand)}
.steps-row b{font-family:var(--f-display);color:var(--brand);font-size:15px}
.steps-row h3{font-size:17px;margin-top:4px}
.steps-row p{font-size:14px;color:var(--muted);margin-top:4px}
@media (max-width:820px){.steps-row{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.steps-row{grid-template-columns:1fr}}
.showcase{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.show{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:start;padding:0;display:flex;flex-direction:column}
.show:hover{border-color:var(--brand)}
.show .frame{height:210px;overflow:hidden;position:relative;border-bottom:1px solid var(--line);background:#fff}
.show .meta{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.show .meta b{font-size:15px}
.show .meta span{font-size:12px;color:var(--muted)}
@media (max-width:900px){.showcase{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.showcase{grid-template-columns:1fr}}
.cat-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.cat-cloud button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer}
.cat-cloud button:hover{border-color:var(--accent)}
.cat-cloud svg{width:18px;height:18px;color:var(--brand)}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative}
.plan.feat{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.plan .tag{position:absolute;top:-11px;inset-inline-start:18px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.plan h3{font-size:20px}
.plan .price{font-family:var(--f-display);font-size:28px;font-weight:700}
.plan .price small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px}
.plan li{display:flex;gap:8px}
.plan li::before{content:"✓";flex:none;color:var(--ok);font-weight:700}
.plan .setup{font-size:13px;color:var(--muted)}
@media (max-width:860px){.plans{grid-template-columns:1fr}}
.compare{overflow-x:auto;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.compare table{min-width:560px}
.compare td:not(:first-child),.compare th:not(:first-child){text-align:center}
.yes{color:var(--ok);font-weight:700}
.faq{margin-top:20px;display:grid;gap:8px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.faq summary{cursor:pointer;font-weight:600}
.cmp{margin-top:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 16px}
.cmp summary{cursor:pointer;font-weight:600}
.cmp .compare{margin-top:12px}
.faq p{color:var(--muted);margin-top:8px}
.foot{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px;margin-top:20px}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* builder */
.builder{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:22px;padding-block:20px 40px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.progress{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.progress .bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.dots button{border:0;background:none;padding:4px 0;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:11px;min-width:0}
.dots button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px;font-weight:700}
.dots button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dots button.done i{background:var(--ok);color:#fff}
.dots button[aria-current="step"]{color:var(--ink);font-weight:700}
.dots button[aria-current="step"] i{background:var(--brand);color:var(--brand-ink)}
.dots button[disabled]{cursor:not-allowed;opacity:.55}
@media (max-width:520px){.dots button span{display:none}}
.step-body{padding:20px}
.step-body h2{font-size:21px}
.step-body .hint{color:var(--muted);font-size:14px;margin-top:4px}
.step-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px;z-index:2}
.step-foot .est{font-size:12px;color:var(--muted);text-align:center;line-height:1.35}
.step-foot .est b{display:block;font-size:15px;color:var(--ink)}
.grid-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opt{position:relative;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-width:0}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.opt svg.ic{width:24px;height:24px;flex:none;color:var(--brand)}
.opt b{display:block;font-size:14px}
.opt span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.field{display:grid;gap:6px;margin-top:14px}
.field label,.field .lbl{font-weight:600;font-size:14px}
.field .help{font-size:12px;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-width:0}
.input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
textarea.input{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone{display:grid;grid-template-columns:128px 1fr;gap:8px;direction:ltr}
.phone .input{direction:ltr;text-align:left}
.err{color:var(--bad);font-size:13px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo-box{display:flex;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.logo-box img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:var(--sunk)}
.logo-box .ph{width:48px;height:48px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:20px}
.layout-thumb{width:64px;height:48px;flex:none;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden;border:1px solid var(--line)}
.layout-thumb i{position:absolute;background:var(--muted);opacity:.45;border-radius:2px}
.swatches{display:flex;gap:4px;flex:none}
.swatches i{width:18px;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.colors-custom{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.colors-custom label{display:flex;gap:8px;align-items:center;font-size:14px}
.colors-custom input[type=color]{width:42px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface)}
.checks{display:grid;gap:8px;margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer}
.check:has(input:checked){border-color:color-mix(in srgb,var(--brand) 60%,var(--line));background:color-mix(in srgb,var(--brand) 4%,var(--surface))}
.check input{margin-top:5px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.check b{font-size:14px}
.check span{display:block;font-size:12px;color:var(--muted)}
.check .price-note{margin-inline-start:auto;font-size:12px;white-space:nowrap;color:var(--muted);text-align:end}
.group-t{font-size:12px;font-weight:700;color:var(--muted);margin-top:16px;letter-spacing:.04em}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;vertical-align:middle}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.acc{background:var(--brand);color:var(--brand-ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.plan-pick{display:grid;gap:10px;margin-top:14px}
.plan-pick .opt{display:block}
.plan-pick .p-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.plan-pick .p-price{font-family:var(--f-display);font-size:20px;font-weight:700}
.breakdown{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.breakdown div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:14px;border-top:1px solid var(--line)}
.breakdown div:first-child{border-top:0}
.breakdown .total{background:var(--sunk);font-weight:700}
.breakdown .disc{color:var(--ok)}
.summary-list{display:grid;gap:4px;font-size:14px;margin:10px 0 0}
.summary-list div{display:flex;gap:8px}
.summary-list dt{color:var(--muted);min-width:96px;flex:none}
.summary-list dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{background:var(--info-bg);color:var(--info);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:12px}
.note.ok{background:var(--ok-bg);color:var(--ok)}

/* preview stage */
.stage-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);min-width:0}
.stage-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stage-bar h3{font-size:16px}
.stage-bar .seg{margin-inline-start:auto}
.browser{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.browser .chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
.browser .dots3{display:flex;gap:5px;direction:ltr}

.L-luxe .s-card{background:var(--scard);box-shadow:none;border:1px solid rgba(255,255,255,.08);border-radius:4px}
.L-luxe .s-ico{background:transparent;border:1px solid var(--ss);color:var(--ss)}
.L-luxe .s-head small{color:var(--ss)}
.L-luxe .s-price b{color:var(--ss)}
.L-luxe .s-add{background:var(--ss);color:#14110E}
.L-luxe .s-faq div{border-color:rgba(255,255,255,.12)}
.L-luxe .s-book,.L-luxe .s-filter span{background:var(--scard)}
.L-luxe .s-fld i{background:#14110E;border-color:rgba(255,255,255,.14)}
.L-luxe .s-foot{background:#0B0907}
.L-editorial{--sbg:#FBFBF8}
.L-editorial .s-hero{display:grid;grid-template-columns:2fr 1fr;gap:30px;align-items:stretch;padding-block:44px 36px}
.L-editorial .s-hero .t{max-width:none}
.L-editorial .s-hero h1{font-size:76px;line-height:1.08;font-weight:700}
.site.m.L-editorial .s-hero{grid-template-columns:1fr;padding-block:22px}
.site.m.L-editorial .s-hero h1{font-size:40px}
.L-editorial .s-hero .s-art{border-radius:0;min-height:240px}
.L-editorial .s-head{border-top:3px solid var(--sink);padding-top:12px}
.L-editorial .s-card{box-shadow:none;border-radius:0;border-top:1px solid color-mix(in srgb,var(--sink) 20%,transparent);background:transparent;padding-inline:0}
.L-editorial .s-btn{border-radius:0}
.s-sec{padding-block:48px}
.site.m .s-sec{padding-block:30px}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.s-head h2{font-size:30px}
.site.m .s-head h2{font-size:23px}
.s-head small{display:block;color:var(--sp);font-weight:700;font-size:13px;margin-bottom:4px}
.s-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.s-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.site.m .s-grid,.site.m .s-grid.c3{grid-template-columns:1fr}
.s-card{background:var(--scard);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);min-width:0}
.s-card h3{font-size:17px}
.s-card p{font-size:13.5px;opacity:.72;margin-top:4px}
.s-ico{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--sp) 12%,#fff);color:var(--sp);display:grid;place-items:center;margin-bottom:10px;font-family:var(--sfh),serif;font-weight:700}
.s-img{aspect-ratio:4/3;border-radius:10px;margin:-6px -6px 12px;background:linear-gradient(var(--a,135deg),color-mix(in srgb,var(--sp) 75%,#fff),color-mix(in srgb,var(--ss) 70%,#fff));position:relative;overflow:hidden}
.L-editorial .s-img{margin:0 0 12px;border-radius:0}
.s-img::after{content:"";position:absolute;inset:auto -20% -40% auto;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.25)}
.s-price{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.s-price b{color:var(--sp);font-size:16px}
.s-add{font-size:12px;background:var(--sp);color:#fff;border-radius:8px;padding:5px 10px;white-space:nowrap}
.s-stars{color:#E4A11B;font-size:13px;letter-spacing:1px}
.s-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.s-filter span{border:1px solid color-mix(in srgb,var(--sink) 16%,transparent);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.s-filter span:first-child{background:var(--sp);color:#fff;border-color:var(--sp)}
.s-about{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.site.m .s-about{grid-template-columns:1fr}
.s-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.s-stats b{display:block;font-family:var(--sfh),serif;font-size:28px;color:var(--sp)}
.L-luxe .s-stats b{color:var(--ss)}
.s-stats span{font-size:12px;opacity:.7}
.s-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.s-gal i{aspect-ratio:1;border-radius:12px;background:linear-gradient(var(--a),color-mix(in srgb,var(--sp) 70%,#fff),color-mix(in srgb,var(--ss) 65%,#fff))}
.s-gal i:nth-child(1){grid-row:span 2;aspect-ratio:auto}
.s-person{text-align:center}
.s-person .av{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(160deg,color-mix(in srgb,var(--ss) 70%,#fff),var(--sp));display:grid;place-items:center;color:#fff;font-family:var(--sfh),serif;font-size:26px}
.s-quote footer{margin-top:10px;font-weight:700;font-size:13px}
.s-faq div{border-bottom:1px solid color-mix(in srgb,var(--sink) 12%,transparent);padding-block:12px;display:flex;justify-content:space-between;gap:12px}
.s-faq div::after{content:"+";color:var(--sp);font-weight:700}
.s-book{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;background:var(--scard);border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.site.m .s-book{grid-template-columns:1fr}
.s-fld{display:grid;gap:4px;font-size:12px;opacity:.85}
.s-fld i{display:block;font-style:normal;border:1px solid color-mix(in srgb,var(--sink) 15%,transparent);border-radius:8px;padding:9px 10px;font-size:13px;background:var(--sbg)}
.s-news{background:var(--sp);color:#fff;border-radius:18px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.s-news h3{color:#fff}
.s-news .box{display:flex;gap:8px;background:#fff;border-radius:10px;padding:5px;min-width:260px}
.site.m .s-news .box{min-width:0;width:100%}
.s-news .box i{flex:1;font-style:normal;color:#888;padding:6px 10px;font-size:13px}
.s-contact{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.site.m .s-contact{grid-template-columns:1fr}
.s-map{min-height:200px;border-radius:16px;background:
  linear-gradient(0deg,transparent 48%,rgba(255,255,255,.7) 48% 52%,transparent 52%),
  linear-gradient(90deg,transparent 30%,rgba(255,255,255,.7) 30% 33%,transparent 33%),
  linear-gradient(35deg,transparent 60%,rgba(255,255,255,.6) 60% 62%,transparent 62%),
  color-mix(in srgb,var(--sp) 18%,#E9EEF2);position:relative}
.s-map::after{content:"";position:absolute;top:42%;left:45%;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ss);border:3px solid #fff}
.s-foot{background:var(--sink);color:rgba(255,255,255,.75);padding-block:26px;font-size:13px}
.s-foot .s-in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.s-float{position:absolute;bottom:18px;inset-inline-end:18px;display:flex;flex-direction:column;gap:10px;z-index:5}
.s-float i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.s-float .wa{background:#25D366}
.s-float .bot{background:var(--sp)}
.s-float svg{width:24px;height:24px;color:#fff}
.s-badge{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ss) 25%,#fff);color:var(--sink);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;margin-bottom:12px}
.L-classic .s-badge,.L-bold .s-badge{background:rgba(255,255,255,.18);color:#fff}
.L-luxe .s-badge{background:transparent;border:1px solid var(--ss);color:var(--ss)}
</style>

      if (JSON.stringify(snap.data()).length + JSON.stringify(order).length > 230000) throw {code:"too_large"};
      return ref.update({orders:{[order.id]:order}, updatedAt:now});
    });
  },
  patchOrder(uid, oid, patch){ return this.retry(() => this.db.doc("requests/" + uid).update({orders:{[oid]:patch}, updatedAt:new Date().toISOString()})); },
  async deleteOrder(uid, oid){
    const ref = this.db.doc("requests/" + uid); const snap = await ref.get(); if (!snap.exists) return;
    const d = clone(snap.data()); delete d.orders[oid]; d.updatedAt = new Date().toISOString(); return ref.set(d);
  },
  saveSettings(s){ return this.retry(() => this.db.doc("settings/main").set(s)); }
};

/* place a scaled site inside a fixed box; returns a re-fit function */
function scaleInto(box, cfg, mobile, scaler, fill=false){
  const el = scaler || box; el.innerHTML = siteHTML(cfg, mobile);
  const site = el.firstElementChild; const natural = mobile ? 390 : 1100;
  const fit = () => {
    const avail = mobile && !fill ? box.clientWidth - 24 : box.clientWidth;
    const k = Math.min(1, avail / natural);
    el.style.width = natural + "px";
    el.style.transformOrigin = mobile && !fill ? "top center" : (document.documentElement.dir === "ltr" ? "top left" : "top right");
    el.style.transform = k < 1 ? `scale(${k})` : "";
    el.style.marginBottom = (site.offsetHeight * k - site.offsetHeight) + "px";
  };
  fit(); return fit;
}

async function readLogo(file){
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw T("الصيغة غير مدعومة. استخدم PNG أو JPG أو WEBP.","Unsupported format. Use PNG, JPG or WEBP.");
  if (file.size > 3e6) throw T("حجم الملف أكبر من 3 ميجابايت.","File is larger than 3 MB.");
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 128 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(bmp.width*k)); cv.height = Math.max(1, Math.round(bmp.height*k));
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let url = cv.toDataURL("image/png");
  if (url.length > 22000) url = cv.toDataURL("image/webp", .85);
  if (url.length > 22000 || !LOGO_RE.test(url)) url = cv.toDataURL("image/jpeg", .8);
  if (url.length > 22000) throw T("تعذّر تصغير الشعار. جرّب صورة أبسط.","Could not compress the logo. Try a simpler image.");
  return url;
}

    code: genCode(), createdAt: now, status:"new", lang:LANG, history:[{s:"new", at:now}], adminNote:"", customerMessage:"",

function allOrders(){

  return out.sort((a,b) => b.createdAt.localeCompare(a.createdAt));
}
const findOrder = key => { const [uid, id] = key.split("|"); return allOrders().find(o => o._uid === uid && o.id === id) || null; };
function chartSVG(orders){
  const days = 14, today = new Date(); today.setHours(0,0,0,0);
  const buckets = Array.from({length:days}, (_,i) => ({d:new Date(today.getTime() - (days-1-i)*864e5), n:0}));
  orders.forEach(o => { const t = new Date(o.createdAt); t.setHours(0,0,0,0); const i = Math.round((t - buckets[0].d)/864e5); if (i >= 0 && i < days) buckets[i].n++; });
  const max = Math.max(1, ...buckets.map(b => b.n)); const step = max <= 4 ? 1 : Math.ceil(max/4);
  const top = Math.ceil(max/step)*step;
  const W = 560, H = 170, pl = 28, pb = 22, pt = 8, bw = (W - pl) / days;
  const y = v => pt + (H - pb - pt) * (1 - v/top);
  const rtl = LANG !== "en";
  const x = i => rtl ? W - pl - (i+1)*bw : pl + i*bw;
  let g = ""; for (let v = 0; v <= top; v += step) g += `<line x1="${rtl?0:pl}" x2="${rtl?W-pl:W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${rtl?W-pl+6:pl-6}" y="${y(v)+3}" text-anchor="${rtl?"start":"end"}">${v}</text>`;
  const bars = buckets.map((b,i) => `<rect x="${x(i)+bw*.18}" y="${y(b.n)}" width="${bw*.64}" height="${Math.max(0, H - pb - y(b.n))}" rx="3" fill="${i === days-1 ? "var(--accent)" : "var(--chart)"}"><title>${fmtDay(b.d)}: ${b.n}</title></rect>${i % 2 === (days-1) % 2 ? `<text x="${x(i)+bw/2}" y="${H-6}" text-anchor="middle">${fmtDay(b.d)}</text>` : ""}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T("الطلبات اليومية خلال 14 يوماً","Daily requests, last 14 days")}">${g}${bars}</svg>`;
}

function onSettings(d){ S.settings = sanitizeSettings(d); renderChrome(); if (S.coupon && !S.settings.coupons.some(c => c.active && c.code === S.coupon.code)) S.coupon = null;
  if (S.route === "home") renderHome(); else if (S.route === "build" && !S.lastSubmitted){ renderStep(); renderEstimate(); } else if (S.route === "admin" && S.adminTab === "orders") renderAdmin(); }
async function connect(){
  if (!window.claude?.use) return;
  try {
    const [db, user, ai, dl] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("sample"), window.claude.use("downloads")]);
    Repo.db = db; S.ai = ai || null; S.dl = dl || null;
    if (user){ Repo.uid = await user.id(); S.isAdmin = await user.canEdit(); document.documentElement.classList.toggle("is-admin", S.isAdmin); }
    if (db){
      Repo.watchSettings(onSettings);
      Repo.watchMine(d => { S.myDoc = d; if (S.route === "track") renderTrack(); });
      if (S.isAdmin) Repo.watchAll(list => { S.reqs = list; if (S.route === "admin"){ if (S.adminTab === "orders"){ if (document.activeElement?.id === "a-search") renderAdminRows(); else renderAdminOrders(); } if (S.openOrder && !$("#drawer")?.contains(document.activeElement)) renderDrawer(); } });
    }
    renderChrome(); if (S.route === "admin") renderAdmin(); if (S.route === "build" && !S.lastSubmitted && STEPS[S.step][0] === "info") renderStep();
  } catch (e) { console.warn("connect", e); }
}

const rgbOf = hex => [1,3,5].map(i => parseInt(hex.slice(i, i+2), 16));
const lum = hex => { const c = rgbOf(hex).map(v => v / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126*c[0] + .7152*c[1] + .0722*c[2]; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const shade = (hex, k) => "#" + rgbOf(hex).map(v => Math.max(0, Math.min(255, Math.round(v * k))).toString(16).padStart(2, "0")).join("");
const onColor = hex => contrast(hex, "#FFFFFF") >= contrast(hex, "#141414") ? "#FFFFFF" : "#141414";
function readable(hex){ let h = hex; for (let i = 0; i < 20 && contrast(h, "#FFFFFF") < 4.5; i++) h = shade(h, .9); return h; }

  btn.innerHTML = `<b class="num">${score}</b><span>${T("جودة الموقع","Site quality")}</span>`;
  panel.hidden = !S.scoreOpen;
  if (S.scoreOpen) panel.innerHTML = `<div class="score-head"><div class="ring ${scoreTone(score)}" style="--v:${score}"><b class="num">${score}</b></div><div><b>${score >= 85 ? T("موقعك جاهز للانطلاق","Your site is launch-ready") : T("خطوات بسيطة ترفع جودة موقعك","A few steps lift your site's quality")}</b><p class="muted">${T("نقيس الوضوح والثقة والظهور في البحث وسهولة التواصل.","We measure clarity, trust, search visibility and ease of contact.")}</p></div></div>
    <ul class="score-list">${checks.map(c => `<li class="${c.ok ? "ok" : ""}"><span class="mk" aria-hidden="true">${c.ok ? "✓" : "!"}</span><span>${esc(c.t)}</span><span class="num muted">${c.w}</span>${c.ok ? "" : `<button class="btn btn-ghost btn-sm" data-act="score-fix" data-v="${c.fix}">${c.fix === "goto" ? T("أكمل","Complete") : T("أصلح","Fix")}</button>`}</li>`).join("")}</ul>`;
}
function fixScore(kind){
  const c = S.cfg;
  if (kind === "goto"){ S.scoreOpen = false; $("#stage-wrap")?.classList.remove("sheet"); setStep(1); renderPreview(); return; }
  if (kind === "contrast"){ const p = palOf(c); c.pcustom = {p: readable(p.p), s: p.s}; }
  if (kind === "contact" && !c.sections.includes("contact")) c.sections.push("contact");
  if (kind === "trust" && !c.sections.includes("testimonials")) c.sections.splice(Math.max(0, c.sections.length - 1), 0, "testimonials");
  if (["whatsapp","seo"].includes(kind) && !c.features.includes(kind)) c.features.push(kind);
  saveDraft(); renderStep(); renderProgress(); renderPreview(); say(T("تم التحسين","Improved"));
}

/* ---------- sharing a design (link + QR), app QR, modal ---------- */
function qrSVG(text, cell = 4){
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:cell, margin:2, scalable:true}); } catch { return ""; }
}
const shareLink = cfg => location.origin + location.pathname + "#view=" + b64e(JSON.stringify({...sanitizeCfg(cfg), logo:"", plan:null}));
function openModal(html, label){
  closeModal();
  const bg = document.createElement("div"); bg.className = "drawer-bg"; bg.id = "modal-bg"; bg.dataset.act = "modal-close";
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label", label);
  m.innerHTML = `<button class="btn btn-ghost btn-sm modal-x" data-act="modal-close">${T("إغلاق","Close")}</button>${html}`;
  document.body.append(bg, m); $(".modal-x", m).focus({preventScroll:true});
}
function closeModal(){ $("#modal")?.remove(); $("#modal-bg")?.remove(); }
function openShare(){
  const url = shareLink(S.cfg);
  openModal(`<h3>${T("شارك تصميمك","Share your design")}</h3><p class="muted" style="margin-top:4px">${T("امسح الرمز بكاميرا الجوال لتجربة موقعك عليه، أو أرسل الرابط لشريكك ليبدي رأيه.","Scan with your phone camera to try the site there, or send the link for feedback.")}</p>
    <div class="qr">${qrSVG(url)}</div><input class="input" id="share-url" readonly dir="ltr" value="${esc(url)}" aria-label="${T("رابط التصميم","Design link")}">
    <div class="inline" style="margin-top:10px;justify-content:center"><button class="btn btn-primary btn-sm" data-act="share-copy">${T("نسخ الرابط","Copy link")}</button>${navigator.share ? `<button class="btn btn-ghost btn-sm" data-act="share-native">${T("مشاركة","Share")}</button>` : ""}</div>`, T("شارك تصميمك","Share your design"));
}
function openInstallHelp(){
  openModal(`<h3>${T("ثبّت بناء بيلدر على جهازك","Install Binaa Builder")}</h3>
    <ol class="how">${isIOS ? `<li>${T("اضغط زر المشاركة في سفاري أسفل الشاشة.","Tap the Share button in Safari.")}</li><li>${T("اختر «إضافة إلى الشاشة الرئيسية».","Choose Add to Home Screen.")}</li><li>${T("اضغط «إضافة»، وسيظهر بناء بيلدر بين تطبيقاتك.","Tap Add. Binaa Builder appears with your apps.")}</li>`
      : `<li>${T("افتح قائمة المتصفح (⋮) في كروم أو إيدج.","Open the browser menu (⋮) in Chrome or Edge.")}</li><li>${T("اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».","Choose Install app or Add to Home screen.")}</li>`}</ol>`, T("تثبيت التطبيق","Install the app"));
}
function appBand(){
  const url = S.settings.appUrl;
  if (APP ? !canInstall() : !url) return "";
  return `<div class="band" id="get-app"><div class="wrap app-band"><div><p class="eyebrow">${T("تطبيق بناء بيلدر","THE BINAA BUILDER APP")}</p><h2>${T("بناء بيلدر على جوالك وحاسوبك","Binaa Builder on your phone and computer")}</h2>
    <p class="sub">${T("ثبّته بنقرة واحدة دون متجر تطبيقات. يفتح كتطبيق مستقل، ويحفظ تصاميمك، ويعمل حتى دون اتصال، ويستقبل ما تشاركه من أي تطبيق آخر لتبدأ منه موقعك.","Install in one tap, no app store needed. It opens as its own app, keeps your designs, works offline, and accepts text shared from any app to start a site.")}</p>
    <div class="ctas">${APP ? `<button class="btn btn-primary" data-act="install">${T("ثبّت التطبيق","Install the app")}</button>` : `<a class="btn btn-primary" href="${esc(url)}" target="_blank" rel="noopener">${T("افتح التطبيق وثبّته","Open and install")}</a>`}</div></div>
    ${!APP ? `<div class="qr" aria-label="${T("رمز فتح التطبيق","App QR code")}">${qrSVG(url, 5)}</div>` : ""}</div></div>`;
}
function smartBand(){
  const items = [["spark",T("صمّم بالوصف أو بصوتك","Design by describing it"),T("اكتب فكرتك أو أملِها بصوتك، فنختار المجال والقالب والألوان والخصائص ونكتب النصوص.","Type or speak your idea; we pick the industry, layout, colors and features, and write the copy.")],
    ["creative",T("شعار أصلي في ثوانٍ","An original logo in seconds"),T("ستة مقترحات من اسمك وألوانك، تختار منها ما يناسبك وتنتقل إلى موقعك مباشرة.","Six concepts from your name and colors, applied to your site in one tap.")],
    ["analytics",T("مؤشر جودة الموقع","Site quality score"),T("نقيس وضوح الألوان والثقة والظهور في البحث، ونصلح الملاحظات بنقرة.","We check color legibility, trust and search readiness, with one-tap fixes.")],
    ["store",T("شارك وجرّب على جوالك","Share and try on your phone"),T("رمز QR ورابط لمعاينة تصميمك على أي جهاز ومشاركته مع شركائك.","A QR code and link to preview your design on any device and share it.")]];
  return `<div class="band"><div class="wrap"><h2>${T("أدوات ذكية تختصر عليك الطريق","Smart tools that save you time")}</h2>
    <div class="smart">${items.map(([i, h, p]) => `<div>${ico(i === "analytics" ? "spark" : i)}<h3>${h}</h3><p>${p}</p></div>`).join("")}</div></div></div>`;
}

/* ---------- shared-design view (#view=…) ---------- */
function renderView(){
  const c = S.shared, root = $("#v-view");
  if (!c?.cat){ root.innerHTML = `<div class="wrap"><div class="gate panel" style="padding:28px"><h2>${T("الرابط غير صالح","This link isn't valid")}</h2><button class="btn btn-primary" data-act="go" data-to="home" style="margin-top:14px">${T("الرئيسية","Home")}</button></div></div>`; return; }
  const mobile = S.device === "mobile";
  root.innerHTML = `<div class="wrap" style="padding-block:16px 40px"><div class="view-bar"><div><p class="eyebrow">${T("تصميم مقترح عبر بناء بيلدر","A design made with Binaa Builder")}</p><h2 style="font-size:22px">${esc(c.name || L(CAT[c.cat].name))}</h2></div>
    <div class="inline"><div class="seg" role="group" aria-label="${T("حجم الشاشة","Screen size")}"><button data-act="vdev" data-dev="desktop" aria-pressed="${!mobile}">${T("كمبيوتر","Desktop")}</button><button data-act="vdev" data-dev="mobile" aria-pressed="${mobile}">${T("جوال","Mobile")}</button></div>
    <button class="btn btn-primary btn-sm" data-act="adopt">${T("عدّل هذا التصميم","Edit this design")}</button></div></div>
    <div class="browser" style="margin-top:12px"><div class="chrome"><div class="dots3"><i></i><i></i><i></i></div><div class="url">www.${esc(slug(c))}.com</div></div><div class="viewport${mobile ? " mobile" : ""}" id="v-port" style="height:auto;min-height:60vh"><div class="scaler" id="v-scaler"></div></div></div></div>`;
  S.viewFit = scaleInto($("#v-port"), c, mobile, $("#v-scaler"));
}

/* ---------- files: client-site export and app config ---------- */
function siteDocument(cfg){
  const en = cfg.siteLang === "en", css = $("#site-css")?.textContent || "";
  return `<!doctype html><html lang="${en ? "en" : "ar"}" dir="${en ? "ltr" : "rtl"}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(cfg.name)}</title><meta name="description" content="${esc(cfg.tagline)}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Baloo+Bhaijaan+2:wght@500;700&display=swap">
<style>body{margin:0}${css}.site,.site.m{width:auto;min-height:100vh}</style></head><body>${siteHTML(cfg, false)}
<script>(function(){var s=document.querySelector(".site");function f(){s.classList.toggle("m",innerWidth<760)}f();addEventListener("resize",f)})()<\/script></body></html>`;
}
async function saveFile(filename, data, type){
  if (S.dl){ try { await S.dl.save({filename, data}); return "saved"; } catch (e) { if (e?.code === "declined") return "declined"; } }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type})); a.download = filename; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return "saved"; } catch { return "failed"; }
}

/* ---------- app shell: service worker, install, offline, config, share target ---------- */
function bootApp(){
  if (!APP) return;
  document.documentElement.classList.add("is-app");
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; renderChrome(); if (S.route === "home") renderHome(); });
  window.addEventListener("appinstalled", () => { S.installEvt = null; say(T("ثُبّت بناء بيلدر على جهازك","Binaa Builder is installed")); renderChrome(); if (S.route === "home") renderHome(); });
  window.addEventListener("online", renderChrome); window.addEventListener("offline", renderChrome);
  fetch("config.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).then(d => { if (d) onSettings(d); }).catch(() => {});
  const qs = new URLSearchParams(location.search), shared = [qs.get("title"), qs.get("text"), qs.get("url")].filter(Boolean).join(" ");
  if (shared){ S.idea = clean(shared, 400); store.set("mdk.idea", S.idea); try { history.replaceState(null, "", location.pathname + "#home"); } catch {} }
  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.addEventListener("updatefound", () => { const w = reg.installing; w?.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) showUpdate(w); }); });
    }).catch(() => {});
    let reloaded = false; navigator.serviceWorker.addEventListener("controllerchange", () => { if (S.wantReload && !reloaded){ reloaded = true; location.reload(); } });
  }
}
function showUpdate(worker){
  $("#upd")?.remove(); const b = document.createElement("div"); b.className = "update-bar"; b.id = "upd";
  b.innerHTML = `<span>${T("يتوفر إصدار أحدث من التطبيق","A newer version is available")}</span><button class="btn btn-primary btn-sm">${T("تحديث الآن","Update now")}</button>`;
  b.querySelector("button").onclick = () => { S.wantReload = true; worker.postMessage("skip-waiting"); };
  document.body.append(b);
}

Object.assign(S, {idea: store.get("mdk.idea", "") || "", magicBusy:false, rec:null, ideaNote:null, logoIdeas:null, logoSeed:0, logoBusy:false, scoreOpen:false, installEvt:null, shared:null, viewFit:null, dl:null, wantReload:false});
Object.assign(ACTIONS, {
  magic: () => magicBuild(),
  mic: () => toggleMic(),
  "idea-ex": el => { const x = IDEA_EXAMPLES[+el.dataset.i]; S.idea = T(x[0], x[1]); store.set("mdk.idea", S.idea); delete S.errors.idea; renderIdeaBoxes(); },
  "idea-dismiss": () => { S.ideaNote = null; renderStep(); },
  "logo-gen": async () => { if (S.logoBusy) return; S.logoBusy = true; renderStep(); S.logoIdeas = await logoIdeas(); S.logoSeed++; S.logoBusy = false; if (STEPS[S.step][0] === "info") renderStep(); },
  "logo-pick": el => { const u = S.logoIdeas?.[+el.dataset.i]; if (!u) return; S.cfg.logo = u; delete S.errors.logo; saveDraft(); renderStep(); renderPreview(); say(T("اعتمدنا الشعار في موقعك","Logo applied to your site")); },
  score: () => { S.scoreOpen = !S.scoreOpen; renderScore(); },
  "score-fix": el => fixScore(el.dataset.v),
  share: () => openShare(),
  "share-copy": async () => { const i = $("#share-url"); if (await copyText(i.value)) say(T("نُسخ الرابط","Link copied")); else { i.select(); say(T("حدّد الرابط وانسخه","Select and copy the link")); } },
  "share-native": async () => { try { await navigator.share({title: S.cfg.name || "Binaa Builder", text: T("شاهد تصميم موقعي على بناء بيلدر","See my site design on Binaa Builder"), url: $("#share-url").value}); } catch {} },
  "modal-close": () => closeModal(),
  install: async () => { if (S.installEvt){ const e = S.installEvt; S.installEvt = null; e.prompt(); try { await e.userChoice; } catch {} renderChrome(); if (S.route === "home") renderHome(); } else openInstallHelp(); },
  vdev: el => { S.device = el.dataset.dev; renderView(); },
  adopt: () => { S.cfg = sanitizeCfg({...S.shared}); saveDraft(); S.lastSubmitted = null; S.step = 1; try { history.replaceState(null, "", "#build"); } catch {} $("#v-build").innerHTML = ""; go("build"); },
  "d-export": async () => { const o = findOrder(S.openOrder); if (!o) return; const r = await saveFile(`binaa-${o.code}.html`, siteDocument(o.cfg), "text/html");
    say(r === "saved" ? T("جُهّز ملف الموقع للتنزيل","Site file ready") : r === "declined" ? T("أُلغي التنزيل","Download cancelled") : T("تعذّر التنزيل من هذا المتصفح","Download isn't available here")); },
  "app-config": async () => { const r = await saveFile("config.json", JSON.stringify(sanitizeSettings(S.settings), null, 2), "application/json");
    say(r === "saved" ? T("جُهّز ملف إعدادات التطبيق","App settings file ready") : T("تعذّر التنزيل من هذا المتصفح","Download isn't available here")); }
});

function openShared(h){ try { S.shared = sanitizeCfg(JSON.parse(b64d(h.slice(5)))); } catch { S.shared = null; } go("view"); }
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h.startsWith("view=")) return openShared(h); if (ROUTES.includes(h) && h !== "view" && h !== S.route) go(h); });
window.MDK = Object.freeze({quote, conv, bestPlan, normPhone, sanitizeOrder, sanitizeSettings, sanitizeCfg, DEFAULT_SETTINGS, parseIdea, siteScore, contrast, drawLogo, b64e, b64d, siteDocument, version:"3.0"});
(() => { bootApp(); const h = (location.hash || "").slice(1); renderChrome(); if (h.startsWith("view=")) openShared(h); else go(ROUTES.includes(h) && h !== "view" ? h : "home"); connect(); })();

})();</script>
