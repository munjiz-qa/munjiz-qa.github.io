<style>
/* التخطيط: شريط علوي داكن، قائمة جانبية على الكمبيوتر وشريط سفلي على الجوال، ومساحة عمل من بطاقات */
:root{
  --brand:#0E4A55; --brand-2:#0A3740; --brand-soft:#E3EEEF; --brass:#B8873A; --brass-soft:#F6EEDF;
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F8FAF9; --ink:#12262C; --muted:#5B6D71; --line:#DCE4E3;
  --g:#2F7D5B; --y:#B8920F; --o:#D2702A; --r:#BF3A30; --gs:#E4F2EB; --ys:#FBF3D6; --os:#FCEBDD; --rs:#F9E3E1;
  --f:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif; --rad:14px; --shadow:0 1px 2px rgba(10,40,48,.06),0 6px 18px rgba(10,40,48,.05);
  --paper:#fff; --paper-ink:#14272D;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#5FB3BF; --brand-2:#08262C; --brand-soft:#173338; --brass:#D9AE68; --brass-soft:#352B1C;
  --bg:#0D1719; --surface:#142225; --surface-2:#18292D; --ink:#E6EFEF; --muted:#9DB0B3; --line:#26393D;
  --g:#5DBB8E; --y:#E2C04A; --o:#F0985A; --r:#F07468; --gs:#173328; --ys:#332C12; --os:#3A2618; --rs:#3B1F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5FB3BF; --brand-2:#08262C; --brand-soft:#173338; --brass:#D9AE68; --brass-soft:#352B1C;
  --bg:#0D1719; --surface:#142225; --surface-2:#18292D; --ink:#E6EFEF; --muted:#9DB0B3; --line:#26393D;
  --g:#5DBB8E; --y:#E2C04A; --o:#F0985A; --r:#F07468; --gs:#173328; --ys:#332C12; --os:#3A2618; --rs:#3B1F1D; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num,.ltr{font-variant-numeric:tabular-nums}.ltr{direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

/* شريط علوي */
.top{position:sticky;top:0;z-index:40;background:var(--brand-2);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:62px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-size:23px;font-weight:700;line-height:1;display:block}
.brand small{display:block;font-size:11.5px;opacity:.78;line-height:1.35;font-weight:300}
.askbar{flex:1;max-width:620px;margin-inline:auto;position:relative}
.askbar input{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:9px 18px 9px 44px}
.askbar input::placeholder{color:rgba(255,255,255,.62)}
.askbar button{position:absolute;left:5px;top:50%;transform:translateY(-50%);border:0;background:var(--brass);color:#1d1406;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.who{display:flex;align-items:center;gap:8px;flex:none}
.chipbtn{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chipbtn.solid{background:var(--brass);border-color:var(--brass);color:#1d1406;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brass);color:#1d1406;display:grid;place-items:center;font-weight:700;border:0;cursor:pointer}
@media (max-width:820px){.askbar{display:none}.brand small{display:none}}

/* هيكل */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 62px)}
.side{background:var(--surface);border-inline-start:1px solid var(--line);padding:14px 10px 30px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.side h6{margin:14px 10px 4px;font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--ink);text-align:start;font-size:14.5px}
.nv svg{flex:none;opacity:.8}
.nv:hover{background:var(--surface-2)}
.nv[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nv .cnt{margin-inline-start:auto;background:var(--r);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
main{padding:22px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px));min-width:0;max-width:1400px;width:100%}
.bnav{display:none}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:62px 0 0 auto;width:min(300px,86vw);z-index:50;transform:translateX(105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2);height:auto}
  .side.open{transform:none}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);padding:5px 0;cursor:pointer}
  .bnav button[aria-current="page"]{color:var(--brand);font-weight:600}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44}

/* مكونات */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:24px;font-weight:600;line-height:1.3}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ph .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.hint{color:var(--muted);font-size:13px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:30px;font-weight:600;line-height:1.2}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06191c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#06191c}}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--r)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
textarea.inp{min-height:110px;resize:vertical;line-height:1.7}
.field{margin-bottom:12px}.field>label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 9px;font-size:12px;line-height:22px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.lv0{--c:var(--g);--cs:var(--gs)}.lv1{--c:var(--y);--cs:var(--ys)}.lv2{--c:var(--o);--cs:var(--os)}.lv3{--c:var(--r);--cs:var(--rs)}
.lvtag{background:var(--cs);color:var(--c);border-color:transparent;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:start;width:100%}
.item:hover{border-color:var(--brand)}
.item .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.item .t{font-weight:500;line-height:1.55}
.item .m{font-size:12.5px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--surface-2);font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14.5px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.notice{background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.meter{height:7px;background:var(--surface-2);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand);border-radius:9px}
.empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:14px}
.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
svg text{font-family:var(--f)}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:90;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.drawer{position:fixed;inset:0;z-index:70;display:flex;justify-content:flex-start;background:rgba(6,22,26,.45)}
.drawer .pane{background:var(--surface);width:min(620px,100vw);height:100%;overflow:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
.drawer .ph{position:sticky;top:-18px;background:var(--surface);padding-top:8px;z-index:2;border-bottom:1px solid var(--line);padding-bottom:10px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(6,22,26,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;width:100%;max-width:440px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:19px}
.err{color:var(--r);font-size:14px;min-height:20px;margin:4px 0}
.pwshow{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:5px 12px;direction:ltr;display:inline-block;user-select:all}

/* المساعد */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}
@media (max-width:1100px){.chat{grid-template-columns:minmax(0,1fr)}.chat aside{display:none}}
.msgs{display:grid;gap:14px;margin-bottom:14px}
.q{justify-self:start;background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 16px;max-width:88%}
:root[data-theme="dark"] .q{color:#06191c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q{color:#06191c}}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.ans h4{margin:12px 0 6px;font-size:15px;color:var(--brand)}
.ans h4:first-child{margin-top:0}
.ans ul{margin:0;padding-inline-start:20px}
.ans li{margin:3px 0}
.ans .counter{background:var(--brass-soft);border-radius:12px;padding:8px 12px;margin-top:10px}
.ans .counter h4{color:var(--brass)}
.ref{border:0;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:0 5px;font-size:12px;cursor:pointer;font-weight:600;margin:0 1px}
.steps{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.steps summary{cursor:pointer;color:var(--muted)}
.steps ol{margin:6px 0 0;padding-inline-start:20px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0}
@media (min-width:981px){.composer{bottom:0}}
.composer form{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;max-height:160px;padding:8px 10px;outline:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.sugg button:hover{border-color:var(--brand);color:var(--brand)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}

/* الواجهة العامة */
.land{max-width:1100px;margin:0 auto;padding:30px 0 60px}
.hero{background:linear-gradient(135deg,var(--brand-2),#0E4A55 60%,#13606D);color:#fff;border-radius:22px;padding:42px 34px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,4vw,40px);margin:0 0 10px;line-height:1.35;font-weight:600}
.hero p{font-size:16.5px;opacity:.9;max-width:640px;margin:0 0 22px}
.hero svg.deco{position:absolute;left:-40px;bottom:-60px;opacity:.13;width:360px;height:360px}
.five{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:860px){.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.five{grid-template-columns:minmax(0,1fr)}.hero{padding:30px 20px}}
.five .card b{display:block;font-size:16px;margin-bottom:2px}

/* الورقة المطبوعة للموجز */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:34px 38px;box-shadow:0 2px 12px rgba(0,0,0,.08);max-width:900px;margin:0 auto;border:1px solid #e3e8e7}
.paper h2{font-size:22px;margin:0;color:#0E4A55}
.paper h3{font-size:15.5px;color:#0E4A55;border-bottom:2px solid #B8873A;padding-bottom:4px;margin:22px 0 8px}
.paper ul{margin:0;padding-inline-start:20px}.paper li{margin:3px 0}
.paper table th{background:#F1F5F4;color:#4c5e62}.paper td,.paper th{border-color:#e3e8e7}
.paper .mark{display:flex;justify-content:space-between;font-size:12px;color:#5b6d71;border-bottom:1px solid #e3e8e7;padding-bottom:8px;margin-bottom:16px}
@media (max-width:600px){.paper{padding:20px 16px}}
@media print{
  .top,.side,.bnav,.ph .acts,.no-print,.toast,.composer{display:none!important}
  body{background:#fff}.shell{display:block}main{padding:0;max-width:none}
  .paper{box-shadow:none;border:0;padding:0;max-width:none}
  @page{size:A4;margin:16mm}
}
</style>
</head>

  try { await loadLib("assets/lib/docx.js", () => window.docx); } catch { toast("تعذر تحميل أداة إنشاء ملف Word. تحقق من الاتصال."); return; }
  const D = window.docx, org = S.db.settings.org || "الوزارة";
  const P = (t, o = {}) => new D.Paragraph({ bidirectional: true, alignment: D.AlignmentType.RIGHT, spacing: { after: 80 }, ...o, children: [new D.TextRun({ text: t, rightToLeft: true, font: "Arial", size: o.size || 22, bold: o.bold, color: o.color })] });
  const H = t => P(t, { bold: true, size: 26, color: "0E4A55", spacing: { before: 240, after: 100 } });
  const B = arr => arr.length ? arr.map(t => P("• " + t)) : [P("لا يوجد.", { color: "5B6D71" })];
  const cell = (t, h) => new D.TableCell({ shading: h ? { fill: "EEF3F2" } : undefined, children: [P(t, { bold: h, size: 20 })] });
  const tbl = new D.Table({ visuallyRightToLeft: true, width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [new D.TableRow({ tableHeader: true, children: ["المؤشر", "القيمة", "التغير", "المستوى"].map(t => cell(t, true)) })].concat(b.kpis.map(k => new D.TableRow({ children: [k.name, N(k.v) + " " + k.unit, PCT(k.ch), LVN[k.lv]].map(t => cell(t)) }))) });
  const doc = new D.Document({ creator: org, lastModifiedBy: org, title: b.title, description: "", styles: { default: { document: { run: { font: "Arial", rightToLeft: true } } } },
    sections: [{ properties: { page: { margin: { top: 1000, bottom: 1000, left: 1000, right: 1000 } } }, children: [
      P(org + " · مكتب الذكاء المؤسسي والاستشراف · التصنيف: داخلي", { size: 18, color: "5B6D71" }), P(b.title, { bold: true, size: 36, color: "0E4A55" }), P(DL(b.date), { color: "5B6D71" }),
      P(`مؤشر الضغط الاستراتيجي ${b.spi}/100 · مؤشر الفرص ${b.opp}/100 · جودة المعلومات ${b.iqs}%`, { bold: true }),
      H("أهم التطورات"), ...B(b.devs.map(d => `${d.t} (${d.src}، ${DL(d.d)}، ثقة ${d.q}%)`)), H("أهم المؤشرات"), tbl,
      H("أهم المخاطر"), ...B(b.risks.map(r => `[${LVN[r.lv]}] ${r.t}: ${r.r} (المسؤول: ${r.owner})`)), H("أهم الفرص"), ...B(b.opps), H("التغيرات غير الطبيعية"), ...B(b.unusual),
      H("التوقعات"), ...B(b.forecasts), H("موضوعات تحتاج إلى متابعة"), ...B(b.follow), H("موضوعات مقترحة للقرار"), ...B(b.decide),
      H("أثر القرارات السابقة"), P(`قيس أثر ${b.learning.measured} من ${b.learning.total} قرارات، وبلغت نسبة تحقق الأثر ${b.learning.rate}%.`), ...B(b.learning.lessons.slice(0, 2).map(l => l.text)),
      H("البيانات الناقصة"), ...B(b.gaps), H("المصادر"), P(b.sources.join("، "), { size: 18, color: "5B6D71" })] }] });
  const blob = await D.Packer.toBlob(doc), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = b.title + " - " + b.date + ".docx"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("نُزّل ملف Word.");
}

/* صفحات المعلومات: بطاقات المعلومات، بوابة الرصد، المعرفة المؤسسية، ونماذج الإدخال المشتركة */
const SRC_T = { int: "داخلي", ext: "خارجي", staff: "بلاغ موظف", social: "وسائل التواصل" };
const DIR_T = { "-1": "سلبي", "0": "محايد", "1": "إيجابي" }, IMP_T = { 1: "منخفض", 2: "متوسط", 3: "مرتفع" };

/* ---------- بطاقات المعلومات ---------- */
PAGES.cards = () => {
  const f = JSON.parse(ST.ls.get("mq-cf") || "{}"), lvl5 = !CAN("cards");
  let L = S.db.cards.slice();
  if (lvl5) L = L.filter(c => c.by === S.user.id || c.status === "verified");
  if (f.st) L = L.filter(c => c.status === f.st); if (f.tp) L = L.filter(c => c.topic === f.tp); if (f.pe) L = L.filter(c => c.pestel === f.pe);
  if (f.q) { const hits = new Set(E.search(S.db, f.q, 60, ["card"]).map(r => r.id)); L = L.filter(c => hits.has(c.id)); }
  L.sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
  const pend = S.db.cards.filter(c => c.status === "new" || c.status === "review").length;
  return `<div class="ph"><div><h1>بطاقات المعلومات</h1><p>كل معلومة مهمة تحمل بطاقة موحدة: المصدر والموثوقية والأثر والاتجاه والتحليل والمتابعة. ${pend ? `<b>${pend}</b> بطاقة تنتظر التحقق.` : ""}</p></div><div class="acts">${CAN("cards") ? `<button class="btn pri" id="newCard">${ic("plus", 18)} بطاقة جديدة</button>` : `<button class="btn pri" data-go="submit">${ic("submit", 18)} إرسال معلومة</button>`}</div></div>
   <div class="card" style="margin-bottom:12px"><div class="grid g4" style="gap:8px">
    <input class="inp" id="cfq" placeholder="بحث في البطاقات" value="${esc(f.q || "")}" aria-label="بحث">
    <select class="inp" id="cfst" aria-label="الحالة"><option value="">كل الحالات</option>${opts(Object.entries(META.status), f.st)}</select>
    <select class="inp" id="cftp" aria-label="الموضوع"><option value="">كل الموضوعات</option>${topicOpts(f.tp)}</select>
    <select class="inp" id="cfpe" aria-label="البعد"><option value="">كل الأبعاد</option>${pestelOpts(f.pe)}</select></div></div>
   <div class="list">${L.map(c => cardRow(c).replace('<span class="t">', `<span class="t">${c.status !== "verified" ? `<span class="tag" style="margin-inline-end:6px">${META.status[c.status]}</span>` : ""}`)).join("") || `<div class="card empty">لا توجد بطاقات مطابقة.</div>`}</div>`;
};
PAGES.cards.bind = arg => {
  const save = () => { ST.ls.set("mq-cf", JSON.stringify({ q: $("#cfq").value.trim(), st: $("#cfst").value, tp: $("#cftp").value, pe: $("#cfpe").value })); route(); };
  ["#cfst", "#cftp", "#cfpe"].forEach(s => $(s).onchange = save);
  $("#cfq").onkeydown = e => { if (e.key === "Enter") save(); };
  const n = $("#newCard"); if (n) n.onclick = () => cardForm({});
  if (arg) openCard(arg);
};
function openCard(id) {
  const c = CARD(id); if (!c) { toast("البطاقة غير متاحة لمستوى صلاحيتك."); return; }
  const q = E.iqs(c, S.db), p = q.parts, mine = c.by === S.user.id;
  const canEdit = CAN("cards") || (mine && c.status === "new");
  const row = (k, v) => `<tr><th style="width:34%">${k}</th><td>${v || "—"}</td></tr>`;
  const linked = (c.links || []).map(CARD).filter(Boolean), conf = q.conflict.map(CARD).filter(Boolean);
  const rel = E.search(S.db, c.title, 5, ["card", "doc"]).filter(r => !(r.type === "card" && r.id === c.id)).slice(0, 4);
  drawer(dhead("بطاقة معلومات", `${META.status[c.status]} · أُنشئت بواسطة ${esc(nameOf(c.by))}`) + `
   <h2 style="font-size:18px;margin:12px 0 10px;line-height:1.5">${esc(c.title)}</h2>
   <div class="grid g2" style="gap:10px;margin-bottom:12px"><div class="card" style="box-shadow:none"><div class="hint">مؤشر جودة المعلومة</div><b class="num" style="font-size:28px">${q.score}%</b>${meter(q.score, q.score >= 75 ? "var(--g)" : q.score >= 50 ? "var(--y)" : "var(--r)")}</div>
    <div class="card" style="box-shadow:none;font-size:13px">${[["موثوقية المصدر", p.rel], ["مصداقية المعلومة", p.cred], ["الحداثة", p.fresh], ["الاكتمال", p.complete], ["المصادر الداعمة", p.corr]].map(([k, v]) => `<div class="split"><span>${k}</span><span class="num">${v}%</span></div>`).join("")}${p.conflict ? `<div class="split" style="color:var(--r)"><span>خصم التعارض</span><span class="num">-${p.conflict}</span></div>` : ""}</div></div>
   <div class="tbl"><table><tbody>
    ${row("التاريخ", DL(c.date))}${row("المصدر", esc(c.source) + ` <span class="tag">${SRC_T[c.srcType] || ""}</span>`)}${row("تقييم المصدر والمعلومة", `<span class="tag ltr">${esc(c.rel)}${esc(c.cred)}</span> ${esc(META.rel[c.rel] || "")}، ${esc(META.cred[c.cred] || "")}`)}
    ${row("الموضوع", ref("topic", c.topic, E.topicName(S.db, c.topic)))}${row("القطاع", esc(c.sector))}${row("البعد", esc(META.pestel[c.pestel] || ""))}${row("المنطقة", esc(c.region))}
    ${row("التأثير المحتمل", IMP_T[c.impact])}${row("اتجاه التأثير", DIR_T[c.dir])}${row("التصنيف", META.classes[c.cls])}
    ${row("معلومات داعمة", linked.map(x => ref("card", x.id, x.title)).join("<br>"))}${row("معلومات متعارضة", conf.map(x => ref("card", x.id, x.title)).join("<br>"))}
    ${row("التحليل", esc(c.analysis))}${row("الإجراء المقترح", esc(c.action))}${row("المسؤول", esc(c.owner))}${row("حالة المتابعة", META.status[c.status])}
   </tbody></table></div>
   ${rel.length ? `<h3 style="font-size:15px;margin:14px 0 6px">معلومات ذات صلة رصدها محرك الربط</h3><div class="list">${rel.map(r => `<button class="item" data-open="${r.type}:${r.id}"><span><span class="t">${esc(r.title)}</span><br><span class="m">${r.type === "doc" ? "وثيقة" : "بطاقة"}</span></span></button>`).join("")}</div>` : ""}
   <div class="row" style="margin-top:14px">${CAN("verify") ? `${c.status !== "verified" ? `<button class="btn pri" data-cst="verified">اعتماد كمعلومة موثقة</button>` : ""}${c.status !== "review" ? `<button class="btn" data-cst="review">إرجاع للتحقق</button>` : ""}${c.status !== "rejected" ? `<button class="btn danger" data-cst="rejected">استبعاد</button>` : ""}` : ""}${canEdit ? `<button class="btn" id="ced">تعديل</button>` : ""}${CAN("agent") ? `<button class="btn" id="cask">اسأل المساعد عنها</button>` : ""}${(S.user.role === "admin" || mine) ? `<button class="btn danger" id="cdel">حذف</button>` : ""}</div>`, d => {
    d.querySelectorAll("[data-cst]").forEach(b => b.onclick = async () => { try { await put("cards", Object.assign({}, c, { status: b.dataset.cst }), "حُدّثت حالة البطاقة."); openCard(id); refreshUnder(); } catch (x) { toast(x.message); } });
    const ed = d.querySelector("#ced"); if (ed) ed.onclick = () => cardForm(c);
    const ak = d.querySelector("#cask"); if (ak) ak.onclick = () => { closeDrawer(); go("ask"); setTimeout(() => ask("ماذا نعرف عن: " + c.title + "؟"), 40); };
    const dl = d.querySelector("#cdel"); if (dl) dl.onclick = async () => { if (!dl.dataset.ok) { dl.dataset.ok = 1; dl.textContent = "تأكيد الحذف"; return; } try { await del("cards", id, "حُذفت البطاقة."); closeDrawer(); refreshUnder(); } catch (x) { toast(x.message); } };
  });
}
function refreshUnder() { if (S.page && PAGES[S.page]) { const old = $("#main"), m = old.cloneNode(false); old.replaceWith(m); m.innerHTML = PAGES[S.page](null); if (PAGES[S.page].bind) PAGES[S.page].bind(null); } }
function pickList(id, list, sel, label) {
  return `<div class="field"><label>${label}</label><input class="inp" placeholder="تصفية…" data-pf="${id}" style="min-height:34px;margin-bottom:4px"><div id="${id}" style="max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px">${list.map(([v, l]) => `<label style="display:flex;gap:8px;font-size:13.5px;padding:2px 0"><input type="checkbox" value="${esc(v)}"${(sel || []).includes(v) ? " checked" : ""}> <span>${esc(l)}</span></label>`).join("") || `<span class="hint">لا عناصر.</span>`}</div></div>`;
}
const picked = (d, id) => Array.from(d.querySelectorAll(`#${id} input:checked`)).map(i => i.value);
function bindPick(d) { d.querySelectorAll("[data-pf]").forEach(inp => inp.oninput = () => { const q = E.norm(inp.value); d.querySelectorAll(`#${inp.dataset.pf} label`).forEach(l => l.hidden = q && E.norm(l.textContent).indexOf(q) < 0); }); }
function cardForm(c) {
  const isNew = !c.id, full = CAN("cards");
  const others = S.db.cards.filter(x => x.id !== c.id).map(x => [x.id, x.title]);
  drawer(dhead(isNew ? "بطاقة معلومات جديدة" : "تعديل البطاقة", "الحقول وفق نموذج بطاقة المعلومات الموحد") + `<form id="cfm" novalidate style="margin-top:12px">
   <div class="field"><label for="f_t">عنوان المعلومة</label><input class="inp" id="f_t" maxlength="200" value="${esc(c.title)}"></div>
   <div class="grid g2" style="gap:0 12px">
    <div class="field"><label for="f_d">التاريخ</label><input class="inp" type="date" id="f_d" value="${esc(c.date || today())}" max="${today()}"></div>
    <div class="field"><label for="f_s">المصدر</label><input class="inp" id="f_s" maxlength="120" value="${esc(c.source)}" list="srcList"><datalist id="srcList">${S.db.sources.map(s => `<option value="${esc(s.name)}">`).join("")}</datalist></div>
    <div class="field"><label for="f_st">نوع المصدر</label><select class="inp" id="f_st">${opts(Object.entries(SRC_T), c.srcType || "int")}</select></div>
    <div class="field"><label for="f_r">موثوقية المصدر</label><select class="inp" id="f_r">${opts(Object.entries(META.rel).map(([k, v]) => [k, k + " - " + v]), c.rel || "C")}</select></div>
    <div class="field"><label for="f_c">مصداقية المعلومة</label><select class="inp" id="f_c">${opts(Object.entries(META.cred).map(([k, v]) => [k, k + " - " + v]), c.cred || 3)}</select></div>
    <div class="field"><label for="f_p">البعد</label><select class="inp" id="f_p">${pestelOpts(c.pestel || "E")}</select></div>
    <div class="field"><label for="f_tp">الموضوع</label><select class="inp" id="f_tp">${topicOpts(c.topic)}</select></div>
    <div class="field"><label for="f_sec">القطاع</label><select class="inp" id="f_sec">${sectorOpts(c.sector || "عام")}</select></div>
    <div class="field"><label for="f_rg">المنطقة</label><input class="inp" id="f_rg" maxlength="80" value="${esc(c.region)}"></div>
    <div class="field"><label for="f_i">التأثير المحتمل</label><select class="inp" id="f_i">${opts(Object.entries(IMP_T), c.impact || 2)}</select></div>
    <div class="field"><label for="f_dir">اتجاه التأثير</label><select class="inp" id="f_dir">${opts(Object.entries(DIR_T), c.dir ?? -1)}</select></div>
    <div class="field"><label for="f_cls">التصنيف</label><select class="inp" id="f_cls">${clsOpts(c.cls)}</select></div>
    <div class="field"><label for="f_o">المسؤول</label><input class="inp" id="f_o" maxlength="80" value="${esc(c.owner)}"></div>
    ${full ? `<div class="field"><label for="f_sts">حالة المتابعة</label><select class="inp" id="f_sts">${opts(Object.entries(META.status), c.status || "review")}</select></div>` : ""}
   </div>
   <div class="field"><label for="f_a">التحليل</label><textarea class="inp" id="f_a" maxlength="1500">${esc(c.analysis)}</textarea></div>
   <div class="field"><label for="f_ac">الإجراء المقترح</label><input class="inp" id="f_ac" maxlength="300" value="${esc(c.action)}"></div>

      const it = Object.assign({}, c, { title: v("#f_t"), date: v("#f_d"), source: v("#f_s"), srcType: v("#f_st"), rel: v("#f_r"), cred: +v("#f_c"), pestel: v("#f_p"), topic: v("#f_tp"), sector: v("#f_sec"), region: v("#f_rg"), impact: +v("#f_i"), dir: +v("#f_dir"), cls: +v("#f_cls"), owner: v("#f_o"), analysis: v("#f_a"), action: v("#f_ac") });
      if (full) { it.status = v("#f_sts"); it.links = picked(d, "f_ln"); it.conflicts = picked(d, "f_cf"); } else { it.status = "new"; it.links = it.links || []; it.conflicts = it.conflicts || []; }

    };

/* ---------- بوابة الرصد ---------- */
let SUB = null;
PAGES.submit = () => {
  const mine = S.db.cards.filter(c => c.by === S.user.id).sort((a, b) => (b.upd || b.date) < (a.upd || a.date) ? -1 : 1).slice(0, 12);
  return `<div class="ph"><div><h1>بوابة الرصد</h1><p>أرسل «معلومة ذات أهمية للقيادة». يسجلها النظام ويصنفها ويحدد أهميتها ويربطها بما يشبهها، ثم ترسل للتحقق قبل دخولها التحليل.</p></div></div>
  <div class="grid g-main"><div class="card"><form id="sf" novalidate>
   <div class="field"><label for="s_t">ماذا رصدت؟</label><textarea class="inp" id="s_t" maxlength="1200" placeholder="مثال: رصدنا اليوم في زيارة ميدانية ارتفاع سعر الدجاج المجمد 15% في ثلاثة منافذ بالريان، والموردون يعزونه إلى تأخر الشحنات.">${esc(SUB ? SUB.text : "")}</textarea></div>
   <div class="grid g3" style="gap:0 12px"><div class="field"><label for="s_r">المنطقة أو الجهة (اختياري)</label><input class="inp" id="s_r" maxlength="80" value="${esc(SUB ? SUB.region : "")}"></div>
    <div class="field"><label for="s_src">كيف عرفت؟</label><select class="inp" id="s_src">${opts([["B", "مشاهدة مباشرة أو زيارة ميدانية"], ["C", "من مورد أو جهة ذات علاقة"], ["D", "نقلاً عن آخرين"], ["E", "من وسائل التواصل"]], SUB ? SUB.rel : "B")}</select></div>
    <div class="field"><label for="s_cls">التصنيف</label><select class="inp" id="s_cls">${opts(Object.entries(META.classes).filter(([k]) => +k <= Math.min(2, S.db.clear)), 2)}</select></div></div>
   <div class="row"><button class="btn pri" id="s_an">تحليل المعلومة</button><span class="hint">لن تُرسل قبل مراجعتك للتصنيف.</span></div></form>
   <div id="s_res"></div></div>
   <div class="card"><h3>بلاغاتي <small>${mine.length}</small></h3><div class="list">${mine.map(c => `<button class="item" data-open="card:${c.id}"><span style="flex:1"><span class="t">${esc(c.title)}</span><br><span class="m">${DL(c.date)}</span></span><span class="tag">${META.status[c.status]}</span></button>`).join("") || `<div class="empty">لم ترسل بلاغات بعد.</div>`}</div>
   <p class="hint" style="margin-bottom:0">بعد الإرسال يراجع المحللون المعلومة ويطلبون منك الإضافات عند الحاجة، وتتابع حالتها هنا.</p></div></div>`;
};
PAGES.submit.bind = () => {
  $("#sf").onsubmit = e => {
    e.preventDefault(); const text = $("#s_t").value.trim();
    if (text.length < 20) { $("#s_res").innerHTML = `<p class="err">اكتب المعلومة بتفصيل أكثر (20 حرفاً على الأقل).</p>`; return; }
    const k = E.classify(text + " " + $("#s_r").value, S.db);
    SUB = { text, region: $("#s_r").value.trim(), rel: $("#s_src").value, cls: +$("#s_cls").value, k };

const LIBS = { xlsx: ["assets/lib/xlsx.js", () => window.XLSX], pdf: ["assets/lib/pdf.min.js", () => window.pdfjsLib], docx: ["assets/lib/mammoth.js", () => window.mammoth] };
function pdfText(items) {
  const lines = [];
  items.filter(x => x.str && x.str.trim()).forEach(x => { const y = x.transform[5], h = Math.abs(x.transform[3]) || 10; let L = lines.find(l => Math.abs(l.y - y) < h * .5); if (!L) lines.push(L = { y, h, it: [] }); L.it.push({ s: x.str, x: x.transform[4], w: x.width || 0 }); });
  return lines.sort((a, b) => b.y - a.y).map(L => { const txt = L.it.map(i => i.s).join(""), rtl = (txt.match(/[؀-ۿ]/g) || []).length > (txt.match(/[A-Za-z]/g) || []).length; return L.it.sort((a, b) => rtl ? (b.x + b.w) - (a.x + a.w) : a.x - b.x).map(i => i.s).join(" ").normalize("NFKC"); }).join("\n");
}
async function readFile(f) {
  const ext = (f.name.split(".").pop() || "").toLowerCase(); let text = "";
  if (f.size > 10 * 1024 * 1024) throw new Error("حجم الملف أكبر من 10 ميغابايت.");
  if (["xlsx", "xls", "csv"].includes(ext)) { await loadLib(...LIBS.xlsx); const wb = XLSX.read(await f.arrayBuffer(), { type: "array" }); text = wb.SheetNames.map(n => n + "\n" + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n"); }
  else if (ext === "pdf") { await loadLib(...LIBS.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdf[0].replace("pdf.min.js", "pdf.worker.min.js"); const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; for (let i = 1; i <= Math.min(pdf.numPages, 60); i++) text += pdfText((await (await pdf.getPage(i)).getTextContent()).items) + "\n\n"; }
  else if (ext === "docx") { await loadLib(...LIBS.docx); text = (await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value; }
  else if (["txt", "md"].includes(ext)) text = await f.text();
  else throw new Error("الصيغة غير مدعومة. الصيغ المتاحة: PDF وWord وExcel وCSV والنص.");
  text = text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim(); if (!text) throw new Error("لم يُعثر على نص قابل للقراءة في الملف.");
  return text;
}

  const nc = Object.keys(cols).length, W = 1000, colW = W / nc, rowH = 86, H = Math.max(...Object.values(cols).map(c => c.length)) * rowH + 40, pos = {};
  Object.keys(cols).forEach(c => cols[c].forEach((x, i) => { pos[x.id] = { x: W - (+c + .5) * colW, y: 30 + i * rowH + (H - 40 - cols[c].length * rowH) / 2 + rowH / 2 }; }));

  inds.forEach(x => { const p = pos[x.id], a = E.analyzeInd(x, nowM), lv = x.th ? a.level : 0; const dim = sel && sel !== x.id && !links.some(l => (l.from === sel && l.to === x.id) || (l.to === sel && l.from === x.id));

  return `<div class="ph"><div><h1>خريطة الترابط</h1><p>محرك ربط المعلومات: كيف ينتقل أثر متغير إلى آخر. اضغط مؤشراً لإبراز سلسلته، ومرّر على السهم لقراءة العلاقة.</p></div>${sel ? `<div class="acts"><button class="btn" data-go="graph">إلغاء الإبراز</button><button class="btn pri" data-open="ind:${esc(sel)}">تفاصيل المؤشر</button></div>` : ""}</div>
   <div class="card" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:760px;width:100%" role="img" aria-label="شبكة الترابط بين المؤشرات">${g}</svg>

      if (b.dataset.uedit) form(users.find(u => u.id === b.dataset.uedit));
      if (b.dataset.ureset) { const pw = tmpPw(), r = await ST.call("resetUser", { id: b.dataset.ureset, pw }); usersUI(box, r.users); $("#umsg").innerHTML = `كلمة المرور المؤقتة: <span class="pwshow">${esc(pw)}</span> سلّمها للمستخدم، وسيُطلب منه تغييرها عند الدخول.`; }
      if (b.dataset.udel) { if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "تأكيد الحذف"; return; } const r = await ST.call("delUser", { id: b.dataset.udel }); usersUI(box, r.users); toast("حُذف المستخدم وأُنهيت جلساته."); }
    } catch (x) { msg.textContent = x.message; }
  };
}
function settingsUI(box) {
  const s = S.db.settings;
  box.innerHTML = `<div class="grid g2"><form class="card" id="stf"><h3>الإعدادات العامة</h3>
    <div class="field"><label for="s_org">اسم الجهة في التقارير</label><input class="inp" id="s_org" maxlength="80" value="${esc(s.org || "")}"></div>
    <p class="hint">حالة الخادم: ${ST.LOCAL ? "غير مربوط (الوضع المحلي)" : "مربوط"} · المساعد التحليلي: مدمج في المنصة ويعمل دون أي اتصال خارجي</p><button class="btn pri">حفظ الإعدادات</button></form>
   <div class="card"><h3>البيانات</h3><p class="hint" style="margin-top:0">نسخة احتياطية كاملة بصيغة JSON، أو استعادتها، أو مسح بيانات التشغيل الأولي مع الإبقاء على تعريفات المؤشرات والموضوعات والمصادر.</p>
    <div class="grid" style="gap:8px"><button class="btn" id="bk">تنزيل نسخة احتياطية</button><label class="btn" for="rs">استعادة من نسخة احتياطية</label><input type="file" id="rs" accept=".json" hidden>${s.demo ? `<button class="btn danger" id="cd">مسح بيانات التشغيل الأولي</button>` : ""}</div><p class="hint" id="dmsg2"></p></div></div>
   <div class="card" style="margin-top:14px"><h3>مصادر الرصد الخارجي الآلي <small>تعمل عند ربط الخادم</small></h3><p class="hint" style="margin-top:0">روابط نشرات RSS لجهات رسمية وإخبارية موثوقة. يجلبها الخادم يومياً، ويُنشئ منها بطاقات «واردة» بانتظار التحقق عند مطابقة الكلمات المفتاحية.</p>
    <div id="feeds">${(s.feeds || []).map((f, i) => feedRow(f, i)).join("")}</div><div class="row"><button class="btn" id="fadd">إضافة مصدر</button><button class="btn pri" id="fsave">حفظ المصادر</button></div></div>`;
  $("#stf").onsubmit = async e => { e.preventDefault(); try { const r = await ST.call("settings", { s: { org: $("#s_org").value.trim() } }); S.db.settings = r.settings; toast("حُفظت الإعدادات."); } catch (x) { toast(x.message); } };
  $("#bk").onclick = async () => { try { const r = await ST.call("backup"), a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(r.backup, null, 1)], { type: "application/json" })); a.download = "marqab-backup-" + today() + ".json"; a.click(); toast("نُزّلت النسخة الاحتياطية."); } catch (x) { toast(x.message); } };
  $("#rs").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const b = JSON.parse(await f.text()); await ST.call("restore", { backup: b }); await load(); shell(); route(); toast("استُعيدت النسخة الاحتياطية."); } catch (x) { toast(x.message || "الملف غير صالح."); } };
  const cd = $("#cd"); if (cd) cd.onclick = async () => { if (!cd.dataset.ok) { cd.dataset.ok = 1; cd.textContent = "تأكيد المسح النهائي"; $("#dmsg2").textContent = "سيُمسح محتوى البطاقات والوثائق والقرارات وقيم المؤشرات. يُنصح بتنزيل نسخة احتياطية أولاً."; return; } try { await ST.call("clearDemo"); await load(); shell(); route(); toast("مُسحت بيانات التشغيل الأولي."); } catch (x) { toast(x.message); } };
  $("#fadd").onclick = () => { const d = document.createElement("div"); d.innerHTML = feedRow({}, $$("#feeds .frow").length); $("#feeds").appendChild(d.firstElementChild); };
  $("#fsave").onclick = async () => { const feeds = $$("#feeds .frow").map(r => ({ name: r.querySelector("[data-f=name]").value, url: r.querySelector("[data-f=url]").value, rel: r.querySelector("[data-f=rel]").value, kw: r.querySelector("[data-f=kw]").value })).filter(f => /^https:\/\//.test(f.url)); try { const r = await ST.call("settings", { s: { feeds } }); S.db.settings = r.settings; toast("حُفظت مصادر الرصد."); } catch (x) { toast(x.message); } };
}
const feedRow = (f, i) => `<div class="frow grid g4" style="gap:8px;margin-bottom:8px"><input class="inp" data-f="name" placeholder="اسم المصدر" value="${esc(f.name)}"><input class="inp ltr" data-f="url" placeholder="https://…/rss" value="${esc(f.url)}"><select class="inp" data-f="rel">${opts(Object.keys(META.rel).map(k => [k, "موثوقية " + k]), f.rel || "B")}</select><input class="inp" data-f="kw" placeholder="كلمات مفتاحية مفصولة بفواصل" value="${esc(f.kw)}"></div>`;

/* ---------- التشغيل ---------- */
applyTheme();
if (ST.hasToken()) start(); else landing();

})();
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
</script>
</body>
</html>
