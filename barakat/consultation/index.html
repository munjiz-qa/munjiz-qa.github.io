<title>استشارة تأسيس الشركة</title>
<style>
:root{--bg:#eef2f0;--surface:#fff;--ink:#17332b;--acc:#17594a;--line:#d6e0db}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--surface:#1a2420;--ink:#e3ece8;--acc:#7fcbb3;--line:#2b3a34}}
:root[data-theme="dark"]{--bg:#0f1714;--surface:#1a2420;--ink:#e3ece8;--acc:#7fcbb3;--line:#2b3a34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
header b{font-size:16px}
header a{background:var(--acc);color:#fff;text-decoration:none;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:12px 10px 32px;display:flex;flex-direction:column;gap:10px}
img{display:block;width:100%;height:auto;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
</style></head><body>
