<body style="font-family:Tahoma,sans-serif;padding:24px"><p>هبط الذهب إلى أدنى مستوى في 14 شهراً، فأنهى جلسة نيويورك الخميس عند 3,625.50 دولاراً للأونصة منخفضاً 98.60 دولاراً (2.65%)، ثم تراجع 0.6% في آسيا صباح الجمعة إلى 3,601.40 دولاراً، متجهاً إلى خسارة أسبوعية بنحو 7.3%. وهبطت الفضة 4.71% إلى 42.83 دولاراً للأونصة.</p><p><a href="../#i-w5">اقرأ الخبر بمصادره في «عبدو نيوز»</a></p></body></html>
