<body style="font-family:Tahoma,sans-serif;padding:24px"><p>تتجه الأنظار إلى قمة الأهلي وبيراميدز في الجولة التاسعة من الدوري المصري الممتاز يوم الاثنين 23 نوفمبر الساعة 8 مساءً بتوقيت القاهرة على استاد القاهرة الدولي، وتُنقل على قناة «أون سبورت». وكان الأهلي قد بلغ دور الستة عشر في كأس مصر بفوزه على السكة الحديد 3–0.</p><p><a href="../#i-e5">اقرأ الخبر بمصادره في «عبدو نيوز»</a></p></body></html>
