<body style="font-family:Tahoma,sans-serif;padding:24px"><p>تُسعّر «أنثروبيك» اليوم الأربعاء طرحها العام الأولي لـ825 مليون سهم في نطاق 70 إلى 78 دولاراً، مع طلبات تقارب سبعة أضعاف المعروض وتقارير عن تسعير عند أعلى النطاق أو فوقه، بتقييم يصل إلى 1.4 تريليون دولار، على أن يبدأ التداول الخميس في «ناسداك» بالرمز ANT.</p><p><a href="../#i-w4">اقرأ الخبر بمصادره في «عبدو نيوز»</a></p></body></html>
