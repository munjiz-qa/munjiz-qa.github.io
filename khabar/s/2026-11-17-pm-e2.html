<body style="font-family:Tahoma,sans-serif;padding:24px"><p>ارتفع الدولار ارتفاعاً طفيفاً أمام الجنيه في ختام تعاملات الثلاثاء: سجّل في البنك الأهلي وبنك مصر 53.67 جنيه للشراء و53.77 جنيه للبيع، وفي البنك التجاري الدولي 53.62 و53.72 جنيه، وفي البنك المركزي 53.66 و53.80 جنيه، مقارنة بـ53.63 و53.73 جنيه صباحاً في البنك الأهلي.</p><p><a href="../#i-e2">اقرأ الخبر بمصادره في «خبر»</a></p></body></html>
