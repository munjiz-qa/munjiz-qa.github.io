<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phones; content column capped near 70ch for chat, wider for lists */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --sunk:#E6EDEA; --ink:#0F2F2C; --muted:#56706B; --line:#D2DDD9;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#D5EEE6; --amber:#B4741A; --amber-soft:#F6E7CC;
  --ok:#1D7C4D; --ok-soft:#DCF1E5; --warn:#9E620C; --warn-soft:#F8EBD3; --bad:#B23B3B; --bad-soft:#F6DEDE;
  --shadow:0 1px 2px rgba(15,47,44,.06),0 6px 24px rgba(15,47,44,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1514; --surface:#12201E; --sunk:#0E1A19; --ink:#E1ECE8; --muted:#92A8A3; --line:#233532;
  --accent:#3CC4A0; --accent-ink:#06231C; --accent-soft:#15352D; --amber:#E3AA48; --amber-soft:#3A2D16;
  --ok:#4FC98A; --ok-soft:#143322; --warn:#E3AA48; --warn-soft:#3A2D16; --bad:#EE7B7B; --bad-soft:#3A1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1514; --surface:#12201E; --sunk:#0E1A19; --ink:#E1ECE8; --muted:#92A8A3; --line:#233532;
  --accent:#3CC4A0; --accent-ink:#06231C; --accent-soft:#15352D; --amber:#E3AA48; --amber-soft:#3A2D16;
  --ok:#4FC98A; --ok-soft:#143322; --warn:#E3AA48; --warn-soft:#3A2D16; --bad:#EE7B7B; --bad-soft:#3A1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.rail{background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding-block:18px;padding-inline:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:0}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.mark{width:36px;height:36px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav svg{width:19px;height:19px;flex:none}
.count{margin-inline-start:auto;background:var(--amber);color:#fff;border-radius:99px;font-size:11px;min-width:20px;padding:0 6px;text-align:center;font-family:var(--f-mono)}
.rail .who{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted);display:grid;gap:6px}
.main{overflow-y:auto;min-width:0}
.page{max-width:1080px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.tabbar{display:none}
.topbar{display:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .rail{display:none}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar b{font-family:var(--f-display);font-size:19px}
  .topbar .mark{width:30px;height:30px}
  .topbar .role{margin-inline-start:auto}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative;cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar svg{width:21px;height:21px}
  .tabbar .count{position:absolute;top:3px;inset-inline-start:52%;font-size:10px;min-width:17px}
  .head h1{font-size:22px}
}

/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.role{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.sec{display:grid;gap:12px;margin-top:22px}
.sec>h2{font-size:17px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.row .body{min-width:0;flex:1 1 240px;display:grid;gap:2px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row h3{font-size:15px;font-family:var(--f-body);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
form.f{display:grid;gap:12px}
.fr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
label.l{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;color:var(--ink);font-size:15px}
textarea.i{resize:vertical;min-height:80px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.daylabel{font-weight:600;font-size:14px;color:var(--muted);margin-top:6px}
.time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:2px 8px;direction:ltr;display:inline-block}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-family:var(--f-mono);cursor:pointer;direction:ltr}
.slots button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:var(--r);padding:12px 14px}
.banner.acc{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.prose{white-space:normal;overflow-wrap:anywhere}
.prose p{margin:0 0 8px}.prose p:last-child{margin:0}
.prose ul{margin:4px 0 8px;padding-inline-start:20px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:14px;margin:0}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;height:100%;max-width:820px;margin:0 auto}
.chatpage{height:100%;display:flex;flex-direction:column}
.thread{overflow-y:auto;padding-block:18px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.msg{display:grid;gap:6px;max-width:92%}
.msg.u{align-self:flex-start;justify-items:start}
.msg.a{align-self:flex-end;justify-items:start}
.bub{border-radius:14px;padding:10px 14px;min-width:0;max-width:100%}
.msg.u .bub{background:var(--accent);color:var(--accent-ink);border-start-start-radius:4px}
.msg.a .bub{background:var(--surface);border:1px solid var(--line);border-start-end-radius:4px}
.steps{display:flex;flex-direction:column;gap:4px;width:100%}
.step{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:4px 10px}
.step i{width:7px;height:7px;border-radius:99px;background:var(--muted);flex:none}
.step.done i{background:var(--ok)}.step.err i{background:var(--bad)}.step.run i{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.plan{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;width:100%}
.plan b{font-size:13px;color:var(--muted);font-weight:600}
.plan ol{margin:4px 0 0;padding-inline-start:22px;font-size:14px}
.plan li.d{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ok)}
.msgacts{display:flex;gap:4px}
.composer{padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cbox{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.cbox textarea{flex:1;border:0;background:none;resize:none;max-height:160px;min-height:40px;padding:8px 8px;outline:none;font-size:15px}
.icon{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon:hover{background:var(--sunk);color:var(--ink)}
.icon.send{background:var(--accent);color:var(--accent-ink)}
.icon.rec{background:var(--bad);color:#fff}
.icon svg{width:20px;height:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--accent)}
.hello{display:grid;gap:10px;justify-items:center;text-align:center;padding:30px 10px 10px;color:var(--muted)}
.hello .mark{width:58px;height:58px}
.hello h2{color:var(--ink);font-size:22px}

/* landing */
.hero{display:grid;gap:14px;padding:26px 0 8px}
.hero h1{font-size:clamp(28px,5vw,42px);font-weight:700;max-width:18ch}
.hero p{font-size:17px;color:var(--muted);max-width:56ch;margin:0}
.svc{display:grid;gap:4px}
.svc b{font-size:16px}
.toast{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;padding-inline:16px}
.toast div{background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:14px;box-shadow:var(--shadow);max-width:520px}
.toast div.bad{background:var(--bad);color:#fff}
.toast[hidden]{display:none}
.sheet{position:fixed;inset:0;background:rgba(5,20,18,.45);display:flex;align-items:flex-end;z-index:40}
.sheet>div{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:4px}
.sheet button.it{display:flex;gap:12px;align-items:center;border:0;background:none;padding:12px 8px;border-radius:10px;font-size:15px;cursor:pointer;text-align:start}
.sheet button.it:hover{background:var(--sunk)}
.sheet svg{width:20px;height:20px;color:var(--muted)}
.skel{display:grid;place-items:center;height:100%;gap:10px;color:var(--muted)}
.tbl{overflow-x:auto}
details.card summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
</style>

<div id="root" class="skel" style="height:100%">
  <div style="display:grid;justify-items:center;gap:10px">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" style="width:56px;height:56px"><rect x="2" y="2" width="44" height="44" rx="13" fill="var(--accent)"/><path d="M12 33h24" stroke="var(--accent-ink)" stroke-width="3.2" stroke-linecap="round"/><path d="M15.5 33V25M22 33V18M28.5 33V22M35 33v-4" stroke="var(--accent-ink)" stroke-width="3.2" stroke-linecap="round"/><circle cx="22" cy="12.5" r="2.4" fill="var(--amber)"/></svg>
    <b style="font-family:var(--f-display);font-size:22px;color:var(--ink)">سند</b>
    <span>يجهّز مساحة العمل…</span>
  </div>
</div>
<div class="toast" id="toast" hidden><div></div></div>
<input type="file" id="imgpick" accept="image/png,image/jpeg,image/webp" hidden>

<script>
(() => {
"use strict";
/* ---------- icons ---------- */
const P = {
  today:'<path d="M4 6h16M4 6v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V6M8 3v4M16 3v4M8 12h3v3H8z"/>',

  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>',

  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  img:'<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8"/>',
  speak:'<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  stop:'<rect x="7" y="7" width="10" height="10" rx="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  new:'<path d="M12 20h8M4 20l1-4L16 5l3 3L8 19z"/>'

function normPhone(raw){
  let d = toLatin(raw).replace(/[^\d+]/g,'');
  if(!d) return null;
  if(d.startsWith('00')) d = '+'+d.slice(2);
  if(d.startsWith('+')) d = d.slice(1);
  else if(/^05\d{8}$/.test(d)) d = '966'+d.slice(1);
  else if(/^5\d{8}$/.test(d)) d = '966'+d;
  else if(/^[3567]\d{7}$/.test(d)) d = '974'+d;
  if(/^974\d{8}$/.test(d)) return `+974 ${d.slice(3,7)} ${d.slice(7)}`;
  if(/^9665\d{8}$/.test(d)) return `+966 ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8)}`;
  if(/^966\d{8,9}$/.test(d)) return `+966 ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8)}`;
  if(d.length>=8 && d.length<=15) return '+'+d.replace(/^(\d{1,3})(\d+)$/,'$1 $2');
  return null;
}

/* ---------- safe calculator (no eval) ---------- */
function calc(expr){
  const s = toLatin(expr).replace(/[×x]/g,'*').replace(/÷/g,'/').replace(/,/g,'').replace(/\s+/g,'');
  let i = 0;
  const peek = () => s[i];
  function num(){ const m = s.slice(i).match(/^\d+(\.\d+)?/); if(!m) throw new Error('تعبير غير صالح'); i += m[0].length; let v = parseFloat(m[0]); if(peek()==='%'){ i++; v/=100; } return v; }
  function atom(){ if(peek()==='('){ i++; const v = add(); if(s[i++]!==')') throw new Error('قوس ناقص'); return v; } if(peek()==='-'){ i++; return -atom(); } if(peek()==='+'){ i++; return atom(); } return num(); }
  function pow(){ let v = atom(); if(peek()==='^'){ i++; v = Math.pow(v, pow()); } return v; }
  function mul(){ let v = pow(); while(peek()==='*'||peek()==='/'){ const o = s[i++]; const r = pow(); v = o==='*' ? v*r : v/r; } return v; }
  function add(){ let v = mul(); while(peek()==='+'||peek()==='-'){ const o = s[i++]; const r = mul(); v = o==='+' ? v+r : v-r; } return v; }
  const v = add(); if(i < s.length) throw new Error('تعبير غير صالح');
  if(!isFinite(v)) throw new Error('الناتج غير محدد');
  return Math.round(v*1e8)/1e8;
}

function freeSlots(date, duration){
  const st = site(); const dur = +duration || st.slot || 30;
  if(!st.days.includes(weekday(date))) return [];
  const now = riyadhNow();
  if(date < now.date) return [];
  const blocks = (S.realRole==='admin' ? apptBlocks() : S.busy.map(b => ({ date:b.d, from:toMin(b.t), to:toMin(b.t)+(+b.m||30) }))).filter(b => b.date===date);
  const out = [];
  for(let m = toMin(st.start); m + dur <= toMin(st.end); m += (+st.slot||30)){
    if(date===now.date && m <= toMin(now.time)) continue;
    if(blocks.some(b => m < b.to && m+dur > b.from)) continue;
    out.push(fromMin(m));
  }
  return out;
}

let ctl = null;
async function runAgent(text, opts={}){
  if(!S.sample){ toast('التحدث مع سند غير متاح في هذا العرض.','bad'); return; }
  if(S.running) return;
  const role = S.role;
  const user = { r:'u', text, t:nowISO() };
  const msg = { r:'a', text:'', steps:[], t:nowISO(), pending:true, brief:!!opts.brief };
  if(!opts.silent){ S.chat.push(user, msg); }
  S.running = msg; render(); scrollThread();
  const turns = [{ role:'user', content:instructions(role) + (opts.extra ? '\n\n'+opts.extra : '') }];
  if(!opts.silent){
    const hist = S.chat.slice(0,-2).slice(-14).filter(m => m.text);
    hist.forEach(m => turns.push({ role:m.r==='u'?'user':'assistant', content:m.text.slice(0,4000) }));
  }
  turns.push({ role:'user', content:text });
  const tools = toolsFor(role, msg).map(t => ({ ...t, execute: async (input, ctx) => {
    const step = { name:t.name, label:TOOL_LABEL[t.name]||t.name, st:'run' };
    if(t.name!=='plan') msg.steps.push(step); paintMsg(msg);
    try{ const r = await t.execute(input||{}, ctx); step.st = 'done';
      if(t.name!=='plan' && msg.plan) msg.planDone = Math.min(msg.plan.length, (msg.planDone||0)+1);
      paintMsg(msg); return r; }
    catch(e){ step.st = 'err'; step.err = errText(e); paintMsg(msg); throw new Error(errText(e)); }
  }}));
  ctl = new AbortController();
  try{
    const res = await S.sample(turns, { tools, signal:ctl.signal, onText:({ text }) => { msg.text = text; paintMsg(msg); scrollThread(); } });
    msg.text = res.text; if(msg.plan) msg.planDone = msg.plan.length;
    if(res.truncated) msg.text += '\n\n(اختُصر الرد لطوله.)';
  }catch(e){
    msg.text = (e.text||'') + (e.code==='cancelled' ? '' : `\n\n${errText(e)}`);
    if(e.code==='tools_unavailable'){ S.toolsMax = 0; }
  }finally{
    msg.pending = false; S.running = null; ctl = null;
    if(!opts.silent) saveChat();
    render(); scrollThread();
  }
  return msg;
}
function mdLite(s){
  const lines = esc(s).split('\n'); let html = '', inList = false;
  for(const raw of lines){
    const l = raw.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!inList){ html += '<ul>'; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if(inList){ html += '</ul>'; inList = false; }
    if(l.trim()==='') continue;
    html += `<p>${l.replace(/^#{1,4}\s*/,'')}</p>`;
  }
  if(inList) html += '</ul>';
  return html;
}
function msgInner(m){
  const plan = m.plan ? `<div class="plan"><b>الخطة</b><ol>${m.plan.map((s,i) => `<li class="${i < (m.planDone||0) ? 'd':''}">${esc(s)}</li>`).join('')}</ol></div>` : '';
  const steps = m.steps && m.steps.length ? `<div class="steps">${m.steps.map(s => `<div class="step ${s.st}"><i></i><span>${esc(s.label)}${s.st==='err' ? ' · '+esc(s.err||'تعذّر') : s.st==='run' ? '…' : ''}</span></div>`).join('')}</div>` : '';
  const body = m.text ? `<div class="bub prose">${mdLite(m.text)}</div>` : (m.pending ? `<div class="bub muted">${m.steps.length ? 'يعمل على المهمة…' : 'يفكر…'}</div>` : '');
  const acts = !m.pending && m.text ? `<div class="msgacts"><button class="btn ghost sm" data-act="speak" aria-label="استمع للرد">${ic('speak')} استمع</button><button class="btn ghost sm" data-act="copymsg" aria-label="انسخ الرد">${ic('copy')} نسخ</button></div>` : '';
  return plan + steps + body + acts;
}

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('الإدخال الصوتي غير مدعوم في هذا المتصفح. استخدم ميكروفون لوحة المفاتيح في جوالك.'); return; }
  if(S.rec){ S.rec.stop(); return; }
  try{
    const rec = new SR(); rec.lang = 'ar-SA'; rec.interimResults = true; rec.continuous = false;
    const box = document.getElementById('cin');
    rec.onresult = e => { box.value = Array.from(e.results).map(r => r[0].transcript).join(' '); };
    rec.onerror = e => { toast(e.error==='not-allowed' || e.error==='service-not-allowed' ? 'لم يُسمح بالميكروفون في هذا العرض. استخدم ميكروفون لوحة المفاتيح في جوالك.' : 'تعذّر التقاط الصوت.', 'bad'); };
    rec.onend = () => { S.rec = null; render(); };
    rec.start(); S.rec = rec; render();
  }catch{ toast('تعذّر تشغيل الميكروفون في هذا العرض.','bad'); }
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('القراءة الصوتية غير مدعومة في هذا المتصفح.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[*#]/g,'')); u.lang = 'ar-SA'; u.rate = 1;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ar')); if(v) u.voice = v;
  speechSynthesis.speak(u);
}

const clearDirty = f => { if(f) f.querySelectorAll('[id]').forEach(el => dirty.delete(el.id)); };
async function guarded(fn, ok, form){ try{ await fn(); clearDirty(form); if(ok) toast(ok); }catch(e){ toast(errText(e),'bad'); } finally { render(); } }
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){ S.tab = t.dataset.tab; S.sheet = false; if(t.dataset.tab!=='clients') S.clientPrefill = null; render(); const m = document.querySelector('.main'); if(m && S.tab!=='chat') m.scrollTop = 0; return; }
  const a = t.dataset.act, id = t.dataset.id;
  if(a==='closesheet'){ if(e.target===t){ S.sheet = false; render(); } return; }
  if(a==='more'){ S.sheet = true; render(); return; }
  if(a==='chip'){ runAgent(t.textContent); return; }
  if(a==='stop'){ ctl?.abort(); return; }
  if(a==='newchat'){ S.chat = []; saveChat(); render(); return; }
  if(a==='mic'){ startVoice(); return; }
  if(a==='speak'){ const i = +t.closest('[data-mid]').dataset.mid; speak(S.chat[i].text); return; }
  if(a==='copymsg'){ const i = +t.closest('[data-mid]').dataset.mid; copy(S.chat[i].text); return; }
  if(a==='scancard'){ document.getElementById('imgpick').click(); return; }
  if(a==='brief'){
    const r = await runAgent('اكتب ملخصاً تنفيذياً ليومي: استخدم status_overview، ثم اذكر المواعيد بالترتيب، وما ينتظر قراري، وأولوية واحدة مقترحة، وأي متابعة لازمة للعملاء الجدد. لا تنفّذ إجراءات، اقرأ فقط.', { silent:true, brief:true });
    if(r && r.text) store.set('brief', { date:riyadhNow().date, text:r.text, t:nowISO() }); render(); return;
  }
  if(a==='runroutine'){ runRoutine(id); return; }
  if(a==='delroutine'){ guarded(() => col('routines').doc(id).delete(), 'حُذف الروتين'); return; }
  if(a==='delmem'){ const m = S.memory.find(x => x.id===id); guarded(async () => { await col('memory').doc(id).delete(); logOp('حذف من الذاكرة', m?.fact, 'المدير'); }, 'حُذفت من الذاكرة'); return; }
  if(a==='cancelappt'){ if(t.dataset.sure){ guarded(() => cancelAppt(id), 'أُلغي الموعد'); } else { t.dataset.sure = '1'; t.textContent = 'تأكيد الإلغاء'; } return; }
  if(a==='confirmreq'){ t.disabled = true; guarded(() => confirmRequest(t.dataset.uid, t.dataset.bid), 'أُكّد الحجز وأُضيف للمواعيد'); return; }
  if(a==='declinereq'){ guarded(() => declineRequest(t.dataset.uid, t.dataset.bid, 'نعتذر، الموعد غير متاح. نرجو اختيار وقت آخر.'), 'أُبلغ العميل بالاعتذار'); return; }
  if(a==='approve'){ const body = S.drafts[id]; guarded(async () => { await col('approvals').doc(id).update({ status:'approved', body: body ?? S.approvals.find(x=>x.id===id).body, decidedAt:nowISO() }); delete S.drafts[id]; logOp('اعتماد رسالة', S.approvals.find(x=>x.id===id)?.to, 'المدير'); }, 'اعتُمدت الرسالة. أرسلها بضغطة من البطاقة'); return; }
  if(a==='reject'){ guarded(async () => { await col('approvals').doc(id).update({ status:'rejected', decidedAt:nowISO() }); logOp('رفض رسالة', S.approvals.find(x=>x.id===id)?.to, 'المدير'); }, 'رُفضت الرسالة'); return; }
  if(a==='marksent'){ guarded(async () => { await col('approvals').doc(id).update({ status:'sent', sentAt:nowISO() }); logOp('إرسال رسالة معتمدة', S.approvals.find(x=>x.id===id)?.to, 'المدير'); }, 'سُجّلت كمرسلة'); return; }
  if(a==='copybody'){ copy(S.approvals.find(x => x.id===id)?.body||''); return; }
  if(a==='useimproved'){ const ap = S.approvals.find(x => x.id===id); S.drafts[id] = ap.review.improved; render(); return; }
  if(a==='review'){
    const ap = S.approvals.find(x => x.id===id); const body = S.drafts[id] ?? ap.body;
    t.disabled = true; t.textContent = 'يراجع…';
    try{
      const r = await S.sample.json(`أنت مراجع جودة مستقل لرسائل العملاء في «${site().name}». قيّم الرسالة التالية (${ap.channel==='email'?'بريد':'واتساب'}) من حيث الوضوح واللباقة المهنية والدقة وملاءمة الطول، وابحث عن أي وعد غير مؤكد أو معلومة ناقصة. أعد JSON فقط: {"score":1-10,"issues":["..."],"improved":"صياغة محسّنة كاملة"}\n\nالرسالة:\n${body}`, { modelTier:'quick' });
      await col('approvals').doc(id).update({ review:{ score:Number(r.score)||0, issues:(r.issues||[]).map(String).slice(0,5), improved:String(r.improved||'') } });
    }catch(err){ toast(errText(err),'bad'); }
    render(); return;
  }
  if(a==='askclient'){ const c = S.clients.find(x => x.id===id); S.tab = 'chat'; render(); runAgent(`اكتب رسالة متابعة مهنية قصيرة للعميل ${c.name} (${c.phone||c.email}) بخصوص: ${c.need||'اهتمامه بخدماتنا'}. استخدم ${c.phone?'واتساب':'البريد'} وضعها للموافقة.`); return; }
  if(a==='apptview'){ S.apptView = t.dataset.v; render(); return; }
  if(a==='pickslot'){ S.booking.time = t.dataset.t; render(); return; }
  if(a==='cancelmine'){ guarded(() => cancelMyBooking(id), 'أُلغي الطلب'); return; }
  if(a==='preview'){ S.preview = t.dataset.r; S.role = t.dataset.r; S.tab = null; S.booking = {}; loadChat(); render(); toast(`تعرض التطبيق الآن كـ${ROLE_NAME[S.role]}`); return; }
  if(a==='endpreview'){ S.preview = null; S.role = 'admin'; S.tab = 'settings'; S.sheet = false; loadChat(); render(); return; }
});
function copy(text){ try{ navigator.clipboard.writeText(text).then(() => toast('نُسخ النص'), () => toast('حدد النص وانسخه يدوياً')); }catch{ toast('حدد النص وانسخه يدوياً'); } }
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id && t.id!=='clq' && !t.dataset.draft) dirty.add(t.id);
  if(t.id==='clq'){ S.clientQ = t.value; render(); }
  if(t.dataset.draft){ S.drafts[t.dataset.draft] = t.value; }
  if(t.id==='cin'){ t.style.height = 'auto'; t.style.height = Math.min(160, t.scrollHeight)+'px'; }
  if(t.id==='bk-note'){ S.booking.note = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='bk-svc'){ S.booking.service = t.value; S.booking.time = null; render(); }
  if(t.id==='bk-date'){ S.booking.date = t.value; S.booking.time = null; render(); }
  if(t.id==='logday'){ logDay = t.value; render(); }
  if(t.dataset.stage){ guarded(() => col('clients').doc(t.dataset.stage).update({ stage:t.value, updatedAt:nowISO() }), 'حُدّثت المرحلة'); }
  if(t.id==='imgpick' && t.files[0]){ const f = t.files[0]; t.value = ''; scanCard(f); }
});
document.addEventListener('keydown', e => { if(e.target.id==='cin' && e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); document.getElementById('cform').requestSubmit(); } });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; const fd = new FormData(f); const v = Object.fromEntries(fd.entries());
  if(f.id==='cform'){ const box = document.getElementById('cin'); const x = box.value.trim(); if(x){ box.value = ''; dirty.delete('cin'); runAgent(x); } return; }
  if(f.id==='clform'){ guarded(async () => { const r = await addClient({ ...v, source:S.clientPrefill?'بطاقة عمل':'يدوي' }); S.clientPrefill = null; f.reset(); if(r.existed) throw new Error(`العميل مسجل مسبقاً: ${r.name}`); }, 'سُجّل العميل', f); return; }
  if(f.id==='apform'){ guarded(async () => { await bookAppt({ ...v, source:'المدير' }); f.reset(); }, 'حُجز الموعد', f); return; }
  if(f.id==='memform'){ guarded(async () => { await remember(v.fact); f.reset(); }, 'أُضيفت إلى الذاكرة', f); return; }
  if(f.id==='roform'){ guarded(async () => { await addRoutine({ ...v, days:fd.getAll('days').map(Number) }); f.reset(); }, 'حُفظ الروتين', f); return; }
  if(f.id==='siteform'){
    guarded(async () => {
      const services = String(v.services||'').split('\n').map(l => l.split('|').map(s => s.trim())).filter(p => p[0]).map(p => ({ name:p[0], duration:Math.max(10, +toLatin(p[1])||30), price:p[2]||'' }));
      const ph = v.phone ? normPhone(v.phone) : ''; if(v.phone && !ph) throw new Error('هاتف التواصل غير صالح');
      const em = v.email ? normEmail(v.email) : ''; if(v.email && !em) throw new Error('بريد التواصل غير صالح');
      const days = fd.getAll('days').map(Number); if(!days.length) throw new Error('اختر يوم عمل واحداً على الأقل');
      if(toMin(v.end) <= toMin(v.start)) throw new Error('نهاية الدوام يجب أن تكون بعد بدايته');
      const doc = { name:normName(v.name), tagline:v.tagline.trim(), city:v.city.trim(), phone:ph||'', email:em||'', about:v.about.trim(), services, days, start:v.start, end:v.end, slot:Math.max(10, +v.slot||30), example:false, updatedAt:nowISO() };
      await S.db.doc('public/site').set(doc); S.site = doc; logOp('تحديث بيانات النشاط', doc.name, 'المدير');
    }, 'حُفظت بيانات النشاط', f); return;
  }
  if(f.id==='bkform'){ guarded(async () => { const r = await requestBooking({ service:v.service || site().services[0]?.name, date:S.booking.date || nextWorkday(riyadhNow().date), time:S.booking.time, note:v.note }); S.booking = {}; S.tab = 'mine'; }, 'أُرسل طلبك، وستتحدث حالته عند تأكيد الفريق', f); return; }
  if(f.id==='pfform'){ guarded(() => saveMyProfile(v), 'حُفظت بياناتك', f); return; }
});

/* ---------- boot ---------- */
async function boot(){
  const C = window.claude;
  const use = n => (C && C.use ? C.use(n).catch(() => null) : Promise.resolve(null));
  const [user, db, sample, mcp] = await Promise.all([use('user'), use('db'), use('sample'), use('mcp')]);
  S.user = user; S.db = db; S.sample = sample;
  let role = 'visitor';
  if(user && db){
    const [uid, edit, owner, w] = await Promise.all([user.id(), user.canEdit(), user.isOwner(), user.can('data.write')]);
    S.uid = uid; S.owner = owner;
    if(edit) role = 'admin'; else if(uid && w !== false) role = 'client';
  }
  if(role==='admin' && mcp) S.mcp = mcp;
  if(sample){ try{ const lim = await sample.limits(); S.toolsMax = lim.tools ? lim.tools.maxCount : 0; S.canImages = !!lim.images && role==='admin'; }catch{} }
  S.role = S.realRole = role;
  loadChat();
  if(db){
    watchDoc(db.doc('public/site'), d => { S.site = d; });
    watchDoc(db.doc('public/busy'), d => { S.busy = (d && d.slots) || []; });
    if(role==='admin'){
      watchCol(col('clients'), 'clients');
      watchCol(col('appointments'), 'appts', byWhen);
      watchCol(col('approvals'), 'approvals');
      watchCol(col('memory'), 'memory');
      watchCol(col('routines'), 'routines');
      watchCol(db.collection('portal'), 'portal');
      watchDoc(db.doc(`${OPS}/log/${riyadhNow().date}`), d => { S.logToday = d ? { day:d.day, entries:d.entries||[] } : { day:riyadhNow().date, entries:[] }; });
    }
    if(S.uid && role!=='visitor') watchDoc(db.doc(`portal/${S.uid}`), d => { S.myPortal = d; });
  }
  render();
}
boot();
setInterval(() => { if(S.role==='admin' && !document.activeElement?.matches('input,textarea,select')) render(); }, 60000);
})();
</script>
