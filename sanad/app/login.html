<div><b>سند</b><small id="biz">وكيلك التنفيذي الذكي</small></div></div>
  <div class="card">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-login" aria-selected="true">تسجيل الدخول</button>
      <button role="tab" id="t-reg" aria-selected="false">حساب جديد</button>
    </div>
    <form id="f-login" autocomplete="on">
      <label for="l-login">البريد أو رقم الجوال</label>
      <input id="l-login" name="username" autocomplete="username" required dir="ltr">
      <label for="l-pass">كلمة المرور</label>
      <input id="l-pass" type="password" autocomplete="current-password" required dir="ltr">
      <button class="btn pri full" type="submit">دخول</button>
    </form>
    <form id="f-reg" hidden autocomplete="on">
      <p class="muted small" style="margin:10px 0 0">أنشئ حسابك لتحجز مواعيدك وتتابع طلباتك مع الفريق مباشرة.</p>
      <label for="r-name">الاسم الكامل</label>
      <input id="r-name" autocomplete="name" required>
      <label for="r-phone">رقم الجوال</label>
      <input id="r-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+974 5XXX XXXX" required dir="ltr">
      <label for="r-email">البريد الإلكتروني <span class="hint">(اختياري)</span></label>
      <input id="r-email" type="email" autocomplete="email" dir="ltr">
      <label for="r-pass">كلمة المرور <span class="hint">(8 أحرف على الأقل)</span></label>
      <input id="r-pass" type="password" minlength="8" autocomplete="new-password" required dir="ltr">
      <button class="btn pri full" type="submit">إنشاء الحساب</button>
    </form>
    <div id="msg" class="msg" hidden></div>
  </div>
  <div class="card" id="demo" hidden>
    <h2 style="margin:0 0 6px;font-size:16px">جرّب سند بحساب جاهز</h2>
    <p class="muted small" style="margin:0 0 12px">اختر الحساب لتعبئة البيانات تلقائياً، ثم اضغط «دخول».</p>
    <div class="row" id="demo-btns"></div>
  </div>
  <p class="foot"><a href="./">العودة إلى الصفحة الرئيسية</a></p>
</main>
<script>
const $ = s => document.querySelector(s);
const show = (t, kind='bad') => { const m = $('#msg'); m.textContent = t; m.className = 'msg ' + kind; m.hidden = !t; };
function tab(reg){ $('#t-login').setAttribute('aria-selected', !reg); $('#t-reg').setAttribute('aria-selected', reg); $('#f-login').hidden = reg; $('#f-reg').hidden = !reg; show(''); }
$('#t-login').onclick = () => tab(false); $('#t-reg').onclick = () => tab(true);
async function post(url, data, btn){
  btn.disabled = true;
  try { const r = await fetch(url, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(data) }); const j = await r.json();
    if(!r.ok) throw new Error(j.message || 'تعذّر إتمام العملية'); location.href = './'; }
  catch(e){ show(e.message); btn.disabled = false; }
}
$('#f-login').onsubmit = e => { e.preventDefault(); post('api/login', { login:$('#l-login').value, password:$('#l-pass').value }, e.submitter || $('#f-login button')); };
$('#f-reg').onsubmit = e => { e.preventDefault(); post('api/register', { name:$('#r-name').value, phone:$('#r-phone').value, email:$('#r-email').value, password:$('#r-pass').value }, e.submitter || $('#f-reg button')); };
fetch('api/me').then(r => r.json()).then(me => {
  if(me.needsSetup) location.href = 'setup.html';
  if(me.user) location.href = './';
  if(!me.registration) $('#t-reg').hidden = true;
  if(me.demoAccounts && me.demoAccounts.length){
    $('#demo').hidden = false;
    $('#demo-btns').innerHTML = me.demoAccounts.map((a, i) => `<button class="btn" type="button" data-i="${i}">${a.label}</button>`).join('');
    $('#demo-btns').onclick = e => { const b = e.target.closest('[data-i]'); if(!b) return; const a = me.demoAccounts[b.dataset.i]; tab(false); $('#l-login').value = a.login; $('#l-pass').value = a.password; $('#l-pass').focus(); };
  }
  else if(location.hash === '#register') tab(true);
});
fetch('api/db/doc?path=public/site').then(r => r.json()).then(j => { if(j.data && j.data.name) $('#biz').textContent = j.data.name; }).catch(() => {});
</script>
