<style>
/* Layout: a single learning column under a sticky header; the home view pairs "today's step" with a progress panel, the path view climbs four weekly flights of steps. */
:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:right;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-decoration:none}

.tile.done .n{background:var(--ok-soft);color:var(--ok)}
.tile.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile.now .n{background:var(--accent);color:var(--on-accent)}
.tile.lock{opacity:.55;cursor:not-allowed}
.tile .tt{font-weight:600;font-size:.95rem;line-height:1.5}
.tile .ts{font-size:.8rem;color:var(--muted)}

.lesson{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.lesson article{display:flex;flex-direction:column;gap:18px}

.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}

.switch{display:flex;gap:10px;align-items:center;cursor:pointer}

task:"افتح محادثة جديدة في claude.ai وأرسل المثال أعلاه بعد تعديله ليناسب عملك. احتفظ بأفضل استخدامين اقترحهما.",
tip:"إن لم تفهم شيئاً في الجواب، اكتب ببساطة: اشرح هذه النقطة بمثال من واقعي.",
q:[["ما أهم ما يرفع جودة جواب Claude؟",["طول الرسالة","وضوح الهدف والسياق","استخدام الإنجليزية"],1,"الوضوح يغلب الطول دائماً، وClaude يفهم العربية جيداً."],
["Claude يعرف عنك في أول محادثة:",["كل شيء عن عملك","لا شيء إلا ما تخبره به","سجلّك الطبي"],1,"ما لم تخبره أو تضبط تفضيلاتك وذاكرتك، فهو يبدأ من الصفر."]]},

{n:2,w:1,m:7,t:"سرّ الطلب الجيد: الدور والمهمة والسياق والشكل",
p:["الطلب القوي فيه أربعة عناصر: <b>الدور</b> (تصرّف كخبير تسويق طبي)، <b>المهمة</b> (اكتب منشوراً)، <b>السياق</b> (لعيادة في القاهرة، والجمهور أولياء أمور)، و<b>الشكل</b> (خمسة أسطر مع دعوة للحجز).",
"قارن بين: \"اكتب منشوراً عن العيون\" وبين الطلب الكامل بعناصره الأربعة. الأول يعطيك نصاً عاماً، والثاني يعطيك نصاً جاهزاً للنشر.",
"لا يلزم أن يكون الطلب طويلاً، بل كاملاً. أربعة أسطر قصيرة تكفي غالباً."],
ex:"تصرّف كخبير تسويق طبي. اكتب منشوراً لفيسبوك عن أهمية فحص النظر الدوري للأطفال، لعيادة عيون في القاهرة، والجمهور أولياء أمور. اجعله خمسة أسطر بلغة ودودة، واختمه بدعوة للحجز.",
task:"اختر مهمة حقيقية من عملك، واكتب لها طلباً بالعناصر الأربعة. جرّبه في مختبر الطلب داخل هذا التطبيق لتعرف درجته.",
tip:"إذا لم تعجبك النتيجة، لا تبدأ من جديد. قل له ما الذي تريد تغييره بالضبط.",
q:[["أيّ مما يلي يمثّل عنصر السياق؟",["اكتب مقالاً","الجمهور أولياء أمور في القاهرة","في خمسة أسطر"],1,"السياق يصف الظروف والجمهور، أما الشكل فيصف هيئة الناتج."],
["\"في جدول من ثلاثة أعمدة\" يمثّل عنصر:",["الدور","المهمة","الشكل"],2,"هيئة الناتج المطلوب هي الشكل."]]},

{n:3,w:1,m:6,t:"علّم Claude بالمثال",
p:["بدلاً من أن تشرح الأسلوب الذي تريده، أرِ Claude مثالاً منه. المثال الواحد يختصر عشرة أسطر من الشرح.",
"إذا أردت ردوداً على استفسارات المرضى بأسلوب عيادتك، فالصق رداً كتبته سابقاً واطلب رداً جديداً بالأسلوب نفسه. سيلتقط Claude نبرتك وطول جملك وطريقة ترحيبك وختامك.",
"مثالان مختلفان أفضل من مثال واحد، لأن Claude يميّز حينها بين ما هو ثابت في أسلوبك وما هو متغيّر."],
ex:"هذان ردّان كتبتهما سابقاً على استفسارات المرضى:\n[الرد الأول]\n[الرد الثاني]\nاكتب بنفس الأسلوب رداً على هذا الاستفسار: هل الليزك مناسب لمن عمره 45 عاماً؟",
task:"خذ رسالتين كتبتهما بنفسك وأعجبتاك، وأعطهما لـClaude مثالاً، ثم اطلب نصاً جديداً بالروح نفسها.",
tip:"ضع الأمثلة بين علامتين واضحتين مثل [بداية المثال] و[نهاية المثال] حتى لا يختلط المثال بالمطلوب.",
q:[["لماذا يُفضَّل إعطاء مثالين بدل مثال واحد؟",["لأن Claude يرفض المثال الواحد","ليميّز الثابت من المتغيّر في أسلوبك","لزيادة طول الجواب"],1,"المقارنة بين مثالين تكشف النمط الحقيقي لأسلوبك."],
["المثال الجيد يغني غالباً عن:",["شرح طويل للأسلوب","تحديد المهمة","مراجعة النتيجة"],0,"المثال يختصر وصف الأسلوب، لكنه لا يغني عن المهمة ولا عن المراجعة."]]},

{n:4,w:1,m:7,t:"أعطِ Claude ملفاتك وصورك",
p:["Claude يقرأ ما ترفقه: ملفات PDF وWord وExcel والصور ولقطات الشاشة. اضغط زر الإرفاق أو اسحب الملف إلى المحادثة.",
"ارفع بحثاً من 30 صفحة واطلب ملخصاً في خمس نقاط لطبيب مشغول، أو صوّر جدولاً ورقياً واطلب تحويله إلى جدول Excel مرتب.",
"اطلب دائماً موضع المعلومة: \"في أي صفحة ورد ذلك؟\" لتتحقق بنفسك قبل الاعتماد على أي رقم مهم."],
ex:"لخّص هذا البحث في خمس نقاط لطبيب مشغول، ثم اذكر أهم نتيجة يمكن تطبيقها في العيادة، مع رقم الصفحة التي وردت فيها.",
task:"ارفع ملفاً حقيقياً من عملك واطلب شيئين: ملخصاً قصيراً، ثم ثلاثة أسئلة ذكية يجب أن تطرحها حول هذا الملف.",
tip:"لا ترفع بيانات مرضى تعريفية. احذف الأسماء والأرقام القومية قبل الرفع.",
q:[["أفضل طريقة للتحقق من معلومة مستخرجة من ملف طويل:",["أن تثق بها مباشرة","أن تسأل عن رقم الصفحة وتراجعها","أن تعيد رفع الملف"],1,"الإحالة إلى الصفحة تجعل التحقق سريعاً."],
["قبل رفع ملف فيه بيانات مرضى يجب:",["حذف البيانات التعريفية","تحويله إلى صورة","لا شيء"],0,"الخصوصية أولاً، وسنعود إليها في الدرس 20."]]},

{n:5,w:1,m:6,t:"الحوار المتدرّج: حسّن خطوة بخطوة",
p:["أقوى ما في Claude أنه يتذكّر المحادثة الجارية كلها. لذلك لا تبدأ من جديد إذا لم تعجبك النتيجة؛ ابنِ عليها.",
"استخدم جملاً قصيرة محددة: \"اجعله أقصر بالنصف\"، \"غيّر النبرة لتكون أكثر رسمية\"، \"احتفظ بالفقرة الثانية كما هي وأعد كتابة الباقي\".",
"إذا طالت المحادثة جداً وتشعّبت، اطلب ملخصاً لما اتفقتما عليه، ثم افتح محادثة جديدة بهذا الملخص."],
ex:"ممتاز. احتفظ بالعنوان كما هو، واجعل النص أقصر بالثلث، وأضف سؤالاً في البداية يشدّ القارئ.",
task:"خذ أي نص من تمرين سابق، وحسّنه بثلاث رسائل متتالية قصيرة، كل رسالة تغيّر شيئاً واحداً فقط.",
tip:"تعديل واحد في كل رسالة يعطيك تحكّماً أدق من قائمة طويلة من التعديلات دفعة واحدة.",
q:[["لم تعجبك النتيجة. ما الخطوة الأفضل؟",["فتح محادثة جديدة","تحديد ما تريد تغييره بالضبط في المحادثة نفسها","إعادة إرسال الطلب كما هو"],1,"Claude يبني على ما سبق، فالتعديل المحدد أسرع."],
["متى يفيد فتح محادثة جديدة؟",["بعد كل رسالتين","عندما تطول المحادثة وتتشعّب كثيراً","لا يفيد أبداً"],1,"لخّص الاتفاقات ثم ابدأ نظيفاً."]]},

{n:6,w:1,m:6,t:"التفضيلات الشخصية: اجعل Claude يعرفك",
p:["في الإعدادات تجد خانة التفضيلات الشخصية (Personal Preferences). ما تكتبه فيها يقرؤه Claude في كل محادثة جديدة تلقائياً.",
"اكتب فيها من أنت، وماذا تعمل، وكيف تحب الردود: باللغة العربية، مختصرة، بأمثلة طبية، بلا مقدمات طويلة.",
"هذه الخانة توفّر عليك تكرار التعريف بنفسك في كل مرة، وهي أول خطوة نحو مساعد يشبهك."],
ex:"أنا طبيب عيون وصاحب عيادة في القاهرة. أكتب لي بالعربية دائماً، بصياغة مهنية راقية ومختصرة، وابدأ بالجواب مباشرة، واستخدم أمثلة من بيئة العيادات.",
task:"افتح الإعدادات في claude.ai، واكتب تفضيلاتك الشخصية في ثلاثة إلى خمسة أسطر، ثم افتح محادثة جديدة ولاحظ الفرق.",
tip:"راجع تفضيلاتك كل شهر. ما تتعلّمه عن طريقتك في العمل يستحق أن يُضاف إليها.",
q:[["أين تكتب ما تريد أن يعرفه Claude عنك في كل محادثة؟",["في كل رسالة","في التفضيلات الشخصية بالإعدادات","في اسم المحادثة"],1,"التفضيلات تُقرأ تلقائياً مع كل محادثة جديدة."],
["أي سطر يناسب التفضيلات الشخصية؟",["لخّص هذا الملف","أكتب لي بالعربية دائماً بصياغة مختصرة","ما الطقس اليوم؟"],1,"التفضيلات قواعد دائمة، لا مهام لمرة واحدة."]]},

{n:7,w:1,m:10,t:"مراجعة الأسبوع: تحدٍّ يجمع كل ما سبق",
p:["أحسنت، أنهيت أسبوع الأساسيات. اليوم تجمع كل ما تعلّمته في مهمة واحدة حقيقية.",
"التحدي: ارفع ملفاً من عملك (تقرير أو عرض سعر أو بحث)، واكتب طلباً بالعناصر الأربعة، وأرفق مثالاً لأسلوبك، ثم حسّن النتيجة على ثلاث مراحل.",
"قيّم نفسك: هل وصلت إلى نتيجة قابلة للاستخدام الفعلي في أقل من 15 دقيقة؟ إن نعم، فقد امتلكت الأساس."],
ex:"تصرّف كمستشار إداري لعيادات. اقرأ تقرير الإيرادات المرفق، واكتب لي رسالة للشركاء بأسلوب هذا المثال: [مثال]. الرسالة في عشرة أسطر، تبدأ بأهم رقم وتنتهي بتوصية واحدة.",
task:"نفّذ التحدي على مهمة من عملك هذا الأسبوع، واكتب في ملاحظات الدرس ما الذي وفّره لك من وقت.",
tip:"احفظ أفضل طلباتك في ملف واحد. ستصبح مكتبتك الشخصية من الطلبات الجاهزة.",
q:[["ما العناصر الأربعة للطلب الجيد؟",["الدور والمهمة والسياق والشكل","العنوان والمقدمة والخاتمة والمراجع","اللغة والطول والخط واللون"],0,"هذه هي الركائز التي يُبنى عليها كل ما بعدها."],
["لتنقل أسلوبك إلى Claude بأسرع طريقة:",["اشرحه في فقرة طويلة","أعطه مثالاً أو مثالين","اتركه يخمّن"],1,"المثال أقوى من الوصف."],
["لم تعجبك الفقرة الثانية فقط. ماذا تفعل؟",["تطلب تعديل الفقرة الثانية فقط","تبدأ محادثة جديدة","تقبل النتيجة"],0,"التعديل المحدد في المحادثة نفسها هو الأسرع."]]},

{n:8,w:2,m:7,t:"المشاريع: نظّم عملك وتعليماته",
p:["المشروع (Project) في claude.ai مساحة عمل لموضوع واحد، مثل: \"تسويق العيادة\" أو \"الأبحاث\". كل محادثة داخله تشترك في تعليماته وملفاته.",
"تعليمات المشروع تشبه التفضيلات الشخصية، لكنها خاصة بهذا الموضوع: من الجمهور، ما النبرة، ما الممنوع.",
"بدلاً من شرح السياق في كل محادثة، تشرحه مرة واحدة في المشروع، وكل محادثة جديدة تبدأ وهي تعرفه."],
ex:"تعليمات المشروع: أنت مسؤول المحتوى لعيادة عيون في القاهرة. الجمهور أسر مصرية من الطبقة المتوسطة. النبرة ودودة وموثوقة. لا تذكر أسعاراً، ولا تقدّم تشخيصاً عبر الإنترنت.",
task:"أنشئ مشروعاً لأكثر موضوع تكرّره في عملك، واكتب له تعليمات من خمسة أسطر.",
tip:"اجعل لكل علامة تجارية أو نشاط مستقل مشروعاً مستقلاً، حتى لا تختلط التعليمات والهويات.",
q:[["ما فائدة تعليمات المشروع؟",["تُطبَّق على كل محادثات المشروع تلقائياً","تحذف المحادثات القديمة","تترجم الردود"],0,"تكتبها مرة وتعمل في كل محادثة داخله."],
["لديك نشاطان تجاريان مختلفان. الأفضل:",["مشروع واحد للاثنين","مشروع مستقل لكل نشاط","بلا مشاريع"],1,"الفصل يمنع تداخل الهويات والتعليمات."]]},

{n:9,w:2,m:6,t:"ملفات المعرفة في المشروع",
p:["يمكنك رفع ملفات دائمة إلى المشروع: دليل الخدمات، قائمة الأسئلة الشائعة، نماذج الردود، الهوية البصرية.",
"كل محادثة في المشروع ترجع إلى هذه الملفات عند الحاجة، فتأتي الإجابات متّسقة مع بياناتك الحقيقية بدلاً من معلومات عامة.",
"حدّث الملفات عندما تتغيّر بياناتك، واحذف القديم منها حتى لا يخلط Claude بين نسختين."],
ex:"اعتماداً على ملف الأسئلة الشائعة في المشروع فقط، أجب عن هذا الاستفسار، وإن لم تجد الإجابة في الملف فقل ذلك صراحة: هل تقبلون التأمين الصحي؟",
task:"ارفع إلى مشروعك ملفاً واحداً على الأقل يصف خدماتك، ثم اسأل سؤالاً لا يُجاب عنه إلا منه.",
tip:"عبارة \"إن لم تجد الإجابة في الملف فقل ذلك\" تحميك من الإجابات المُخمَّنة.",
q:[["لماذا ترفع ملفات المعرفة إلى المشروع؟",["لتكون الإجابات مبنية على بياناتك الحقيقية","لتسريع الإنترنت","لتصغير حجم الملفات"],0,"المعرفة الخاصة بك تُغني عن العموميات."],
["تغيّرت أسعار خدماتك. ماذا تفعل بملف الأسعار القديم؟",["تتركه وتضيف الجديد","تستبدله بالجديد","لا شيء"],1,"نسختان متعارضتان تربكان الإجابات."]]},

{n:10,w:2,m:8,t:"الأعمال الفنية: صفحات وأدوات تفاعلية",
p:["الأعمال الفنية (Artifacts) صفحات يبنيها Claude لك داخل المحادثة: آلة حاسبة، نموذج حجز، لوحة متابعة، اختبار تفاعلي، وحتى تطبيق كامل مثل هذا الذي تقرؤه الآن.",
"يمكن للعمل الفني أن يحفظ البيانات، ويُشارك برابط، بل ويستعين بـClaude نفسه من داخله، كما يفعل مختبر الطلب في هذا التطبيق.",
"اطلبه بوصف ما يجب أن يفعله المستخدم، لا بوصف الكود: \"أداة يُدخل فيها المريض عمره فتعرض له مواعيد الفحص الموصى بها\"."],
ex:"ابنِ لي أداة تفاعلية بالعربية يُدخل فيها المريض عمره وهل يرتدي نظارة، فتعرض له جدول فحوصات العيون الموصى بها، بتصميم أنيق يعمل على الجوال.",
task:"اطلب من Claude عملاً فنياً صغيراً يخدم عملك، ثم حسّنه برسالتين، وشارك رابطه مع زميل.",
tip:"اطلب دائماً أن يعمل على الجوال والكمبيوتر، وجرّبه بنفسك على الاثنين.",
q:[["كيف تطلب عملاً فنياً بأفضل صورة؟",["بوصف ما يفعله المستخدم به","بكتابة الكود بنفسك","بإرسال صورة فقط"],0,"صف التجربة، وClaude يتولّى التقنية."],
["هذا التطبيق الذي تتعلّم منه هو مثال على:",["عمل فني (Artifact)","ملف PDF","بريد إلكتروني"],0,"بُني بالكامل كعمل فني."]]},

{n:11,w:2,m:7,t:"المستندات والعروض التقديمية",
p:["يكتب Claude مستندات كاملة قابلة للتعديل والمشاركة والتصدير إلى Word وPDF، ويبني عروضاً تقديمية بشرائح جاهزة.",
"اطلب الهيكل أولاً، ثم المحتوى: \"اقترح عناوين عرض من عشر شرائح عن...\"، وبعد موافقتك اطلب ملء الشرائح.",
"يمكنك التعليق على أي فقرة داخل المستند وطلب تعديلها وحدها، تماماً كما تفعل مع زميل يحرّر معك."],
ex:"أعدّ عرضاً تقديمياً من ثماني شرائح لمؤتمر طبي عن جراحات تصحيح النظر الحديثة. ابدأ بعناوين الشرائح فقط، وانتظر موافقتي قبل كتابة المحتوى.",
task:"اطلب مستنداً أو عرضاً تحتاجه هذا الشهر، وابدأ بالهيكل قبل المحتوى.",
tip:"اطلب ملاحظات المتحدث مع كل شريحة لتكون جاهزاً للإلقاء.",
q:[["ما الترتيب الأمثل لطلب عرض تقديمي؟",["المحتوى كاملاً دفعة واحدة","الهيكل أولاً ثم المحتوى","التصميم أولاً"],1,"الهيكل المتفق عليه يوفّر إعادة الكتابة."],
["هل يمكن تصدير مستندات Claude إلى Word؟",["نعم","لا","فقط إلى صورة"],0,"تُصدَّر إلى Word وPDF وغيرهما."]]},

{n:12,w:2,m:7,t:"البحث في الويب والبحث المعمّق",
p:["يستطيع Claude البحث في الإنترنت للحصول على معلومات حديثة، مع ذكر المصادر.",
"أما البحث المعمّق (Research) فيقرأ عشرات المصادر ويقارن بينها ثم يكتب تقريراً منظماً، وقد يستغرق دقائق، وهو مناسب للأسئلة الكبيرة.",
"اطلب دائماً روابط المصادر، وافتح أهمها بنفسك، خاصة في المعلومات الطبية والأرقام."],

{n:16,w:3,m:7,t:"المهارات: ما هي وكيف تستخدمها",

{n:17,w:3,m:9,t:"أنشئ مهارة خاصة بك",
p:["أي عمل تكرّره بالطريقة نفسها يمكن أن يتحوّل إلى مهارة: كتابة تقرير طبي بقالب معيّن، الرد على شكاوى المرضى، إعداد منشور أسبوعي.",

<script>
(function(){
const TOTAL = LESSONS.length;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS_KEY = "teacher-state-v1";
const fmtDate = d => new Date(d).toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"long",year:"numeric"});
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

let S = blank();
let mode = "local";          // local | cloud
let sample = null, downloads = null;
let isAdmin = false, sequential = true, learnersUnsub = null, learners = [];
const CFG = window.TEACHER_CONFIG || {};
const TOK_KEY = "teacher-token-v1";
let token = null, me = null, allowSignup = true, adminTab = "users", adminLog = [];
let saveTimer = null;

function blank(){ return {done:{}, quiz:{}, ex:{}, notes:{}, reviewed:{}, days:[], remind:"09:00", certName:""}; }
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = Object.assign(blank(), JSON.parse(raw)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

function merge(a, b){
  const m = blank();
  for(const k of ["done","reviewed"]) m[k] = Object.assign({}, b[k], a[k]);
  for(const k of ["quiz","ex","notes"]) m[k] = Object.assign({}, b[k], a[k]);
  m.days = [...new Set([...(a.days||[]), ...(b.days||[])])].sort();
  m.remind = a.remind || b.remind || "09:00";
  m.certName = a.certName || b.certName || "";
  m.lab = a.lab || b.lab || "";
  return m;
}

function touch(){ const k = dayKey(); if(!S.days.includes(k)){ S.days.push(k); S.days.sort(); } }
function persist(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 700);
}
async function api(action, body){
  if(!CFG.API){
    try{ return await window.TeacherLocal.call(action, Object.assign({token}, body||{})); }
    catch(e){ if(e.code==="auth" && token) signOut(true); throw e; }
  }
  const r = await fetch(CFG.API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(Object.assign({action, token}, body||{}))});
  const j = await r.json();
  if(!j.ok){
    if(j.error==="auth" && token){ signOut(true); }
    const e = new Error(j.error||"error"); e.code = j.error; throw e;
  }
  return j;
}
const ERR = {invalid:"اسم المستخدم أو كلمة المرور غير صحيحة", locked:"محاولات كثيرة غير ناجحة، حاول بعد 15 دقيقة", disabled:"هذا الحساب موقوف، تواصل مع الإدارة",
  taken:"اسم المستخدم مستخدم من قبل", bad_username:"اسم المستخدم من 3 أحرف على الأقل، بالإنجليزية والأرقام فقط", bad_name:"اكتب الاسم",
  weak_password:"كلمة المرور 8 أحرف على الأقل", signup_closed:"التسجيل الذاتي مغلق حالياً، تواصل مع الإدارة", self:"لا يمكن تنفيذ هذا الإجراء على حسابك",
  last_admin:"يجب أن يبقى مدير واحد نشط على الأقل", forbidden:"هذه الصلاحية للإدارة فقط", auth:"انتهت الجلسة، سجّل الدخول مرة أخرى", offline:"نظام الحسابات غير مفعّل بعد", bad_file:"الملف غير صالح أو لا يحوي مديراً نشطاً", storage:"تعذّر الحفظ في المتصفح، تأكد أنه ليس في وضع التصفح الخاص", not_found:"المستخدم غير موجود", must_change:"لحماية حسابك، عيّن كلمة مرور جديدة قبل المتابعة", same_password:"اختر كلمة مرور مختلفة عن الحالية"};
const errMsg = e => ERR[e && e.code] || ERR[e && e.message] || "تعذّر الاتصال بالخادم، حاول مرة أخرى";
function summary(){ return {done:doneList(), xp:xp(), streak:streak(), quizAvg:quizAvg()}; }
async function pushCloud(){
  if(mode !== "cloud" || !token) return;
  try{ await api("saveProgress", {state:JSON.parse(JSON.stringify(S)), summary:summary()}); }catch(e){}
}
function signIn(j){
  token = j.token; me = j.user; isAdmin = me.role==="admin";
  if(j.settings){ sequential = j.settings.sequential; allowSignup = j.settings.allowSignup; }
  try{ localStorage.setItem(TOK_KEY, token); }catch(e){}
}
function signOut(expired){
  token = null; me = null; isAdmin = false; mode = "local"; learners = [];
  try{ localStorage.removeItem(TOK_KEY); }catch(e){}
  S = blank(); saveLocal();
  if(expired) toast(ERR.auth);
}
async function loadCloud(){
  const j = await api("getProgress");
  if(j.state) S = merge(S, j.state);
  mode = "cloud"; saveLocal(); await pushCloud();
}

/* ---------- derived ---------- */
const doneList = () => Object.keys(S.done).map(Number).filter(n=>S.done[n]).sort((a,b)=>a-b);
const doneCount = () => doneList().length;
function quizCorrect(n){ const r = S.quiz[n]; if(!r) return 0; const L = LESSONS[n-1]; return r.filter((v,i)=>v===L.q[i][2]).length; }
function xp(){ let x=0; for(const n of doneList()) x+=20; for(const k in S.quiz) x+=quizCorrect(+k)*5; for(const k in S.reviewed) if(S.reviewed[k]) x+=5; return x; }
function quizAvg(){ const ks = Object.keys(S.quiz); if(!ks.length) return 0; let c=0,t=0; for(const k of ks){ c+=quizCorrect(+k); t+=LESSONS[k-1].q.length; } return Math.round(c/t*100); }
function streak(){
  const set = new Set(S.days); let d = new Date(); let n = 0;
  if(!set.has(dayKey(d))){ d.setDate(d.getDate()-1); if(!set.has(dayKey(d))) return 0; }
  while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const RANKS = [[0,"الدرجة الأولى","مبتدئ"],[7,"الدرجة الثانية","مستكشف"],[14,"الدرجة الثالثة","ممارس"],[21,"الدرجة الرابعة","متمكّن"],[30,"القمة","محترف"]];
function rank(){ const d = doneCount(); let r = RANKS[0]; for(const x of RANKS) if(d>=x[0]) r=x; return r; }
function nextLesson(){ for(const L of LESSONS) if(!S.done[L.n]) return L.n; return TOTAL; }
function unlocked(n){ return !sequential || n===1 || !!S.done[n-1] || !!S.done[n]; }

/* ---------- routing ---------- */
function route(){ const h = (location.hash||"#home").slice(1); return h || "home"; }
function go(h){ if(location.hash === "#"+h) render(); else location.hash = h; window.scrollTo(0,0); }
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

function renderTabs(){
  const r = route();
  const items = [["home","اليوم"],["path","المسار"],["lab","مختبر الطلب"],["notes","دفتري"],["remind","التذكير"],["contact","تواصل"]];
  if(isAdmin) items.push(["admin","الإدارة"]);
  items.push(["account", me ? "حسابي" : "الدخول"]);
  $("#tabs").innerHTML = items.map(([k,t])=>`<a href="#${k}" class="${(r===k || (k==="path" && /^l\d+$/.test(r)))?"on":""}">${t}</a>`).join("");
}

function render(){
  renderTabs();
  const r = route();
  const v = $("#view");
  if(r==="path") v.innerHTML = viewPath();
  else if(/^l\d+$/.test(r)){ const n = +r.slice(1); if(n>=1 && n<=TOTAL){ v.innerHTML = viewLesson(n); if(unlocked(n)) bindLesson(n); } else v.innerHTML = viewHome(); }
  else if(r==="lab"){ v.innerHTML = viewLab(); bindLab(); }
  else if(r==="notes"){ v.innerHTML = viewNotes(); bindNotes(); }
  else if(r==="remind"){ v.innerHTML = viewRemind(); bindRemind(); }
  else if(r==="contact"){ v.innerHTML = viewContact(); }
  else if(me && me.mustChange && r==="admin"){ v.innerHTML = viewAccount(); bindAccount(); }
  else if(r==="admin" && isAdmin){ v.innerHTML = viewAdmin(); bindAdmin(); }
  else if(r==="account"){ v.innerHTML = viewAccount(); bindAccount(); }
  else { v.innerHTML = viewHome(); bindHome(); }
}

function storageBanner(){
  return mode==="cloud"
    ? `<div class="banner" role="status"><span aria-hidden="true">●</span><span>مرحباً ${esc(me&&me.name)}، تقدّمك محفوظ في حسابك${CFG.API?" ويتزامن بين أجهزتك":" على هذا الجهاز"}.</span></div>`
    : `<div class="banner" role="status"><span aria-hidden="true">○</span><span>تتعلّم الآن زائراً، وتقدّمك محفوظ في هذا المتصفح. <a href="#account">سجّل الدخول أو أنشئ حساباً</a> ${CFG.API?"ليُحفظ تقدّمك ويتزامن بين أجهزتك.":"ليُحفظ تقدّمك باسمك."}</span></div>`;
}

function ring(p, size=86){
  const r = size/2-8, c = 2*Math.PI*r, off = c*(1-p);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

function bindLesson(n){
  const L = LESSONS[n-1];
  $("#copyEx").addEventListener("click", ()=>copy(L.ex));
  const ex = $("#exAns"); ex.addEventListener("input", ()=>{ S.ex[n] = ex.value; persist(); });
  const note = $("#note"); note.addEventListener("input", ()=>{ S.notes[n] = note.value; persist(); });
  const chk = $("#check");
  if(chk) chk.addEventListener("click", ()=>{
    const a = L.q.map((_,i)=>{ const el = document.querySelector(`input[name=q${i}]:checked`); return el? +el.value : -1; });
    if(a.includes(-1)){ toast("أجب عن كل الأسئلة أولاً"); return; }
    S.quiz[n] = a; touch(); persist(); render();
    toast(quizCorrect(n)===L.q.length?"إجابات صحيحة كلها، أحسنت":"راجع التوضيح تحت كل سؤال");
  });
  const rt = $("#retry"); if(rt) rt.addEventListener("click", ()=>{ delete S.quiz[n]; persist(); render(); });
  const fin = $("#finish"); if(fin) fin.addEventListener("click", ()=>{
    S.done[n] = Date.now(); touch(); persist();
    toast(n===TOTAL?"مبارك، أتممت المنهج كاملاً":"أحسنت، صعدت درجة جديدة");
    go(n<TOTAL?"l"+(n+1):"home");
  });

}

async function reviewExercise(n){
  const L = LESSONS[n-1], text = (S.ex[n]||"").trim(), fb = $("#fb"), st = $("#revState");
  if(text.length < 15){ toast("اكتب إجابتك أولاً في خانة التمرين"); return; }
  fb.hidden = false;
  const prompt = `أنت مدرّب يعلّم طبيباً عربياً استخدام Claude باحتراف ضمن منهج من 30 درساً.
الدرس ${n}: ${L.t}
التمرين: ${L.task}
إجابة المتعلّم:
"""${text}"""
راجع الإجابة بالعربية الفصحى المهنية الراقية، دون مقدمات، وبهذا الترتيب تماماً:
التقييم: درجة من 10.
ما أحسنت فيه: سطر أو سطران.
تحسين واحد مهم: سطر أو سطران.
نسخة محسّنة: اكتب الطلب أو الحل بعد التحسين جاهزاً للنسخ.
لا تستخدم رموز Markdown.`;
  if(!sample){ fb.textContent = offlineReview(text); st.innerHTML = `مراجعة سريعة على الجهاز · <a href="https://claude.ai/new?q=${encodeURIComponent(prompt)}" target="_blank" rel="noopener">اطلب مراجعة كاملة من Claude</a>`; S.reviewed[n]=true; touch(); persist(); return; }
  fb.textContent = "يقرأ Claude إجابتك..."; st.textContent = "";
  try{
    const r = await sample(prompt, {onText:({text})=>{ fb.textContent = text || "يقرأ Claude إجابتك..."; }});
    fb.textContent = r.text; S.reviewed[n] = true; touch(); persist(); st.textContent = "راجعها Claude";
  }catch(e){
    if(e && e.code==="not_granted"){ sample = null; }
    fb.textContent = offlineReview(text); st.textContent = "تعذّر الوصول إلى Claude، فعرضنا مراجعة سريعة على الجهاز";
  }
}

const CHECKS = [
  ["الدور", /(تصرّف|تصرف|بصفتك|كأنك|أنت\s+(خبير|مسؤول|مستشار|طبيب|مدرّب|محرر|كاتب|مصمم))/],
  ["المهمة", /(اكتب|لخّص|لخص|ابن|ابنِ|أعدّ|أعد|اقترح|حلّل|حلل|ترجم|صمّم|صمم|أنشئ|رتّب|رتب|راجع|حوّل|حول|ابحث|قارن|أجب)/],
  ["السياق", /(الجمهور|لعيادة|لعملاء|للمرضى|لمرضى|لأن|بهدف|في القاهرة|موجّه|موجه|لفريق|لشركة|سياق|المرفق|الملف)/],
  ["الشكل", /(أسطر|سطر|جدول|نقاط|نقطة|كلمة|فقرة|شرائح|شريحة|بلغة|نبرة|بأسلوب|قائمة|عنوان|مختصر|بالعربية)/]
];
function heuristic(t){ return CHECKS.map(([k,re])=>[k, re.test(t)?25:(k==="المهمة"?10:0)]); }
function offlineReview(t){
  const h = heuristic(t), miss = h.filter(x=>x[1]<25).map(x=>x[0]);
  return `التقييم: ${Math.round(h.reduce((a,b)=>a+b[1],0)/10)} من 10.\n` + (miss.length? `ينقص طلبك: ${miss.join("، ")}. أضف ${miss.join(" و")} في سطر قصير لكل عنصر.` : "طلبك يغطي العناصر الأربعة، وهو جاهز للتجربة في Claude.");
}

function bindLab(){
  const inp = $("#labIn");
  inp.addEventListener("input", ()=>{ S.lab = inp.value; persist(); });
  $("#labGo").addEventListener("click", async ()=>{
    const t = inp.value.trim(); if(t.length<5){ toast("اكتب طلباً أولاً"); return; }
    const out = $("#labOut"), st = $("#labState");
    let res = null;
    if(sample){
      st.textContent = "يحلّل Claude طلبك...";
      try{
        res = await sample.json(`أنت خبير في كتابة الطلبات لـClaude. قيّم الطلب التالي من حيث أربعة عناصر، لكل عنصر درجة من 0 إلى 25: role (هل حدّد دوراً)، task (هل المهمة واضحة)، context (هل يشرح الجمهور والظروف والهدف)، format (هل حدّد شكل الناتج وطوله ونبرته).
الطلب: """${t}"""
أعد JSON فقط بهذا الشكل: {"role":0,"task":0,"context":0,"format":0,"feedback":"ملاحظتان قصيرتان بالعربية المهنية","improved":"نسخة محسّنة كاملة من الطلب بالعربية تحافظ على قصد صاحبه"}`);
        st.textContent = "حلّله Claude";
      }catch(e){ if(e && e.code==="not_granted") sample=null; res=null; }
    }
    if(!res){
      const h = heuristic(t); res = {role:h[0][1],task:h[1][1],context:h[2][1],format:h[3][1], feedback: offlineReview(t).split("\n")[1], improved:""};
      st.innerHTML = `تقييم سريع على الجهاز · <a href="https://claude.ai/new?q=${encodeURIComponent("أنت خبير في كتابة الطلبات لـClaude. قيّم طلبي التالي من حيث الدور والمهمة والسياق والشكل، ثم اقترح نسخة محسّنة:\n\n"+t)}" target="_blank" rel="noopener">اطلب تحليلاً كاملاً من Claude</a>`;
    }
    const k = [["الدور",res.role],["المهمة",res.task],["السياق",res.context],["الشكل",res.format]].map(([a,b])=>[a,Math.max(0,Math.min(25,Math.round(+b||0)))]);
    const total = k.reduce((a,b)=>a+b[1],0);
    out.innerHTML = `<div class="card stack">

function bindRemind(){

  const draw = ()=>{
    const [hh,mm] = (S.remind||"09:00").split(":"); const d = new Date(); d.setDate(d.getDate()+1);
    const st = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh, +mm), en = new Date(st.getTime()+15*60000);
    const g = x => dayKey(x).replace(/-/g,"")+"T"+String(x.getHours()).padStart(2,"0")+String(x.getMinutes()).padStart(2,"0")+"00";
    const title = "درس معلم اليومي", det = "درجة جديدة نحو احتراف Claude. افتح تطبيق معلم وابدأ درس اليوم.";
    const gUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+g(st)+"/"+g(en)+"&recur="+encodeURIComponent("RRULE:FREQ=DAILY;COUNT=30")+"&details="+encodeURIComponent(det);
    const oUrl = "https://outlook.live.com/calendar/0/deeplink/compose?subject="+encodeURIComponent(title)+"&body="+encodeURIComponent(det)+"&startdt="+encodeURIComponent(st.toISOString())+"&enddt="+encodeURIComponent(en.toISOString());

const LOGN = {setup:"تهيئة", login:"دخول", register:"تسجيل حساب", changePassword:"تغيير كلمة المرور", createUser:"إضافة مستخدم", updateUser:"تعديل مستخدم", resetPassword:"تعيين كلمة مرور", deleteUser:"حذف مستخدم", resetProgress:"تصفير تقدّم", setSettings:"تعديل الإعدادات", exportData:"تصدير نسخة", importData:"استيراد نسخة"};
async function loadAdmin(){
  try{
    const [u, l] = await Promise.all([api("listUsers"), api("getLog")]);
    learners = u.users; adminLog = l.log;
  }catch(e){ toast(errMsg(e)); }
  if(route()==="admin"){ $("#view").innerHTML = viewAdmin(); bindAdmin(); }
}
function bindAdmin(){
  document.querySelectorAll("[data-atab]").forEach(b=>b.addEventListener("click", ()=>{ adminTab = b.dataset.atab; $("#view").innerHTML = viewAdmin(); bindAdmin(); }));
  if(!learnersUnsub){ learnersUnsub = true; loadAdmin(); }
  const seq = $("#seq"); if(seq) seq.addEventListener("change", async e=>{
    try{ const j = await api("setSettings", {sequential:e.target.checked}); sequential = j.settings.sequential; toast(sequential?"فُعّل الفتح بالتسلسل":"كل الدروس متاحة الآن"); }
    catch(err){ e.target.checked = !e.target.checked; toast(errMsg(err)); }
  });
  const su = $("#signup"); if(su) su.addEventListener("change", async e=>{
    try{ const j = await api("setSettings", {allowSignup:e.target.checked}); allowSignup = j.settings.allowSignup; toast(allowSignup?"التسجيل الذاتي مفتوح":"التسجيل الذاتي مغلق"); }
    catch(err){ e.target.checked = !e.target.checked; toast(errMsg(err)); }
  });
  const nu = $("#newUser"); if(nu) nu.addEventListener("submit", async e=>{
    e.preventDefault(); const f = Object.fromEntries(new FormData(nu));
    try{ await api("createUser", f); toast("أُضيف المستخدم"); learnersUnsub = null; loadAdmin(); }catch(err){ toast(errMsg(err)); }
  });
  const ex = $("#exp"); if(ex) ex.addEventListener("click", async ()=>{
    try{ const j = await api("exportData"); saveFile("Teacher-backup-"+dayKey()+".json", JSON.stringify(j.data,null,1), "application/json"); }catch(err){ toast(errMsg(err)); }
  });
  const im = $("#imp"); if(im) im.addEventListener("change", async ()=>{
    const f = im.files[0]; if(!f) return;
    try{ const data = JSON.parse(await f.text()); if(!confirm("استبدال بيانات هذا الجهاز بالنسخة المختارة؟")) return; await api("importData", {data}); toast("اكتمل الاستيراد"); learnersUnsub = null; loadAdmin(); }
    catch(err){ toast(err instanceof SyntaxError ? ERR.bad_file : errMsg(err)); }
  });
  const fd = $("#uFind"); if(fd) fd.addEventListener("input", ()=>{ const q = fd.value.trim().toLowerCase(); document.querySelectorAll("#uTable tbody tr").forEach(tr=>{ tr.hidden = q && !tr.dataset.q.includes(q); }); });
  const cv = $("#csv"); if(cv) cv.addEventListener("click", ()=>{
    const rows = [["الاسم","اسم المستخدم","الدور","الحالة","الدروس المكتملة","النقاط","أيام متتالية","دقة الاختبارات","آخر نشاط"]].concat(learners.map(x=>[x.name,x.username,x.role==="admin"?"مدير":"متعلّم",x.active?"نشط":"موقوف",(x.done||[]).length,x.xp||0,x.streak||0,(x.quizAvg||0)+"%",x.last||x.lastLogin||""]));
    saveFile("Teacher-users.csv", "﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"), "text/csv");
  });
  document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click", async ()=>{
    const x = learners.find(u=>u.id===b.dataset.id); if(!x) return;
    try{
      if(b.dataset.act==="role"){ await api("updateUser", {id:x.id, role:x.role==="admin"?"learner":"admin"}); toast("تغيّر الدور"); }
      else if(b.dataset.act==="active"){ await api("updateUser", {id:x.id, active:!x.active}); toast(x.active?"أُوقف الحساب":"فُعّل الحساب"); }
      else if(b.dataset.act==="pass"){ const pw = prompt("كلمة المرور الجديدة لـ "+x.name+" (8 أحرف على الأقل)"); if(!pw) return; await api("resetPassword", {id:x.id, password:pw}); toast("تغيّرت كلمة المرور"); }
      else if(b.dataset.act==="progress"){ if(!confirm("تصفير تقدّم "+x.name+"؟ لا يمكن التراجع.")) return; await api("resetProgress", {id:x.id}); toast("صُفّر التقدّم"); }
      else if(b.dataset.act==="delete"){ if(!confirm("حذف حساب "+x.name+" نهائياً؟")) return; await api("deleteUser", {id:x.id}); toast("حُذف الحساب"); }
      learnersUnsub = null; loadAdmin();
    }catch(err){ toast(errMsg(err)); }
  }));
}

function bindAccount(){

    catch(err){ $("#loginE").textContent = errMsg(err); busy(lf,false); }
  });
  const rf = $("#regF"); if(rf) rf.addEventListener("submit", async e=>{
    e.preventDefault(); busy(rf,true); $("#regE").textContent = "";
    try{ signIn(await api("register", Object.fromEntries(new FormData(rf)))); await loadCloud(); toast("أُنشئ حسابك، أهلاً "+me.name); go("home"); }
    catch(err){ $("#regE").textContent = errMsg(err); busy(rf,false); }
  });
  const o = $("#out"); if(o) o.addEventListener("click", async ()=>{ try{ await api("logout"); }catch(e){} signOut(); learnersUnsub = null; toast("سُجّل الخروج"); go("home"); });
  const nf = $("#nameF"); if(nf) nf.addEventListener("submit", async e=>{ e.preventDefault(); try{ const j = await api("updateProfile", Object.fromEntries(new FormData(nf))); me = j.user; toast("حُفظ الاسم"); render(); }catch(err){ toast(errMsg(err)); } });
  const pf = $("#pwF"); if(pf) pf.addEventListener("submit", async e=>{ e.preventDefault(); try{ const j = await api("changePassword", Object.fromEntries(new FormData(pf))); pf.reset(); const was = me.mustChange; if(j.user) me = j.user; toast("تغيّرت كلمة المرور"); if(was) go(isAdmin?"admin":"home"); }catch(err){ toast(errMsg(err)); } });
}

/* ---------- helpers ---------- */
function toast(m){ const t = document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("نُسخ"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("نُسخ"); }catch(_){ toast("حدّد النص وانسخه يدوياً"); } ta.remove(); }
}
async function saveFile(name, data, type){
  if(!downloads){ try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("حُفظ الملف"); }catch(e){ toast("لم يُحفظ الملف"); } return; }
  try{ const r = await downloads.save({filename:name, data:new Blob([data],{type})}); if(r && r.status==="saved") toast("حُفظ الملف"); }
  catch(e){ if(e && e.code!=="declined") toast("لم يُحفظ الملف"); }
}

/* ---------- boot ---------- */
loadLocal();
(function(){ const b = document.getElementById("fsBtn"); const el = document.documentElement; if(!el.requestFullscreen) return; b.hidden = false;
  const lbl = ()=>{ b.textContent = document.fullscreenElement ? "الخروج من ملء الشاشة" : "ملء الشاشة"; };
  b.addEventListener("click", async ()=>{ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await el.requestFullscreen(); }catch(e){ toast("افتح الرابط في المتصفح مباشرة لعرضه بملء الشاشة"); } });
  document.addEventListener("fullscreenchange", lbl); })();
render();

(async function connect(){
  try{ token = localStorage.getItem(TOK_KEY); }catch(e){}
  try{
    if(token){
      const j = await api("me"); me = j.user; isAdmin = me.role==="admin";
      sequential = j.settings.sequential; allowSignup = j.settings.allowSignup;
      await loadCloud();
    } else {
      const j = await api("publicSettings"); sequential = j.settings.sequential; allowSignup = j.settings.allowSignup;
    }
  }catch(e){}
  render();
})();
})();
</script>
